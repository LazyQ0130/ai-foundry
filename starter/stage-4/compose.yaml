services:
  db:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: stage4_learning
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${STAGE4_LOCAL_DB_PASSWORD:?Set STAGE4_LOCAL_DB_PASSWORD in a local .env file}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - stage4_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stage4_learning"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  stage4_pgdata:
