<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1684" viewBox="0 0 640 1684" role="img" aria-labelledby="title desc"><title id="title">四种单位，分别数边界</title><desc id="desc">独立场景分别展示零一多Step；重试在同Step；同份输出可有多个工具调用。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="1684" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">四种单位，分别数边界</text><text x="320" y="108" font-size="28" font-weight="400" text-anchor="middle">以下每张卡都是独立的一个Turn</text><rect x="28" y="150" width="584" height="216" rx="18" fill="#FCE5E3" stroke="#187A91" stroke-width="2"/><text x="320" y="194" font-size="32" font-weight="700" text-anchor="middle">零Step：首次拒绝</text><text x="320" y="241" font-size="28" font-weight="400" text-anchor="middle">turn/start → pre-step拒绝</text><text x="320" y="283" font-size="28" font-weight="400" text-anchor="middle">turn/end：blocked</text><text x="320" y="325" font-size="28" font-weight="400" text-anchor="middle">没有step/start，也没请求模型</text><rect x="28" y="426" width="584" height="174" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="470" font-size="32" font-weight="700" text-anchor="middle">一个Step：直接回答</text><text x="320" y="517" font-size="28" font-weight="400" text-anchor="middle">Step 1：Attempt 1 → 回答</text><text x="320" y="559" font-size="28" font-weight="400" text-anchor="middle">零工具，completed</text><rect x="28" y="660" width="584" height="258" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320" y="704" font-size="32" font-weight="700" text-anchor="middle">多个Step：两次工具反馈</text><text x="320" y="751" font-size="28" font-weight="400" text-anchor="middle">Step 1：请求 → 读README</text><text x="320" y="793" font-size="28" font-weight="400" text-anchor="middle">Step 2：请求 → 读TEST</text><text x="320" y="835" font-size="28" font-weight="400" text-anchor="middle">Step 3：请求 → 最终回答</text><text x="320" y="877" font-size="28" font-weight="400" text-anchor="middle">同一Turn，三次判断，两个工具</text><rect x="28" y="978" width="584" height="258" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320" y="1022" font-size="32" font-weight="700" text-anchor="middle">一个Step内部：请求重试</text><text x="320" y="1069" font-size="28" font-weight="400" text-anchor="middle">Step 1：Attempt 1失败</text><text x="320" y="1111" font-size="28" font-weight="400" text-anchor="middle">记录assistant/attempt</text><text x="320" y="1153" font-size="28" font-weight="400" text-anchor="middle">监听器retry → Attempt 2成功</text><text x="320" y="1195" font-size="28" font-weight="400" text-anchor="middle">只开一次Step，不重复接纳用户</text><rect x="28" y="1296" width="584" height="216" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="1340" font-size="32" font-weight="700" text-anchor="middle">一个Step可以有多个工具</text><text x="320" y="1387" font-size="28" font-weight="400" text-anchor="middle">Step 1：一份输出 → 工具A、B</text><text x="320" y="1429" font-size="28" font-weight="400" text-anchor="middle">两份结果提交后，Step 2回答</text><text x="320" y="1471" font-size="28" font-weight="400" text-anchor="middle">两个工具 ≠ 两个含工具的Step</text><text x="320" y="1572" font-size="28" font-weight="400" text-anchor="middle">Attempt按实际请求观察</text><text x="320" y="1614" font-size="28" font-weight="400" text-anchor="middle">assistant/attempt不是所有尝试的清单</text></svg>