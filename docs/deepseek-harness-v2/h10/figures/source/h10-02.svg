<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1876" viewBox="0 0 640 1876" role="img" aria-labelledby="title desc"><title id="title">活动占用与输入路线</title><desc id="desc">三种Phase和公开status差异；正常输入路由、维护锁存；领取先nextstep全量再nextturn一条。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="1876" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">活动占用与输入路线</text><text x="320" y="108" font-size="28" font-weight="400" text-anchor="middle">Phase不是Fiber状态，也不是公开status</text><rect x="28" y="150" width="584" height="174" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="194" font-size="32" font-weight="700" text-anchor="middle">idle：保存lastTurn</text><text x="320" y="241" font-size="28" font-weight="400" text-anchor="middle">唤醒 → 先占running → 启动Driver</text><text x="320" y="283" font-size="28" font-weight="400" text-anchor="middle">inject只入队，仍然等待</text><rect x="28" y="384" width="584" height="216" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320" y="428" font-size="32" font-weight="700" text-anchor="middle">maintenance：独占维护</text><text x="320" y="475" font-size="28" font-weight="400" text-anchor="middle">公开status仍是idle</text><text x="320" y="517" font-size="28" font-weight="400" text-anchor="middle">保存abort与wakeRequested</text><text x="320" y="559" font-size="28" font-weight="400" text-anchor="middle">唤醒先锁存；结束后复查并放行</text><rect x="28" y="660" width="584" height="216" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320" y="704" font-size="32" font-weight="700" text-anchor="middle">running：已有一个Driver</text><text x="320" y="751" font-size="28" font-weight="400" text-anchor="middle">保存abort、turn、step</text><text x="320" y="793" font-size="28" font-weight="400" text-anchor="middle">新输入进入Inbox，不再开Driver</text><text x="320" y="835" font-size="28" font-weight="400" text-anchor="middle">活动收束 → idle；需要时再唤醒</text><rect x="28" y="936" width="584" height="216" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="980" font-size="32" font-weight="700" text-anchor="middle">正常活动中的输入路由</text><text x="320" y="1027" font-size="28" font-weight="400" text-anchor="middle">followup → next-turn；唤醒</text><text x="320" y="1069" font-size="28" font-weight="400" text-anchor="middle">steer → next-step；唤醒</text><text x="320" y="1111" font-size="28" font-weight="400" text-anchor="middle">inject → next-step；不唤醒</text><rect x="28" y="1212" width="584" height="216" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320" y="1256" font-size="32" font-weight="700" text-anchor="middle">Turn开头怎样领取？</text><text x="320" y="1303" font-size="28" font-weight="400" text-anchor="middle">① 全部next-step：I、S</text><text x="320" y="1345" font-size="28" font-weight="400" text-anchor="middle">② 一个next-turn：F1</text><text x="320" y="1387" font-size="28" font-weight="400" text-anchor="middle">返回I、S、F1；F2仍待下一轮</text><rect x="28" y="1488" width="584" height="216" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320" y="1532" font-size="32" font-weight="700" text-anchor="middle">领取与消息接纳分开</text><text x="320" y="1579" font-size="28" font-weight="400" text-anchor="middle">splice事实先提交 → claimed通知</text><text x="320" y="1621" font-size="28" font-weight="400" text-anchor="middle">候选接纳 + 请求准备成功</text><text x="320" y="1663" font-size="28" font-weight="400" text-anchor="middle">之后才提交普通user/message</text><text x="320" y="1764" font-size="28" font-weight="400" text-anchor="middle">图按未取消活动绘制</text><text x="320" y="1806" font-size="28" font-weight="400" text-anchor="middle">abort后唤醒转投next-turn，见正文</text></svg>