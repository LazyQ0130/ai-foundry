<svg xmlns="http://www.w3.org/2000/svg" width="640" height="2506" viewBox="0 0 640 2506" role="img" aria-labelledby="title desc"><title id="title">一个Turn，三个Step</title><desc id="desc">用户经Agent入Inbox唤醒Driver；三个Step包含准备提交请求Assistant工具与边界；Session结果进入下一请求，最后停止复查。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="2506" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">一个Turn，三个Step</text><text x="320" y="108" font-size="28" font-weight="400" text-anchor="middle">箭头连接的卡片按时间向下读取</text><rect x="28" y="150" width="584" height="174" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="194" font-size="32" font-weight="700" text-anchor="middle">用户 → Agent入口 → Driver</text><text x="320" y="241" font-size="28" font-weight="400" text-anchor="middle">followup任务 → 入Inbox并唤醒</text><text x="320" y="283" font-size="28" font-weight="400" text-anchor="middle">Driver → Session：turn/start</text><path d="M320 328 V370" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="384" width="584" height="216" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320" y="428" font-size="32" font-weight="700" text-anchor="middle">每个候选Step都先准备</text><text x="320" y="475" font-size="28" font-weight="400" text-anchor="middle">Driver：领取 → 模型选择快照</text><text x="320" y="517" font-size="28" font-weight="400" text-anchor="middle">解析工具 → Prompt组装</text><text x="320" y="559" font-size="28" font-weight="400" text-anchor="middle">agent/pre-step决定是否接纳</text><path d="M320 604 V646" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="660" width="584" height="468" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320" y="704" font-size="32" font-weight="700" text-anchor="middle">Step 1：获取README</text><text x="320" y="751" font-size="28" font-weight="400" text-anchor="middle">Driver → Session：step/start</text><text x="320" y="793" font-size="28" font-weight="400" text-anchor="middle">准备请求并绑定；检查取消</text><text x="320" y="835" font-size="28" font-weight="400" text-anchor="middle">提交系统提示与本次用户输入</text><text x="320" y="877" font-size="28" font-weight="400" text-anchor="middle">Session历史 → 请求1 → LLM</text><text x="320" y="919" font-size="28" font-weight="400" text-anchor="middle">LLM → Driver：读README</text><text x="320" y="961" font-size="28" font-weight="400" text-anchor="middle">Driver → Session：Assistant</text><text x="320" y="1003" font-size="28" font-weight="400" text-anchor="middle">Driver → Tools：执行读取</text><text x="320" y="1045" font-size="28" font-weight="400" text-anchor="middle">Tools → Session：call、result</text><text x="320" y="1087" font-size="28" font-weight="400" text-anchor="middle">Driver → Session：step/end</text><path d="M320 1132 V1174" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="1188" width="584" height="426" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320" y="1232" font-size="32" font-weight="700" text-anchor="middle">Step 2：检查测试</text><text x="320" y="1279" font-size="28" font-weight="400" text-anchor="middle">再次准备候选 → step/start</text><text x="320" y="1321" font-size="28" font-weight="400" text-anchor="middle">请求准备 → 按需提交 → 派生历史</text><text x="320" y="1363" font-size="28" font-weight="400" text-anchor="middle">请求2含README结果 → LLM</text><text x="320" y="1405" font-size="28" font-weight="400" text-anchor="middle">LLM → Driver：读TEST</text><text x="320" y="1447" font-size="28" font-weight="400" text-anchor="middle">Driver → Session：Assistant</text><text x="320" y="1489" font-size="28" font-weight="400" text-anchor="middle">Driver → Tools：执行读取</text><text x="320" y="1531" font-size="28" font-weight="400" text-anchor="middle">Tools → Session：call、result</text><text x="320" y="1573" font-size="28" font-weight="400" text-anchor="middle">Driver → Session：step/end</text><path d="M320 1618 V1660" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="1674" width="584" height="342" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="1718" font-size="32" font-weight="700" text-anchor="middle">Step 3：生成答复</text><text x="320" y="1765" font-size="28" font-weight="400" text-anchor="middle">再次准备候选 → step/start</text><text x="320" y="1807" font-size="28" font-weight="400" text-anchor="middle">请求准备 → 按需提交 → 派生历史</text><text x="320" y="1849" font-size="28" font-weight="400" text-anchor="middle">请求3含两份结果 → LLM</text><text x="320" y="1891" font-size="28" font-weight="400" text-anchor="middle">LLM → Driver：最终答复，无工具</text><text x="320" y="1933" font-size="28" font-weight="400" text-anchor="middle">Driver → Session：Assistant</text><text x="320" y="1975" font-size="28" font-weight="400" text-anchor="middle">Driver → Session：step/end</text><path d="M320 2020 V2062" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="2076" width="584" height="258" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320" y="2120" font-size="32" font-weight="700" text-anchor="middle">结束候选，还要复查输入</text><text x="320" y="2167" font-size="28" font-weight="400" text-anchor="middle">completed且next-step为空</text><text x="320" y="2209" font-size="28" font-weight="400" text-anchor="middle">通知turn-stopping → 再检查为空</text><text x="320" y="2251" font-size="28" font-weight="400" text-anchor="middle">Driver → Session：turn/end</text><text x="320" y="2293" font-size="28" font-weight="400" text-anchor="middle">Agent公开status回idle，实例保留</text><text x="320" y="2394" font-size="28" font-weight="400" text-anchor="middle">Assistant为assistant/message的简写</text><text x="320" y="2436" font-size="28" font-weight="400" text-anchor="middle">省略逐块流、请求头差异和Prompt内部</text></svg>