<svg xmlns="http://www.w3.org/2000/svg" width="640" height="2470" viewBox="0 0 640 2470" role="img" aria-labelledby="title desc"><title id="title">边界不同，结尾也不同</title><desc id="desc">独立对比正常拒绝三处取消重试和错误工具结果，突出Step与请求消息接纳边界、重试条件。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="2470" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">边界不同，结尾也不同</text><text x="320" y="108" font-size="28" font-weight="400" text-anchor="middle">下列每行独立；均先确认Turn已开始</text><rect x="28" y="150" width="584" height="216" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320" y="194" font-size="32" font-weight="700" text-anchor="middle">正常答复</text><text x="320" y="241" font-size="28" font-weight="400" text-anchor="middle">step/start → 准备与提交 → 请求</text><text x="320" y="283" font-size="28" font-weight="400" text-anchor="middle">Assistant结算 → step/end</text><text x="320" y="325" font-size="28" font-weight="400" text-anchor="middle">无后续输入 → turn/end completed</text><rect x="28" y="426" width="584" height="216" rx="18" fill="#FCE5E3" stroke="#187A91" stroke-width="2"/><text x="320" y="470" font-size="32" font-weight="700" text-anchor="middle">首次pre-step拒绝</text><text x="320" y="517" font-size="28" font-weight="400" text-anchor="middle">turn/start → 领取 → reject</text><text x="320" y="559" font-size="28" font-weight="400" text-anchor="middle">零Step；零请求；无用户消息</text><text x="320" y="601" font-size="28" font-weight="400" text-anchor="middle">turn/end blocked</text><rect x="28" y="702" width="584" height="216" rx="18" fill="#FCE5E3" stroke="#187A91" stroke-width="2"/><text x="320" y="746" font-size="32" font-weight="700" text-anchor="middle">pre-step等待处取消</text><text x="320" y="793" font-size="28" font-weight="400" text-anchor="middle">取消 → 释放门 → 检查信号</text><text x="320" y="835" font-size="28" font-weight="400" text-anchor="middle">零Step；零请求；无消息接纳</text><text x="320" y="877" font-size="28" font-weight="400" text-anchor="middle">turn/end aborted</text><rect x="28" y="978" width="584" height="216" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320" y="1022" font-size="32" font-weight="700" text-anchor="middle">agent/request等待处取消</text><text x="320" y="1069" font-size="28" font-weight="400" text-anchor="middle">已有step/start，尚未提交输入</text><text x="320" y="1111" font-size="28" font-weight="400" text-anchor="middle">零请求 → step/end</text><text x="320" y="1153" font-size="28" font-weight="400" text-anchor="middle">turn/end aborted</text><rect x="28" y="1254" width="584" height="216" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320" y="1298" font-size="32" font-weight="700" text-anchor="middle">流给出partial后取消</text><text x="320" y="1345" font-size="28" font-weight="400" text-anchor="middle">已接纳输入；一Step、一请求</text><text x="320" y="1387" font-size="28" font-weight="400" text-anchor="middle">interrupted Assistant → step/end</text><text x="320" y="1429" font-size="28" font-weight="400" text-anchor="middle">turn/end aborted</text><rect x="28" y="1530" width="584" height="216" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="1574" font-size="32" font-weight="700" text-anchor="middle">规范化请求失败，允许retry</text><text x="320" y="1621" font-size="28" font-weight="400" text-anchor="middle">同Step：失败 → assistant/attempt</text><text x="320" y="1663" font-size="28" font-weight="400" text-anchor="middle">监听器retry → 再请求 → Assistant</text><text x="320" y="1705" font-size="28" font-weight="400" text-anchor="middle">step/end → turn/end completed</text><rect x="28" y="1806" width="584" height="216" rx="18" fill="#FCE5E3" stroke="#187A91" stroke-width="2"/><text x="320" y="1850" font-size="32" font-weight="700" text-anchor="middle">同类失败，无retry决策</text><text x="320" y="1897" font-size="28" font-weight="400" text-anchor="middle">失败 → assistant/attempt</text><text x="320" y="1939" font-size="28" font-weight="400" text-anchor="middle">step/end → turn/end error</text><text x="320" y="1981" font-size="28" font-weight="400" text-anchor="middle">不能把所有throw都画成重试</text><rect x="28" y="2082" width="584" height="216" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320" y="2126" font-size="32" font-weight="700" text-anchor="middle">工具主体抛错的本课夹具</text><text x="320" y="2173" font-size="28" font-weight="400" text-anchor="middle">Step 1提交错误tool/result</text><text x="320" y="2215" font-size="28" font-weight="400" text-anchor="middle">Step 2据此回答无法读取</text><text x="320" y="2257" font-size="28" font-weight="400" text-anchor="middle">turn/end completed ≠ 业务成功</text><text x="320" y="2358" font-size="28" font-weight="400" text-anchor="middle">无Step与无请求是两个不同判断</text><text x="320" y="2400" font-size="28" font-weight="400" text-anchor="middle">图只覆盖列明路径；更深恢复留H20</text></svg>