<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1740" viewBox="0 0 640 1740" role="img" aria-labelledby="title desc"><title id="title">Fiber：状态必须连着原因读</title><desc id="desc">普通插件的正常显式释放、启动失败清理与依赖失效恢复三条精选路径，非完整状态机。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="1740" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">Fiber：状态必须连着原因读</text><text x="320" y="108" font-size="28" font-weight="400" text-anchor="middle">普通非根实例：精选三条路径</text><rect x="36" y="155" width="568" height="128" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="198" font-size="32" font-weight="700" text-anchor="middle">PENDING</text><text x="320.0" y="240" font-size="28" font-weight="400" text-anchor="middle">等待必需服务</text><polyline points="320,283 320,318" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="327" width="568" height="128" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="370" font-size="32" font-weight="700" text-anchor="middle">LOADING</text><text x="320.0" y="412" font-size="28" font-weight="400" text-anchor="middle">依赖可用，正在初始化</text><polyline points="320,455 320,490" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="499" width="568" height="128" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="542" font-size="32" font-weight="700" text-anchor="middle">ACTIVE</text><text x="320.0" y="584" font-size="28" font-weight="400" text-anchor="middle">本次初始化完成</text><polyline points="320,627 320,662" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="671" width="568" height="128" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="714" font-size="32" font-weight="700" text-anchor="middle">UNLOADING</text><text x="320.0" y="756" font-size="28" font-weight="400" text-anchor="middle">显式释放：等待登记的清理</text><polyline points="320,799 320,834" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="843" width="568" height="128" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="886" font-size="32" font-weight="700" text-anchor="middle">DISPOSED</text><text x="320.0" y="928" font-size="28" font-weight="400" text-anchor="middle">uid 清空，实例永久移除</text><rect x="24" y="1050" width="592" height="225" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1093" font-size="30" font-weight="700" text-anchor="middle">失败：先清理，再保留错误</text><text x="320.0" y="1135" font-size="28" font-weight="400" text-anchor="middle">LOADING → UNLOADING → FAILED</text><text x="320.0" y="1173" font-size="28" font-weight="400" text-anchor="middle">加载时：apply / 校验失败</text><text x="320.0" y="1211" font-size="28" font-weight="400" text-anchor="middle">FAILED 不等于永久移除</text><rect x="24" y="1320" width="592" height="270" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1363" font-size="30" font-weight="700" text-anchor="middle">依赖失效：保留挂载意图</text><text x="320.0" y="1405" font-size="28" font-weight="400" text-anchor="middle">ACTIVE → UNLOADING → PENDING</text><text x="320.0" y="1443" font-size="28" font-weight="400" text-anchor="middle">服务恢复：PENDING → LOADING</text><text x="320.0" y="1481" font-size="28" font-weight="400" text-anchor="middle">成功后 ACTIVE，仍是同一实例</text><text x="320.0" y="1519" font-size="28" font-weight="400" text-anchor="middle">前提：没有另被显式 dispose</text><text x="320" y="1650" font-size="28" font-weight="400" text-anchor="middle">PENDING / FAILED 也能被显式释放</text><text x="320" y="1692" font-size="28" font-weight="400" text-anchor="middle">省略快速变化、重试与根 Fiber 特例</text></svg>