<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1510" viewBox="0 0 640 1510" role="img" aria-labelledby="title desc"><title id="title">父子关系 ≠ 服务依赖关系</title><desc id="desc">左侧父级释放并等待子级清理，另一个无关兄弟可继续；右侧服务消失和恢复驱动同一消费者重新加载，前提是未显式释放消费者。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="1510" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">父子关系 ≠ 服务依赖关系</text><text x="164" y="115" font-size="32" font-weight="700" text-anchor="middle">父子所有权</text><text x="476" y="115" font-size="32" font-weight="700" text-anchor="middle">必需服务依赖</text><rect x="24" y="165" width="280" height="155" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="164.0" y="208" font-size="28" font-weight="700" text-anchor="middle">父级挂载子级</text><text x="164.0" y="250" font-size="28" font-weight="400" text-anchor="middle">父持有子释放登记</text><polyline points="164,320 164,380" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="395" width="280" height="155" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="164.0" y="438" font-size="28" font-weight="700" text-anchor="middle">父级显式释放</text><text x="164.0" y="480" font-size="28" font-weight="400" text-anchor="middle">触发子级 dispose</text><polyline points="164,550 164,610" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="625" width="280" height="155" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="164.0" y="668" font-size="28" font-weight="700" text-anchor="middle">子级清理中</text><text x="164.0" y="710" font-size="28" font-weight="400" text-anchor="middle">父级等待子级结束</text><polyline points="164,780 164,840" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="855" width="280" height="155" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="164.0" y="898" font-size="28" font-weight="700" text-anchor="middle">父子 DISPOSED</text><text x="164.0" y="940" font-size="28" font-weight="400" text-anchor="middle">该实例永久移除</text><text x="164" y="1048" font-size="28" font-weight="400" text-anchor="middle">不连所有权边</text><rect x="24" y="1085" width="280" height="155" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="164.0" y="1128" font-size="28" font-weight="700" text-anchor="middle">另一个兄弟插件</text><text x="164.0" y="1170" font-size="28" font-weight="400" text-anchor="middle">无此依赖可继续</text><rect x="336" y="165" width="280" height="155" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="476.0" y="208" font-size="28" font-weight="700" text-anchor="middle">提供方服务消失</text><text x="476.0" y="250" font-size="28" font-weight="400" text-anchor="middle">Consumer 仍被挂载</text><polyline points="476,320 476,380" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="336" y="395" width="280" height="155" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="476.0" y="438" font-size="28" font-weight="700" text-anchor="middle">Consumer 失活</text><text x="476.0" y="480" font-size="28" font-weight="400" text-anchor="middle">UNLOADING 清理</text><polyline points="476,550 476,610" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="336" y="625" width="280" height="155" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="476.0" y="668" font-size="28" font-weight="700" text-anchor="middle">PENDING 等待</text><text x="476.0" y="710" font-size="28" font-weight="400" text-anchor="middle">保留实例 / uid</text><polyline points="476,780 476,840" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="336" y="855" width="280" height="155" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="476.0" y="898" font-size="28" font-weight="700" text-anchor="middle">服务恢复后加载</text><text x="476.0" y="940" font-size="28" font-weight="400" text-anchor="middle">LOADING → ACTIVE</text><polyline points="476,1010 476,1070" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="336" y="1085" width="280" height="155" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="476.0" y="1128" font-size="28" font-weight="700" text-anchor="middle">重新登记资源</text><text x="476.0" y="1170" font-size="28" font-weight="400" text-anchor="middle">同一 Consumer</text><text x="320" y="1300" font-size="28" font-weight="400" text-anchor="middle">左：所有权决定结构退出</text><text x="320" y="1342" font-size="28" font-weight="400" text-anchor="middle">右：服务可用性决定当前运行</text><text x="320" y="1384" font-size="28" font-weight="400" text-anchor="middle">右侧不是 Provider 的孩子</text><text x="320" y="1426" font-size="28" font-weight="400" text-anchor="middle">显式 dispose 后不会被依赖恢复唤醒</text><text x="320" y="1468" font-size="28" font-weight="400" text-anchor="middle">两种关系可叠加；省略配置组装</text></svg>