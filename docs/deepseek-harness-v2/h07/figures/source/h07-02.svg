<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1550" viewBox="0 0 640 1550" role="img" aria-labelledby="title desc"><title id="title">Effect：资源与退出方式配对</title><desc id="desc">on自动归属与原生定时器/连接显式effect配对，卸载启动清理；未登记清理可能残留。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="1550" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">Effect：资源与退出方式配对</text><text x="320" y="108" font-size="28" font-weight="400" text-anchor="middle">获取资源时，就要交出退出方式</text><rect x="36" y="155" width="568" height="140" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="198" font-size="32" font-weight="700" text-anchor="middle">日志插件的当前 Fiber</text><text x="320.0" y="240" font-size="28" font-weight="400" text-anchor="middle">资源与退出动作归同一所有者</text><polyline points="320,295 320,335 164,335 164,380" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="400" width="280" height="180" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="164.0" y="443" font-size="30" font-weight="700" text-anchor="middle">已经自动归属</text><text x="164.0" y="485" font-size="28" font-weight="400" text-anchor="middle">ctx.on 登记</text><text x="164.0" y="523" font-size="28" font-weight="400" text-anchor="middle">返回移除函数</text><polyline points="320,295 320,335 476,335 476,380" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="336" y="400" width="280" height="180" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="476.0" y="443" font-size="30" font-weight="700" text-anchor="middle">需要显式配对</text><text x="476.0" y="485" font-size="28" font-weight="400" text-anchor="middle">定时器 / 连接</text><text x="476.0" y="523" font-size="28" font-weight="400" text-anchor="middle">ctx.effect 包装</text><polyline points="164,580 164,630 320,630 320,680" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><polyline points="476,580 476,630 320,630 320,680" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="700" width="568" height="165" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="743" font-size="30" font-weight="700" text-anchor="middle">插件卸载：启动已登记 Disposer</text><text x="320.0" y="785" font-size="28" font-weight="400" text-anchor="middle">逆序启动，异步完成可能交错</text><text x="320.0" y="823" font-size="28" font-weight="400" text-anchor="middle">等待已登记清理，不等全部 Promise</text><polyline points="320,865 320,915" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="940" width="568" height="135" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="983" font-size="30" font-weight="700" text-anchor="middle">资源按你提供的释放逻辑退出</text><text x="320.0" y="1025" font-size="28" font-weight="400" text-anchor="middle">清理失败须查日志 / 外部证据</text><rect x="24" y="1140" width="592" height="220" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1183" font-size="30" font-weight="700" text-anchor="middle">反例：原生资源未交出清理入口</text><text x="320.0" y="1225" font-size="28" font-weight="400" text-anchor="middle">旧定时器继续 tick，连接可能残留</text><text x="320.0" y="1263" font-size="28" font-weight="400" text-anchor="middle">新版本再创建：重复心跳 / 监听</text><text x="320.0" y="1301" font-size="28" font-weight="400" text-anchor="middle">apply 返回不等于资源已退出</text><text x="320" y="1420" font-size="28" font-weight="400" text-anchor="middle">严格顺序：一个 Disposer 内依次 await</text><text x="320" y="1462" font-size="28" font-weight="400" text-anchor="middle">撤销 on 不自动取消已开始的回调</text><text x="320" y="1504" font-size="28" font-weight="400" text-anchor="middle">教学资源夹具；没有真实外部连接</text></svg>