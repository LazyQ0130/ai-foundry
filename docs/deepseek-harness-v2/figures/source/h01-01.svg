<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1000" viewBox="0 0 640 1000" role="img" aria-labelledby="title desc">
<title id="title">LLM、Agent 与 Harness</title><desc id="desc">Harness 提供运行环境与组合机制；Agent 围绕任务运行循环并调用模型；LLM 负责判断与生成。嵌套框表示职责关系，不是物理部署。</desc>
<defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#187A91" stroke-width="2"/></marker><marker id="back" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M11 1 L2 6 L11 11" fill="none" stroke="#187A91" stroke-width="2"/></marker></defs>
<rect width="640" height="1000" fill="#F3F9F8" rx="24"/>
<g font-family="Microsoft YaHei,Arial,sans-serif">
<text x="320" y="64" text-anchor="middle" font-size="34" font-weight="700" fill="#15394B">LLM、Agent 与 Harness</text>
<text x="320" y="110" text-anchor="middle" font-size="28" font-weight="400" fill="#15394B">AI Foundry · 源码基线 f3803c9</text>
<rect x="32" y="154" width="576" height="696" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/>
<text x="64" y="206" text-anchor="start" font-size="32" font-weight="700" fill="#15394B">Harness：运行环境与组合</text>
<rect x="64" y="250" width="512" height="424" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/>
<text x="96" y="303" text-anchor="start" font-size="30" font-weight="700" fill="#15394B">Agent：围绕任务运行循环</text>
<rect x="96" y="346" width="448" height="208" rx="18" fill="#F3F9F8" stroke="#187A91" stroke-width="2"/>
<text x="320" y="403" text-anchor="middle" font-size="32" font-weight="700" fill="#15394B">LLM：判断与生成</text>
<text x="320" y="455" text-anchor="middle" font-size="28" font-weight="400" fill="#15394B">回答，或提出工具调用</text>
<text x="320" y="503" text-anchor="middle" font-size="28" font-weight="400" fill="#15394B">提议仍需 Runtime 处理</text>
<text x="320" y="610" text-anchor="middle" font-size="28" font-weight="400" fill="#15394B">组织请求、工具与停止条件</text>
<text x="320" y="735" text-anchor="middle" font-size="28" font-weight="400" fill="#15394B">模型适配 · 工具 · 日志 · 策略</text>
<text x="320" y="788" text-anchor="middle" font-size="28" font-weight="400" fill="#15394B">资源所有权与生命周期</text>
<text x="320" y="908" text-anchor="middle" font-size="28" font-weight="400" fill="#15394B">框表示职责；模型服务可能在远端</text>
<text x="320" y="954" text-anchor="middle" font-size="28" font-weight="400" fill="#15394B">存在审批与沙箱 ≠ 已审计的生产安全</text>
</g>
</svg>
