<svg xmlns="http://www.w3.org/2000/svg" width="640" height="986" viewBox="0 0 640 986" role="img" aria-labelledby="title desc">
<title id="title">Cordis：Waterfall 环绕分发</title><desc id="desc">A 调用 next 后进入 B，B 调用 next 后进入默认实现；结果先返回 B 再返回 A。不调用 next 的监听器短路下游。Waterfall 可返回 Promise。</desc>
<defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#187A91" stroke-width="2"/></marker><marker id="back" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M11 1 L2 6 L11 11" fill="none" stroke="#187A91" stroke-width="2"/></marker></defs>
<rect width="640" height="986" fill="#F3F9F8" rx="24"/>
<g font-family="Microsoft YaHei,Arial,sans-serif">
<text x="320" y="64" text-anchor="middle" font-size="34" font-weight="700" fill="#15394B">Cordis：Waterfall 环绕分发</text>
<text x="320" y="110" text-anchor="middle" font-size="28" font-weight="400" fill="#15394B">AI Foundry · 源码基线 f3803c9</text>
<rect x="12" y="152" width="184" height="70" rx="12" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/>
<text x="104" y="198" text-anchor="middle" font-size="32" font-weight="700" fill="#15394B">监听器 A</text>
<path d="M104 224 V684" stroke="#187A91" stroke-width="2" stroke-dasharray="7 7"/>
<rect x="228" y="152" width="184" height="70" rx="12" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/>
<text x="320" y="198" text-anchor="middle" font-size="32" font-weight="700" fill="#15394B">监听器 B</text>
<path d="M320 224 V684" stroke="#187A91" stroke-width="2" stroke-dasharray="7 7"/>
<rect x="444" y="152" width="184" height="70" rx="12" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/>
<text x="536" y="198" text-anchor="middle" font-size="32" font-weight="700" fill="#15394B">默认实现</text>
<path d="M536 224 V684" stroke="#187A91" stroke-width="2" stroke-dasharray="7 7"/>
<text x="104" y="264" text-anchor="middle" font-size="27" font-weight="400" fill="#15394B">A before</text>
<path d="M110 300 H312" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arr)"/>
<text x="212" y="286" text-anchor="middle" font-size="28" font-weight="400" fill="#15394B">next()</text>
<text x="320" y="352" text-anchor="middle" font-size="27" font-weight="400" fill="#15394B">B before</text>
<path d="M326 390 H528" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arr)"/>
<text x="428" y="376" text-anchor="middle" font-size="28" font-weight="400" fill="#15394B">next()</text>
<text x="536" y="440" text-anchor="middle" font-size="28" font-weight="400" fill="#15394B">body</text>
<path d="M530 478 H328" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arr)"/>
<text x="428" y="465" text-anchor="middle" font-size="28" font-weight="400" fill="#15394B">返回结果</text>
<text x="320" y="530" text-anchor="middle" font-size="27" font-weight="400" fill="#15394B">B after</text>
<path d="M314 570 H112" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arr)"/>
<text x="212" y="557" text-anchor="middle" font-size="28" font-weight="400" fill="#15394B">返回结果</text>
<text x="104" y="626" text-anchor="middle" font-size="27" font-weight="400" fill="#15394B">A after</text>
<rect x="48" y="722" width="544" height="148" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/>
<text x="320" y="771" text-anchor="middle" font-size="32" font-weight="700" fill="#15394B">某层不调用 next()</text>
<text x="320" y="823" text-anchor="middle" font-size="28" font-weight="400" fill="#15394B">后续监听器与默认实现都不运行</text>
<text x="320" y="930" text-anchor="middle" font-size="28" font-weight="400" fill="#15394B">waterfall 可返回 Promise，调用方再 await</text>
</g>
</svg>
