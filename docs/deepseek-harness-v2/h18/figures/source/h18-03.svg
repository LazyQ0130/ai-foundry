<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1630" viewBox="0 0 640 1630" role="img"><title>有效字节，与未结束的任务</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#187A91" stroke-width="2"/></marker></defs><rect width="640" height="1630" fill="#F3F9F8"/>
<text x="32" y="57" font-size="32" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">有效字节，与未结束的任务</text>
<rect x="32" y="100" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/>
<text x="52" y="143" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">第一关：物理有效前缀</text>
<text x="52" y="187" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">半行 / 撕裂帧 → 后端读取有效记录</text>
<text x="52" y="229" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">read 不改文件；新 append 前修尾</text>
<text x="52" y="271" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">完整已提交损坏不能一律丢最后行</text>
<rect x="32" y="328" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/>
<text x="52" y="371" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">正常关闭的 Turn</text>
<text x="52" y="415" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">原始 turn/end 已存在</text>
<text x="52" y="457" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">interruptedTurnClosers → []</text>
<text x="52" y="499" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">保留历史，不重复造结果</text>
<rect x="32" y="556" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/>
<text x="52" y="599" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">开放尾：只有 Assistant 提议</text>
<text x="52" y="643" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">无对应 tool/call</text>
<text x="52" y="685" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">补 TOOL_NOT_STARTED 错误结果</text>
<text x="52" y="727" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">没有可引用的 call Seq</text>
<rect x="32" y="784" width="576" height="198" rx="15" fill="#FFF0D7" stroke="#78A7AC"/>
<text x="52" y="827" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">开放尾：有 call，缺结果</text>
<text x="52" y="871" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">补 TOOL_OUTCOME_UNKNOWN</text>
<text x="52" y="913" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">sourceEventSeqs 引用已记 call</text>
<text x="52" y="955" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">未知结果不授权重做副作用</text>
<rect x="32" y="1012" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/>
<text x="52" y="1055" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">再关闭尚未结束的边界</text>
<text x="52" y="1099" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">缺 Step 结尾 → step/end</text>
<text x="52" y="1141" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">开放 Turn → turn/end interrupted</text>
<text x="52" y="1183" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">普通批次追加；原前缀不改</text>
<rect x="32" y="1240" width="576" height="198" rx="15" fill="#FCE5E3" stroke="#78A7AC"/>
<text x="52" y="1283" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">恢复范围有限</text>
<text x="52" y="1327" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">不追溯修复已闭合 Step 的缺结果</text>
<text x="52" y="1369" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">不恢复外部连接 / 实时草稿</text>
<text x="52" y="1411" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">不保证外部操作恰好执行一次</text>
<text x="32" y="1602" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">固定 f3803c9 · 图中边界以正文为准</text>
</svg>