<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1470" viewBox="0 0 640 1470" role="img"><title>共同过去，分支拥有独立未来</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#187A91" stroke-width="2"/></marker></defs><rect width="640" height="1470" fill="#F3F9F8"/>
<text x="32" y="57" font-size="32" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">共同过去，分支拥有独立未来</text>
<rect x="32" y="100" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/>
<text x="52" y="143" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">X：从源事件 Seq9 分支</text>
<text x="52" y="187" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">源原始日志 16 条；9 是 tool/call</text>
<text x="52" y="229" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">包含切点：复制 0～9 共 10 条</text>
<text x="52" y="271" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">inheritedEventCount = 10</text>
<path d="M320 307 V363" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/>
<text x="350" y="342" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">构造 seed</text>
<rect x="32" y="388" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/>
<text x="52" y="431" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">子会话自有事件</text>
<text x="52" y="475" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">10：end-seed { inherited: true }</text>
<text x="52" y="517" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">11：UNKNOWN 结果，引用 call9</text>
<text x="52" y="559" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">12：step/end；13：turn/end forked</text>
<rect x="32" y="616" width="576" height="198" rx="15" fill="#FFF0D7" stroke="#78A7AC"/>
<text x="52" y="659" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">子初始 14 条，继承仍为 10</text>
<text x="52" y="703" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">marker 与 closer 不算继承</text>
<text x="52" y="745" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">父可能在切点后已经完成工具</text>
<text x="52" y="787" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Fork 的结果说明必须提醒这一点</text>
<rect x="32" y="844" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/>
<text x="52" y="887" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">两条未来分别追加</text>
<text x="52" y="931" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">父：原16 → 恢复17 → 新任务26</text>
<text x="52" y="973" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">子：分支14 → 新任务23</text>
<text x="52" y="1015" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">新用户输入不会串入另一份日志</text>
<rect x="32" y="1072" width="576" height="198" rx="15" fill="#FCE5E3" stroke="#78A7AC"/>
<text x="52" y="1115" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">新身份，不重做旧动作</text>
<text x="52" y="1159" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">普通 Fork 不自动设置 parentSession</text>
<text x="52" y="1201" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">不自动创建 runtime 子 Agent</text>
<text x="52" y="1243" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">持久分支需工厂取得自己的 writer</text>
<text x="32" y="1442" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">固定 f3803c9 · 图中边界以正文为准</text>
</svg>