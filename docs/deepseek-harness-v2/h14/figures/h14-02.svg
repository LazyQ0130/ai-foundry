<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1320" viewBox="0 0 640 1320" role="img"><title>三个 Waterfall，不同控制权</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#187A91" stroke-width="2"/></marker></defs><rect width="640" height="1320" fill="#F3F9F8"/>
<text x="32" y="57" font-size="32" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">三个 Waterfall，不同控制权</text>
<rect x="32" y="100" width="576" height="156" rx="15" fill="#FFF0D7" stroke="#78A7AC"/>
<text x="52" y="143" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">tools/pre-execute</text>
<text x="52" y="187" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">next() 取得下游决策；可短路</text>
<text x="52" y="229" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">allow / deny / ask / cancel</text>
<path d="M320 265 V321" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/>
<text x="350" y="300" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">最终 allow</text>
<rect x="32" y="346" width="576" height="156" rx="15" fill="#FCE5E3" stroke="#78A7AC"/>
<text x="52" y="389" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">guard：单调拒绝或不表态</text>
<text x="52" y="433" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">在前置决策和审批解析之后</text>
<text x="52" y="475" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">不是另一个可随意授权的 Waterfall</text>
<path d="M320 511 V567" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/>
<text x="350" y="546" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">未拒绝</text>
<rect x="32" y="592" width="576" height="156" rx="15" fill="#D9F4E9" stroke="#78A7AC"/>
<text x="52" y="635" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">tools/execute</text>
<text x="52" y="679" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">next() 等待工具；外层前后包装</text>
<text x="52" y="721" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">工具异常与 wrapper 异常出口不同</text>
<path d="M320 757 V813" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/>
<text x="350" y="792" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">projectContent</text>
<rect x="32" y="838" width="576" height="156" rx="15" fill="#DDEDF5" stroke="#78A7AC"/>
<text x="52" y="881" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">tools/post-execute</text>
<text x="52" y="925" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">accept：保留或替换 content / value</text>
<text x="52" y="967" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">block：转失败；随后 finalize</text>
<rect x="32" y="1020" width="576" height="198" rx="15" fill="#FFF0D7" stroke="#78A7AC"/>
<text x="52" y="1063" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">委托纪律</text>
<text x="52" y="1107" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">await / return next()；每层至多一次</text>
<text x="52" y="1149" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">普通拒绝可被已进入外层改写</text>
<text x="52" y="1191" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">guard 拒绝不因此重新开放主体</text>
<text x="32" y="1292" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">固定源码 f3803c9 · 教学简图</text>
</svg>