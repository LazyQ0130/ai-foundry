<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1612" viewBox="0 0 640 1612" role="img"><title>Web 的控制去程与状态回程</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#187A91" stroke-width="2"/></marker></defs><rect width="640" height="1612" fill="#F3F9F8"/><text x="32" y="57" font-size="32" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">Web 的控制去程与状态回程</text><rect x="32" y="110" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/><text x="52" y="153" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">Client 提交 Remote 调用</text><text x="52" y="197" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">remote.session.prompt(request)</text><text x="52" y="239" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Connection RPC 带 rpcId 与 args</text><text x="52" y="281" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">模型提议与 Host 权限另分层</text><path d="M320 332 V384" stroke="#187A91" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="350" y="365" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">控制去程</text><rect x="32" y="410" width="576" height="198" rx="15" fill="#FFF0D7" stroke="#78A7AC"/><text x="52" y="453" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">Host Connection → Gateway</text><text x="52" y="497" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">HTTP 信任与认证先决定 Peer</text><text x="52" y="539" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">公开方法 / 参数 / 资源 / 访问检查</text><text x="52" y="581" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">非 owner 可被 remote-access 拒绝</text><path d="M320 632 V684" stroke="#187A91" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="350" y="665" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">业务命令</text><rect x="32" y="710" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/><text x="52" y="753" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">SessionController → Agent</text><text x="52" y="797" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">解析 Session，必要时显式激活</text><text x="52" y="839" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">prompt 入队 → accepted 回执</text><text x="52" y="881" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">回执不表示模型或任务已完成</text><path d="M320 932 V984" stroke="#187A91" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="350" y="965" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">执行</text><rect x="32" y="1010" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/><text x="52" y="1053" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">AgentLoop → Session</text><text x="52" y="1097" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">模型 / 工具执行，追加领域事实</text><text x="52" y="1139" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">实时 Assistant 帧另有 revision</text><text x="52" y="1181" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">内存事件不等磁盘屏障</text><path d="M320 1232 V1284" stroke="#187A91" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="350" y="1265" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">状态回程</text><rect x="32" y="1310" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/><text x="52" y="1353" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">follow：先快照，再未覆盖增量</text><text x="52" y="1397" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">监听先建立，再读 opening snapshot</text><text x="52" y="1439" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">cursor 与 live baseline 各自跟进</text><text x="52" y="1481" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">新连接重拉，不重跑历史工具</text><text x="32" y="1584" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">固定 f3803c9 · 边界与条件见正文</text></svg>