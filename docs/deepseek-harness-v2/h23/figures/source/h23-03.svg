<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1834" viewBox="0 0 640 1834" role="img"><title>SDK：回执、活动区间和进程</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#187A91" stroke-width="2"/></marker></defs><rect width="640" height="1834" fill="#F3F9F8"/><text x="32" y="57" font-size="32" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">SDK：回执、活动区间和进程</text><rect x="32" y="110" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/><text x="52" y="153" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">客户端启动独立 Node 子进程</text><text x="52" y="197" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">选择 SDK Profile 或明确入口</text><text x="52" y="239" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">stdout 只放换行 JSON-RPC 帧</text><text x="52" y="281" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">持有者负责关闭与确认退出</text><path d="M320 332 V384" stroke="#187A91" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="350" y="365" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">请求 / 响应</text><rect x="32" y="410" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/><text x="52" y="453" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">initialize → 路由预检</text><text x="52" y="497" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">cwd / provider / model / capabilities</text><text x="52" y="539" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">握手成功才允许 prompt</text><text x="52" y="581" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">失败不暗换真实 Provider</text><path d="M320 632 V684" stroke="#187A91" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="350" y="665" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">入队</text><rect x="32" y="710" width="576" height="198" rx="15" fill="#FFF0D7" stroke="#78A7AC"/><text x="52" y="753" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">session/prompt → messageId</text><text x="52" y="797" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">只确认这条消息进入 Inbox</text><text x="52" y="839" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">通知无 id；响应关联请求 id</text><text x="52" y="881" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">session.event 只报新追加事实</text><path d="M320 932 V984" stroke="#187A91" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="350" y="965" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">执行 / 通知</text><rect x="32" y="1010" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/><text x="52" y="1053" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">选择等待边界</text><text x="52" y="1097" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">run：回执到根 Agent 下一次 idle</text><text x="52" y="1139" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">wait：再检查受管后代与根级活动</text><text x="52" y="1181" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">结果不是单 Prompt 的因果凭证</text><path d="M320 1232 V1284" stroke="#187A91" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="350" y="1265" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">结束</text><rect x="32" y="1310" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/><text x="52" y="1353" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">shutdown → 清理 → 退出</text><text x="52" y="1397" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">关闭子级与 Agent，释放写入者</text><text x="52" y="1439" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">客户端关闭阶梯确认进程退出</text><text x="52" y="1481" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">close 不删除持久 Session</text><rect x="32" y="1532" width="576" height="198" rx="15" fill="#FFF0D7" stroke="#78A7AC"/><text x="52" y="1575" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">新客户端 resumeSession(savedId)</text><text x="52" y="1619" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">相同存储 / 工作区，读取既有历史</text><text x="52" y="1661" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">恢复本身不提交新 Prompt</text><text x="52" y="1703" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">session(id) 只创建惰性句柄</text><text x="32" y="1806" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">固定 f3803c9 · 边界与条件见正文</text></svg>