<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1300" viewBox="0 0 640 1300" role="img"><title>入口不同，共享核心执行能力</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#187A91" stroke-width="2"/></marker></defs><rect width="640" height="1300" fill="#F3F9F8"/><text x="32" y="57" font-size="32" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">入口不同，共享核心执行能力</text><rect x="32" y="110" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/><text x="52" y="153" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">CLI：选择应用组合并启动</text><text x="52" y="197" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">dsh web / headless / sdk / acp</text><text x="52" y="239" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Profile = Bundle + Patch 组合</text><text x="52" y="281" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">CLI 启动器不是终端聊天界面</text><rect x="32" y="332" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/><text x="52" y="375" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">Web：Client 与 Host 分工</text><text x="52" y="419" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Client：模块加载、界面、交互</text><text x="52" y="461" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Connection：HTTP RPC + WS 流</text><text x="52" y="503" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Host：Gateway → SessionController</text><rect x="32" y="554" width="576" height="198" rx="15" fill="#FFF0D7" stroke="#78A7AC"/><text x="52" y="597" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">SDK：另一套 stdio 协议</text><text x="52" y="641" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">HarnessClient 持有运行时子进程</text><text x="52" y="683" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">DeepSeekHarness 包装运行区间</text><text x="52" y="725" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">JSON-RPC：请求 / 响应 / 通知</text><rect x="32" y="776" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/><text x="52" y="819" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">共享的领域能力</text><text x="52" y="863" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">AgentLoop / Tools / LlmRuntime</text><text x="52" y="905" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Agent：活动；Session：历史事实</text><text x="52" y="947" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">不同 Profile 可以启用不同能力</text><rect x="32" y="998" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/><text x="52" y="1041" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">ACP：独立协议接入分支</text><text x="52" y="1085" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">标准 Agent Client Protocol 适配</text><text x="52" y="1127" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">不是 SDK method 的别名</text><text x="52" y="1169" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">不推导所有入口权限完全相同</text><text x="32" y="1272" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">固定 f3803c9 · 边界与条件见正文</text></svg>