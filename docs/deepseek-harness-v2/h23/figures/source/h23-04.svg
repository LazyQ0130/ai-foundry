<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1300" viewBox="0 0 640 1300" role="img"><title>四层状态，恢复对象分别核对</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#187A91" stroke-width="2"/></marker></defs><rect width="640" height="1300" fill="#F3F9F8"/><text x="32" y="57" font-size="32" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">四层状态，恢复对象分别核对</text><rect x="32" y="110" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/><text x="52" y="153" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">Connection Generation</text><text x="52" y="197" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">客户端本地递增，旧源先排空</text><text x="52" y="239" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">丢线 / 重连不等 Session 被删除</text><text x="52" y="281" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">旧代际迟到 ready 不得覆盖新代</text><rect x="32" y="332" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/><text x="52" y="375" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">实时 Agent 与 Assistant Stream</text><text x="52" y="419" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Agent 可 running / idle / 不存在</text><text x="52" y="461" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">revision 是实时帧连续编号</text><text x="52" y="503" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">缺帧 → 重建 baseline，不补造历史</text><rect x="32" y="554" width="576" height="198" rx="15" fill="#FFF0D7" stroke="#78A7AC"/><text x="52" y="597" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">Session 与持久化 Backend</text><text x="52" y="641" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">seq 是领域事件位置，不是连接号</text><text x="52" y="683" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">历史查询可不激活 Agent</text><text x="52" y="725" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">append / flush / writer close 分层</text><rect x="32" y="776" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/><text x="52" y="819" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">重连、Resume、新任务分开</text><text x="52" y="863" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Web：重新获取快照与未覆盖增量</text><text x="52" y="905" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">SDK Resume：取得历史并重建 Agent</text><text x="52" y="947" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">新 Prompt 才开始新的输入工作</text><rect x="32" y="998" width="576" height="198" rx="15" fill="#FCE5E3" stroke="#78A7AC"/><text x="52" y="1041" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">不能据界面或回执推导的结论</text><text x="52" y="1085" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">收到 chunk 不等于完整回答已保存</text><text x="52" y="1127" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">断开不等于工作已停稳或已撤销</text><text x="52" y="1169" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">恢复历史不恢复旧外部资源句柄</text><text x="32" y="1272" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">固定 f3803c9 · 边界与条件见正文</text></svg>