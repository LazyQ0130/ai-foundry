<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1690" viewBox="0 0 640 1690" role="img" aria-labelledby="title desc"><title id="title">Waterfall：必须画出回程</title><desc id="desc">上半正常A进入B和主体，主体2返回B变20再返回A变21；下半B不调用next，主体未执行，但A仍接到拒绝并处理后返回发布者。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="1690" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">Waterfall：必须画出回程</text><text x="320" y="105" font-size="28" font-weight="400" text-anchor="middle">实线向右：进入；虚线向左：返回</text><text x="320" y="155" font-size="30" font-weight="700" text-anchor="middle">正常：主体 2，B × 10，A + 1</text><text x="80" y="215" font-size="28" font-weight="700" text-anchor="middle">发布者</text><line x1="80" y1="235" x2="80" y2="805" stroke="#9FBCC4" stroke-width="2" stroke-dasharray="6 7"/><text x="235" y="215" font-size="28" font-weight="700" text-anchor="middle">A 外层</text><line x1="235" y1="235" x2="235" y2="805" stroke="#9FBCC4" stroke-width="2" stroke-dasharray="6 7"/><text x="400" y="215" font-size="28" font-weight="700" text-anchor="middle">B 内层</text><line x1="400" y1="235" x2="400" y2="805" stroke="#9FBCC4" stroke-width="2" stroke-dasharray="6 7"/><text x="565" y="215" font-size="28" font-weight="700" text-anchor="middle">主体</text><line x1="565" y1="235" x2="565" y2="805" stroke="#9FBCC4" stroke-width="2" stroke-dasharray="6 7"/><polyline points="80,280 235,280" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><text x="157.5" y="263" font-size="28" font-weight="400" text-anchor="middle">调用</text><polyline points="235,375 400,375" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><text x="317.5" y="358" font-size="28" font-weight="400" text-anchor="middle">next()</text><polyline points="400,470 565,470" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><text x="482.5" y="453" font-size="28" font-weight="400" text-anchor="middle">next()</text><polyline points="565,565 400,565" fill="none" stroke="#187A91" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="482.5" y="548" font-size="28" font-weight="400" text-anchor="middle">2</text><polyline points="400,660 235,660" fill="none" stroke="#187A91" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="317.5" y="643" font-size="28" font-weight="400" text-anchor="middle">20</text><polyline points="235,755 80,755" fill="none" stroke="#187A91" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="157.5" y="738" font-size="28" font-weight="400" text-anchor="middle">21</text><text x="320" y="865" font-size="28" font-weight="400" text-anchor="middle">B 得到 2 后返回 20；A 再返回 21</text><text x="320" y="940" font-size="30" font-weight="700" text-anchor="middle">短路：B 直接返回拒绝</text><text x="80" y="1005" font-size="28" font-weight="700" text-anchor="middle">发布者</text><line x1="80" y1="1025" x2="80" y2="1465" stroke="#9FBCC4" stroke-width="2" stroke-dasharray="6 7"/><text x="235" y="1005" font-size="28" font-weight="700" text-anchor="middle">A 外层</text><line x1="235" y1="1025" x2="235" y2="1465" stroke="#9FBCC4" stroke-width="2" stroke-dasharray="6 7"/><text x="400" y="1005" font-size="28" font-weight="700" text-anchor="middle">B 内层</text><line x1="400" y1="1025" x2="400" y2="1465" stroke="#9FBCC4" stroke-width="2" stroke-dasharray="6 7"/><text x="565" y="1005" font-size="28" font-weight="700" text-anchor="middle">主体</text><line x1="565" y1="1025" x2="565" y2="1465" stroke="#9FBCC4" stroke-width="2" stroke-dasharray="6 7"/><rect x="500" y="1060" width="130" height="385" rx="14" fill="#E4ECEF"/><text x="565" y="1220" font-size="28" font-weight="400" text-anchor="middle">主体</text><text x="565" y="1265" font-size="28" font-weight="400" text-anchor="middle">未进入</text><polyline points="80,1090 235,1090" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><text x="157.5" y="1073" font-size="28" font-weight="400" text-anchor="middle">调用</text><polyline points="235,1185 400,1185" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><text x="317.5" y="1168" font-size="28" font-weight="400" text-anchor="middle">next()</text><polyline points="400,1280 235,1280" fill="none" stroke="#187A91" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="317.5" y="1263" font-size="28" font-weight="400" text-anchor="middle">拒绝</text><polyline points="235,1390 80,1390" fill="none" stroke="#187A91" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="157.5" y="1373" font-size="28" font-weight="400" text-anchor="middle">包装拒绝</text><text x="320" y="1520" font-size="28" font-weight="400" text-anchor="middle">B 不 next：尚未进入的主体被跳过</text><text x="320" y="1562" font-size="28" font-weight="400" text-anchor="middle">A 已进入：仍可处理拒绝再返回</text><text x="320" y="1604" font-size="28" font-weight="400" text-anchor="middle">短路不自动绕过所有外层</text><text x="320" y="1646" font-size="28" font-weight="400" text-anchor="middle">教学精选时序；省略异步和工具内部</text></svg>