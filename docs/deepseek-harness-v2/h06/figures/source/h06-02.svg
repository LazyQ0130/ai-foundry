<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1760" viewBox="0 0 640 1760" role="img" aria-labelledby="title desc"><title id="title">五种模式：等待、结果与停止</title><desc id="desc">五张纵向规则卡比较调用顺序、等待、返回与停止，强调三个继续值和Waterfall去程回程。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="1760" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">五种模式：等待、结果与停止</text><text x="320" y="105" font-size="28" font-weight="400" text-anchor="middle">先问等待什么，再问怎样返回</text><rect x="24" y="145" width="592" height="260" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="188" font-size="30" font-weight="700" text-anchor="middle">emit｜同步调用，不收返回值</text><text x="320.0" y="230" font-size="28" font-weight="400" text-anchor="middle">启动：A → B（各自同步前缀）</text><text x="320.0" y="268" font-size="28" font-weight="400" text-anchor="middle">等待：不等回调返回的 Promise</text><text x="320.0" y="306" font-size="28" font-weight="400" text-anchor="middle">结果：undefined，不按返回值短路</text><text x="320.0" y="344" font-size="28" font-weight="400" text-anchor="middle">同步 throw 仍可能中断后续</text><rect x="24" y="440" width="592" height="260" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="483" font-size="30" font-weight="700" text-anchor="middle">parallel｜都开始，等全部</text><text x="320.0" y="525" font-size="28" font-weight="400" text-anchor="middle">完成顺序可以 B → A</text><text x="320.0" y="563" font-size="28" font-weight="400" text-anchor="middle">本版：allSettled 等全部结束</text><text x="320.0" y="601" font-size="28" font-weight="400" text-anchor="middle">成功空结果；失败 AggregateError</text><text x="320.0" y="639" font-size="28" font-weight="400" text-anchor="middle">不自动取消其他监听器</text><rect x="24" y="735" width="592" height="260" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="778" font-size="30" font-weight="700" text-anchor="middle">serial｜逐个等待，可停止</text><text x="320.0" y="820" font-size="28" font-weight="400" text-anchor="middle">A 完成才开始 B</text><text x="320.0" y="858" font-size="28" font-weight="400" text-anchor="middle">仅 null / false / undefined 继续</text><text x="320.0" y="896" font-size="28" font-weight="400" text-anchor="middle">0、空字符串等也会停止</text><text x="320.0" y="934" font-size="28" font-weight="400" text-anchor="middle">返回首个停止值；全无则空</text><rect x="24" y="1030" width="592" height="260" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1073" font-size="30" font-weight="700" text-anchor="middle">bail｜同步判断，可停止</text><text x="320.0" y="1115" font-size="28" font-weight="400" text-anchor="middle">与 serial 使用同一停止判据</text><text x="320.0" y="1153" font-size="28" font-weight="400" text-anchor="middle">当场判断，不 await</text><text x="320.0" y="1191" font-size="28" font-weight="400" text-anchor="middle">Promise 对象本身会停止</text><text x="320.0" y="1229" font-size="28" font-weight="400" text-anchor="middle">不按将来的兑现值继续</text><rect x="24" y="1325" width="592" height="260" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1368" font-size="30" font-weight="700" text-anchor="middle">waterfall｜进入与返回</text><text x="320.0" y="1410" font-size="28" font-weight="400" text-anchor="middle">进入：A → B → 默认主体</text><text x="320.0" y="1448" font-size="28" font-weight="400" text-anchor="middle">返回：主体 → B → A</text><text x="320.0" y="1486" font-size="28" font-weight="400" text-anchor="middle">next 委托；不调用则跳过下游</text><text x="320.0" y="1524" font-size="28" font-weight="400" text-anchor="middle">取最外层返回；不自动 await</text><text x="320" y="1670" font-size="28" font-weight="400" text-anchor="middle">顺序以选中监听器、无 prepend 为前提</text><text x="320" y="1712" font-size="28" font-weight="400" text-anchor="middle">错误传播见正文，不能只读模式名字</text></svg>