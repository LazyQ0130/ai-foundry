<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1490" viewBox="0 0 640 1490" role="img" aria-labelledby="title desc"><title id="title">Service 调用与事件协作</title><desc id="desc">直接服务调用与可扩展事件协作对照；服务方法内部可以分发事件，分支表示参与关系而非所有模式都执行全部监听器。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="1490" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">Service 调用与事件协作</text><text x="320" y="110" font-size="30" font-weight="700" text-anchor="middle">A｜直接请求一项明确能力</text><rect x="36" y="150" width="568" height="125" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="193" font-size="32" font-weight="700" text-anchor="middle">业务消费者</text><text x="320.0" y="235" font-size="28" font-weight="400" text-anchor="middle">调用工具服务的方法</text><polyline points="320,275 320,356" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><text x="450" y="325" font-size="28" font-weight="400" text-anchor="middle">请求</text><rect x="36" y="375" width="568" height="130" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="418" font-size="32" font-weight="700" text-anchor="middle">工具 Service</text><text x="320.0" y="460" font-size="28" font-weight="400" text-anchor="middle">按接口完成操作、返回结果</text><polyline points="604,440 624,440 624,215 604,215" fill="none" stroke="#187A91" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="320" y="565" font-size="30" font-weight="700" text-anchor="middle">B｜服务内部也可开放参与点</text><rect x="36" y="605" width="568" height="130" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="648" font-size="32" font-weight="700" text-anchor="middle">工具服务中的扩展位置</text><text x="320.0" y="690" font-size="28" font-weight="400" text-anchor="middle">发布事件名、参数与结果约定</text><polyline points="320,735 320,811" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="830" width="568" height="170" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="873" font-size="32" font-weight="700" text-anchor="middle">Cordis 事件分发器</text><text x="320.0" y="915" font-size="28" font-weight="400" text-anchor="middle">按模式选择执行与等待规则</text><text x="320.0" y="953" font-size="28" font-weight="400" text-anchor="middle">将适用监听者接入调用</text><polyline points="320,1000 320,1045 112,1045 112,1100" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="1120" width="176" height="140" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="112.0" y="1163" font-size="30" font-weight="700" text-anchor="middle">日志插件</text><text x="112.0" y="1205" font-size="28" font-weight="400" text-anchor="middle">观察记录</text><polyline points="320,1000 320,1045 320,1045 320,1100" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="232" y="1120" width="176" height="140" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1163" font-size="30" font-weight="700" text-anchor="middle">策略插件</text><text x="320.0" y="1205" font-size="28" font-weight="400" text-anchor="middle">检查决定</text><polyline points="320,1000 320,1045 528,1045 528,1100" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="440" y="1120" width="176" height="140" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="528.0" y="1163" font-size="30" font-weight="700" text-anchor="middle">统计插件</text><text x="528.0" y="1205" font-size="28" font-weight="400" text-anchor="middle">前后计时</text><text x="320" y="1320" font-size="28" font-weight="400" text-anchor="middle">分支表示参与关系，不保证全部执行</text><text x="320" y="1362" font-size="28" font-weight="400" text-anchor="middle">事件也可返回结果；两种方式可组合</text><text x="320" y="1404" font-size="28" font-weight="400" text-anchor="middle">实线 = 调用/参与；虚线 = 结果返回</text><text x="320" y="1446" font-size="28" font-weight="400" text-anchor="middle">本机教学图，不表示进程或消息队列</text></svg>