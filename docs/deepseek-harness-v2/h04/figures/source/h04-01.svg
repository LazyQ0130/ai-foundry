<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1900" viewBox="0 0 640 1900" role="img" aria-labelledby="title desc">
<title id="title">一个 Harness，五种应用组合</title><desc id="desc">四种 Profile 以 base 加应用层组合，sdk-minimal 独立提供配置树而复用部分核心能力；SDK 与 ACP 使用不同 stdio 协议，生命周期按场景区别。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="1900" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">一个 Harness，五种应用组合</text><text x="320" y="105" font-size="28" font-weight="400" text-anchor="middle">按交互与生命周期选择，不复制引擎</text><rect x="36" y="145" width="568" height="130" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="188" font-size="32" font-weight="700" text-anchor="middle">dsh 启动器</text><text x="320.0" y="230" font-size="28" font-weight="400" text-anchor="middle">选择具名 Profile 并准备应用</text><polyline points="320,275 320,319" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><polyline points="604,210 624,210 624,1500 604,1500" fill="none" stroke="#187A91" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="24" y="335" width="592" height="1080" rx="24" fill="white" stroke="#187A91" stroke-width="3"/><text x="320" y="385" font-size="32" font-weight="700" text-anchor="middle">四种以 base 为基础的模板</text><rect x="44" y="415" width="552" height="160" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="458" font-size="32" font-weight="700" text-anchor="middle">base：共享的运行能力</text><text x="320.0" y="500" font-size="28" font-weight="400" text-anchor="middle">Agent Loop · LLM · Tools</text><text x="320.0" y="538" font-size="28" font-weight="400" text-anchor="middle">Session · 策略等配套服务</text><rect x="44" y="605" width="552" height="170" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="648" font-size="32" font-weight="700" text-anchor="middle">web = base + web-app</text><text x="320.0" y="690" font-size="28" font-weight="400" text-anchor="middle">浏览器界面与 Host 服务</text><text x="320.0" y="728" font-size="28" font-weight="400" text-anchor="middle">持续服务请求</text><rect x="44" y="800" width="552" height="170" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="843" font-size="32" font-weight="700" text-anchor="middle">headless = base + headless</text><text x="320.0" y="885" font-size="28" font-weight="400" text-anchor="middle">命令行任务与结果输出</text><text x="320.0" y="923" font-size="28" font-weight="400" text-anchor="middle">一次性任务，完成后退出</text><rect x="44" y="995" width="552" height="170" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1038" font-size="32" font-weight="700" text-anchor="middle">sdk = base + sdk-app</text><text x="320.0" y="1080" font-size="28" font-weight="400" text-anchor="middle">SDK JSON-RPC stdio</text><text x="320.0" y="1118" font-size="28" font-weight="400" text-anchor="middle">服务客户端连接</text><rect x="44" y="1190" width="552" height="170" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1233" font-size="32" font-weight="700" text-anchor="middle">acp = base + acp-app</text><text x="320.0" y="1275" font-size="28" font-weight="400" text-anchor="middle">ACP JSON-RPC stdio</text><text x="320.0" y="1313" font-size="28" font-weight="400" text-anchor="middle">服务编辑器或自动化客户端</text><rect x="36" y="1455" width="568" height="270" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1498" font-size="32" font-weight="700" text-anchor="middle">sdk-minimal：独立完整树</text><text x="320.0" y="1540" font-size="28" font-weight="400" text-anchor="middle">仅 dsh-sdk-minimal，不叠 base</text><text x="320.0" y="1578" font-size="28" font-weight="400" text-anchor="middle">显式复用部分相同核心包</text><text x="320.0" y="1616" font-size="28" font-weight="400" text-anchor="middle">同一 SDK stdio 应用层</text><text x="320.0" y="1654" font-size="28" font-weight="400" text-anchor="middle">默认 danger-full-access，非低权限</text><text x="320" y="1778" font-size="28" font-weight="400" text-anchor="middle">容器 = 模板组成；不是进程或安全边界</text><text x="320" y="1820" font-size="28" font-weight="400" text-anchor="middle">虚线：也可选择独立 SDK 树</text><text x="320" y="1862" font-size="28" font-weight="400" text-anchor="middle">已有 Profile 可被用户修改</text></svg>