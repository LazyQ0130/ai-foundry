<svg xmlns="http://www.w3.org/2000/svg" width="640" height="2357" viewBox="0 0 640 2357" role="img" aria-labelledby="title desc">
<title id="title">从 dsh 命令到 Agent 应用</title><desc id="desc">参数解析区分启动和 dump。正常分支先加载环境、安装代理，再准备 Profile/运行组合，经宿主准备和配置树挂载审查后提交应用就绪；dump 不向下启动。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="2357" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">从 dsh 命令到 Agent 应用</text><text x="320" y="105" font-size="28" font-weight="400" text-anchor="middle">主线：固定版本，正常 profile 调用</text><rect x="36" y="145" width="568" height="160" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="188" font-size="32" font-weight="700" text-anchor="middle">① 解析 dsh 参数</text><text x="320.0" y="230" font-size="28" font-weight="400" text-anchor="middle">parseDshArgs → invocation</text><text x="320.0" y="268" font-size="28" font-weight="400" text-anchor="middle">选 Profile；交接剩余应用参数</text><polyline points="320,305 320,345" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><polyline points="604,225 624,225 624,645 604,645" fill="none" stroke="#187A91" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="36" y="351" width="568" height="198" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320.0" y="394" font-size="32" font-weight="700" text-anchor="middle">分支：配置 dump</text><text x="320.0" y="436" font-size="28" font-weight="400" text-anchor="middle">单独组合并打印，不挂载应用</text><text x="320.0" y="474" font-size="28" font-weight="400" text-anchor="middle">不解析应用 flag，不求值表达式</text><text x="320.0" y="512" font-size="28" font-weight="400" text-anchor="middle">仍可能初始化 Profile 与根文件</text><rect x="36" y="595" width="568" height="160" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="638" font-size="32" font-weight="700" text-anchor="middle">② 加载启动环境</text><text x="320.0" y="680" font-size="28" font-weight="400" text-anchor="middle">先确定 Home，再读两份 .env</text><text x="320.0" y="718" font-size="28" font-weight="400" text-anchor="middle">先校验来源，再接受并保存快照</text><polyline points="320,755 320,795" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="801" width="568" height="160" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="844" font-size="32" font-weight="700" text-anchor="middle">③ 安装出站代理策略</text><text x="320.0" y="886" font-size="28" font-weight="400" text-anchor="middle">runProfile 使用启动环境快照</text><text x="320.0" y="924" font-size="28" font-weight="400" text-anchor="middle">发生在 Profile 组合之前</text><polyline points="320,961 320,1001" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="1007" width="568" height="198" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1050" font-size="32" font-weight="700" text-anchor="middle">④ 准备 Profile</text><text x="320.0" y="1092" font-size="28" font-weight="400" text-anchor="middle">检查名称、清单；必要时初始化</text><text x="320.0" y="1130" font-size="28" font-weight="400" text-anchor="middle">重写空根 cordis.yml</text><text x="320.0" y="1168" font-size="28" font-weight="400" text-anchor="middle">安装锚点优先解析组合包</text><polyline points="320,1205 320,1245" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="1251" width="568" height="198" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1294" font-size="32" font-weight="700" text-anchor="middle">⑤ 准备运行组合</text><text x="320.0" y="1336" font-size="28" font-weight="400" text-anchor="middle">建立包解析与读取 CLI overlay</text><text x="320.0" y="1374" font-size="28" font-weight="400" text-anchor="middle">Bundle → Profile → Home → CLI</text><text x="320.0" y="1412" font-size="28" font-weight="400" text-anchor="middle">还有专门的启动开关处理</text><polyline points="320,1449 320,1489" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="1495" width="568" height="198" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1538" font-size="32" font-weight="700" text-anchor="middle">⑥ boot 的宿主准备</text><text x="320.0" y="1580" font-size="28" font-weight="400" text-anchor="middle">创建 Context 与 Loader</text><text x="320.0" y="1618" font-size="28" font-weight="400" text-anchor="middle">提供环境、包解析、参数快照</text><text x="320.0" y="1656" font-size="28" font-weight="400" text-anchor="middle">在配置树条目挂载之前</text><polyline points="320,1693 320,1733" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="1739" width="568" height="198" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1782" font-size="32" font-weight="700" text-anchor="middle">⑦ 挂载、等待、审查</text><text x="320.0" y="1824" font-size="28" font-weight="400" text-anchor="middle">根 include 挂载配置条目</text><text x="320.0" y="1862" font-size="28" font-weight="400" text-anchor="middle">等待树结算并检查激活状态</text><text x="320.0" y="1900" font-size="28" font-weight="400" text-anchor="middle">required 失败与 optional 警告分开</text><polyline points="320,1937 320,1977" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="1983" width="568" height="198" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="2026" font-size="32" font-weight="700" text-anchor="middle">⑧ 提交应用就绪信号</text><text x="320.0" y="2068" font-size="28" font-weight="400" text-anchor="middle">确认未关闭且树仍活跃</text><text x="320.0" y="2106" font-size="28" font-weight="400" text-anchor="middle">Web / 一次性任务 / stdio 应用</text><text x="320.0" y="2144" font-size="28" font-weight="400" text-anchor="middle">后续由应用决定何时处理请求</text><text x="320" y="2232" font-size="28" font-weight="400" text-anchor="middle">① 的虚线是正常启动分支</text><text x="320" y="2276" font-size="28" font-weight="400" text-anchor="middle">dump 在单独路径结束，不向下启动</text><text x="320" y="2320" font-size="28" font-weight="400" text-anchor="middle">图为主要控制流；省略关闭与重载细节</text></svg>