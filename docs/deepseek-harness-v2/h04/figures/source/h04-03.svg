<svg xmlns="http://www.w3.org/2000/svg" width="640" height="2300" viewBox="0 0 640 2300" role="img" aria-labelledby="title desc">
<title id="title">运行配置：来源与作用</title><desc id="desc">普通环境从继承、项目到Home查找并先检查来源；配置树从空根按Bundle、Profile、Home与CLI顺序应用。受管凭据和启动策略另有负责方，dump不能表示全部运行值。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="2300" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">运行配置：来源与作用</text><text x="320" y="105" font-size="28" font-weight="400" text-anchor="middle">先分开两种数据，再判断哪一项生效</text><rect x="28" y="145" width="584" height="205" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320.0" y="188" font-size="32" font-weight="700" text-anchor="middle">A｜普通启动环境</text><text x="320.0" y="230" font-size="28" font-weight="400" text-anchor="middle">先由进程确定 Harness Home</text><text x="320.0" y="268" font-size="28" font-weight="400" text-anchor="middle">调用目录 .env 与 Home .env</text><text x="320.0" y="306" font-size="28" font-weight="400" text-anchor="middle">两份文件先校验，禁止来源即拒绝</text><rect x="48" y="390" width="544" height="120" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="433" font-size="32" font-weight="700" text-anchor="middle">进程继承环境</text><text x="320.0" y="475" font-size="28" font-weight="400" text-anchor="middle">普通变量的第一选择</text><polyline points="320,510 320,547" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="560" width="544" height="120" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="603" font-size="32" font-weight="700" text-anchor="middle">调用目录 .env</text><text x="320.0" y="645" font-size="28" font-weight="400" text-anchor="middle">第一层缺少该名字时查这里</text><polyline points="320,680 320,717" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="730" width="544" height="120" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="773" font-size="32" font-weight="700" text-anchor="middle">Home .env</text><text x="320.0" y="815" font-size="28" font-weight="400" text-anchor="middle">再缺少时查这里；代理有来源例外</text><polyline points="320,850 320,887" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="919" font-size="28" font-weight="700" text-anchor="middle">高 → 低查找；不是后读覆盖前读</text><text x="320" y="965" font-size="28" font-weight="400" text-anchor="middle">快照不随 chdir、工作区选择或 HMR 重读</text><rect x="28" y="1010" width="584" height="145" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1053" font-size="32" font-weight="700" text-anchor="middle">B｜Profile 配置树</text><text x="320.0" y="1095" font-size="28" font-weight="400" text-anchor="middle">从空根开始，按顺序应用修改</text><rect x="48" y="1195" width="544" height="120" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1238" font-size="32" font-weight="700" text-anchor="middle">Bundle patch 列表</text><text x="320.0" y="1280" font-size="28" font-weight="400" text-anchor="middle">按 manifest 的 bundles 顺序</text><polyline points="320,1315 320,1352" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="1365" width="544" height="120" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1408" font-size="32" font-weight="700" text-anchor="middle">Profile 用户 patch</text><text x="320.0" y="1450" font-size="28" font-weight="400" text-anchor="middle">profiles/name/cordis.patch.yml</text><polyline points="320,1485 320,1522" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="1535" width="544" height="120" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1578" font-size="32" font-weight="700" text-anchor="middle">Home 用户 patch</text><text x="320.0" y="1620" font-size="28" font-weight="400" text-anchor="middle">Home/cordis.patch.yml</text><polyline points="320,1655 320,1692" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="1705" width="544" height="120" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1748" font-size="32" font-weight="700" text-anchor="middle">CLI 的 --patch</text><text x="320.0" y="1790" font-size="28" font-weight="400" text-anchor="middle">按 argv 顺序；内容本次启动固定</text><text x="320" y="1905" font-size="28" font-weight="700" text-anchor="middle">后层可改同一行；config 整体替换</text><text x="320" y="1949" font-size="28" font-weight="400" text-anchor="middle">应用 flag 要靠保留的配置表达式读取</text><rect x="28" y="1990" width="584" height="210" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320.0" y="2033" font-size="32" font-weight="700" text-anchor="middle">另看负责方的专门规则</text><text x="320.0" y="2075" font-size="28" font-weight="400" text-anchor="middle">启动还有遥测关闭补丁等处理</text><text x="320.0" y="2113" font-size="28" font-weight="400" text-anchor="middle">受管凭据：文档 → 继承 → dotenv</text><text x="320.0" y="2151" font-size="28" font-weight="400" text-anchor="middle">dump 不等于全部生效值或自动脱敏</text><text x="320" y="2254" font-size="28" font-weight="400" text-anchor="middle">Web 配置可重组；环境与 argv 需重启</text></svg>