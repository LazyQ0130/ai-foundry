<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1440" viewBox="0 0 640 1440" role="img"><title>文件效果模式与完整度分开看</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#187A91" stroke-width="2"/></marker></defs><rect width="640" height="1440" fill="#F3F9F8"/>
<text x="32" y="57" font-size="32" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">文件效果模式与完整度分开看</text>
<rect x="32" y="100" width="576" height="156" rx="15" fill="#DDEDF5" stroke="#78A7AC"/>
<text x="52" y="143" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">read-only</text>
<text x="52" y="187" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">要求拒绝文件写入</text>
<text x="52" y="229" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">POSIX 必要接收器等后端例外</text>
<rect x="32" y="282" width="576" height="156" rx="15" fill="#D9F4E9" stroke="#78A7AC"/>
<text x="52" y="325" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">workspace-write</text>
<text x="52" y="369" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">工作区 + 显式额外根 + 临时区域</text>
<text x="52" y="411" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">不等于只看得见工作区</text>
<rect x="32" y="464" width="576" height="156" rx="15" fill="#FCE5E3" stroke="#78A7AC"/>
<text x="52" y="507" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">danger-full-access</text>
<text x="52" y="551" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">消费方绕过文件沙箱约束</text>
<text x="52" y="593" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">本课只静态分析，不用它做写实验</text>
<rect x="32" y="646" width="576" height="156" rx="15" fill="#FFF0D7" stroke="#78A7AC"/>
<text x="52" y="689" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">另一维：enforcement</text>
<text x="52" y="733" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">full：承诺的文件效果完整强制</text>
<text x="52" y="775" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">partial：只强制其中一部分</text>
<rect x="32" y="828" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/>
<text x="52" y="871" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">平台与后端事实</text>
<text x="52" y="915" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Linux：bwrap 或 Landlock</text>
<text x="52" y="957" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">macOS：Seatbelt</text>
<text x="52" y="999" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Windows：ACL 受限令牌，partial</text>
<rect x="32" y="1052" width="576" height="156" rx="15" fill="#FCE5E3" stroke="#78A7AC"/>
<text x="52" y="1095" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">不在模式词汇中的承诺</text>
<text x="52" y="1139" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">网络、全部进程能力与系统隔离</text>
<text x="52" y="1181" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">无可用后端：失败关闭，不裸跑</text>
<text x="32" y="1412" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">固定源码 f3803c9 · 条件组合教学图</text>
</svg>