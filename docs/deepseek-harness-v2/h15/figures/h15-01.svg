<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1520" viewBox="0 0 640 1520" role="img"><title>先分责任，再判断一次调用</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#187A91" stroke-width="2"/></marker></defs><rect width="640" height="1520" fill="#F3F9F8"/>
<text x="32" y="57" font-size="32" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">先分责任，再判断一次调用</text>
<rect x="32" y="100" width="576" height="114" rx="15" fill="#DDEDF5" stroke="#78A7AC"/>
<text x="52" y="143" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">Registry：能看见、能提出吗？</text>
<text x="52" y="187" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Schema 说明形状；可见不等于授权</text>
<path d="M320 223 V279" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/>
<text x="350" y="258" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">流水线</text>
<rect x="32" y="304" width="576" height="156" rx="15" fill="#FFF0D7" stroke="#78A7AC"/>
<text x="52" y="347" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">pre → 必要时审批 → guard</text>
<text x="52" y="391" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">普通策略可协作；守卫只拒绝</text>
<text x="52" y="433" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">批准后仍可能被守卫拦住</text>
<path d="M320 469 V525" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/>
<text x="350" y="504" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">允许主体</text>
<rect x="32" y="550" width="576" height="156" rx="15" fill="#D9F4E9" stroke="#78A7AC"/>
<text x="52" y="593" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">能力实现按组合选择执行边界</text>
<text x="52" y="637" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Shell：策略 → 子进程沙箱 runner</text>
<text x="52" y="679" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">文件：观察意图 → 受限 fs 后端</text>
<rect x="32" y="732" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/>
<text x="52" y="775" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">两条能力路径，不互相替代</text>
<text x="52" y="819" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">进程沙箱约束子进程文件效果</text>
<text x="52" y="861" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">fs 围栏约束可信实现中的目标路径</text>
<text x="52" y="903" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">观察插件提供版本条件；后端检查</text>
<rect x="32" y="956" width="576" height="156" rx="15" fill="#D9F4E9" stroke="#78A7AC"/>
<text x="52" y="999" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">Session 审计：记录请求与决定</text>
<text x="52" y="1043" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">approval/asked ↔ approval/decided</text>
<text x="52" y="1085" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">不是所有操作都自动产生审批事件</text>
<rect x="32" y="1138" width="576" height="156" rx="15" fill="#FCE5E3" stroke="#78A7AC"/>
<text x="52" y="1181" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">保证取决于真实部署</text>
<text x="52" y="1225" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">缺组件、绕过调用或卸载策略</text>
<text x="52" y="1267" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">都会改变此次调用实际经过的检查</text>
<text x="32" y="1492" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">固定源码 f3803c9 · 条件组合教学图</text>
</svg>