<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1078" viewBox="0 0 640 1078" role="img"><title>并发、逐项依赖与汇总屏障</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#187A91" stroke-width="2"/></marker></defs><rect width="640" height="1078" fill="#F3F9F8"/><text x="32" y="57" font-size="32" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">并发、逐项依赖与汇总屏障</text><rect x="32" y="110" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/><text x="52" y="153" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">parallel：独立工作同时推进</text><text x="52" y="197" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">输入 [A, B]；先完成 B，再完成 A</text><text x="52" y="239" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">输出仍然 [A结果, B结果]</text><text x="52" y="281" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">并发槽限制 agent，不限制普通函数</text><rect x="32" y="332" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/><text x="52" y="375" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">pipeline：每项内按顺序</text><text x="52" y="419" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">A1 → A2；B1 → B2</text><text x="52" y="461" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">A2 可以早于 B1 完成而开始</text><text x="52" y="503" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">回调收到 previous、item、index</text><rect x="32" y="554" width="576" height="198" rx="15" fill="#FFF0D7" stroke="#78A7AC"/><text x="52" y="597" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">A 与 B 都结束后，才能做 C</text><text x="52" y="641" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">const [a,b] = await parallel(...)</text><text x="52" y="683" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">这次 await 才建立汇总屏障</text><text x="52" y="725" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">再 pipeline([{a,b}], stageC)</text><rect x="32" y="776" width="576" height="198" rx="15" fill="#FCE5E3" stroke="#78A7AC"/><text x="52" y="819" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">phase 只描述进度</text><text x="52" y="863" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">phase(&quot;Synthesize&quot;) 不会等待 A/B</text><text x="52" y="905" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">必须由 await 写清真实依赖</text><text x="52" y="947" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">普通失败为 null，汇总前检查空值</text><text x="32" y="1050" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">固定 f3803c9 · 边界与条件见正文</text></svg>