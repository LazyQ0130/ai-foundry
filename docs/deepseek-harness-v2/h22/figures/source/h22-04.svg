<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1300" viewBox="0 0 640 1300" role="img"><title>实时事件、Session 与后台路径</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#187A91" stroke-width="2"/></marker></defs><rect width="640" height="1300" fill="#F3F9F8"/><text x="32" y="57" font-size="32" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">实时事件、Session 与后台路径</text><rect x="32" y="110" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/><text x="52" y="153" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">workflow/*：实时观察</text><text x="52" y="197" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">start / end；phase / log</text><text x="52" y="239" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">agent-start / agent-end</text><text x="52" y="281" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">end 不携带最终 value</text><rect x="32" y="332" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/><text x="52" y="375" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">Tool 根调用：父 Session 日志</text><text x="52" y="419" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">tool-workflow/run-start 与 run-end</text><text x="52" y="461" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">agent-start 与 agent-end</text><text x="52" y="503" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">只写四类 log-only 记录</text><rect x="32" y="554" width="576" height="198" rx="15" fill="#FFF0D7" stroke="#78A7AC"/><text x="52" y="597" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">前台：最终工具结果进模型历史</text><text x="52" y="641" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">等待 result → dispose → ToolResult</text><text x="52" y="683" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">只交聚合值，非子级全部历史</text><text x="52" y="725" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">phase / log 不自动成为模型输入</text><rect x="32" y="776" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/><text x="52" y="819" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">后台：Jobs 拥有运行</text><text x="52" y="863" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">立即交 jobId / runId；输出环含 log</text><text x="52" y="905" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">job_output 隐去 observer log</text><text x="52" y="947" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">完成通知 / job_kill 由 Jobs 管理</text><rect x="32" y="998" width="576" height="198" rx="15" fill="#FCE5E3" stroke="#78A7AC"/><text x="52" y="1041" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">持久事实不等于脚本检查点</text><text x="52" y="1085" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Session 可保留部分执行事实</text><text x="52" y="1127" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">本地 Job 表与句柄是进程内状态</text><text x="52" y="1169" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">重启不恢复 guest 栈或中间 Promise</text><text x="32" y="1272" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">固定 f3803c9 · 边界与条件见正文</text></svg>