ily="Microsoft YaHei">Goal：目标推进；Schedule：定时触发</text><text x="32" y="1506" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">固定 f3803c9 · 边界与条件见正文</text></svg>