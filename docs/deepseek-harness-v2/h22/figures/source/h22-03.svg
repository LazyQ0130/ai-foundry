<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1534" viewBox="0 0 640 1534" role="img"><title>WorkflowRun 的结算与释放</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#187A91" stroke-width="2"/></marker></defs><rect width="640" height="1534" fill="#F3F9F8"/><text x="32" y="57" font-size="32" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">WorkflowRun 的结算与释放</text><rect x="32" y="110" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/><text x="52" y="153" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">start 前：可以直接抛错</text><text x="52" y="197" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">meta / 解析 / Provider / 总量校验</text><text x="52" y="239" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">未建立 run，不发布 workflow/start</text><text x="52" y="281" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">脚本必须是 JavaScript 函数体</text><path d="M320 332 V384" stroke="#187A91" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="350" y="365" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">开始执行</text><rect x="32" y="410" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/><text x="52" y="453" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">建立并持有 WorkflowRun</text><text x="52" y="497" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">发布 start → PTC → 子级 Activation</text><text x="52" y="539" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">result 以 WorkflowResult 结算</text><text x="52" y="581" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">completed / error / cancelled</text><rect x="32" y="632" width="576" height="198" rx="15" fill="#FFF0D7" stroke="#78A7AC"/><text x="52" y="675" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">取消是请求，不是停稳证明</text><text x="52" y="719" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">cancel 发信号并请求释放已发布子级</text><text x="52" y="761" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">在途 start 仍须等待并处理晚到句柄</text><text x="52" y="803" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">同步切片限制不等于整项超时</text><path d="M320 854 V906" stroke="#187A91" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="350" y="887" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">结算清理</text><rect x="32" y="932" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/><text x="52" y="975" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">驱动 finally 排空受管工作</text><text x="52" y="1019" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">停止受管进程，等待 pending host call</text><text x="52" y="1061" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">dispose 已接受子级；补配对观察边</text><text x="52" y="1103" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">result 结算后发布 workflow/end</text><path d="M320 1154 V1206" stroke="#187A91" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="350" y="1187" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">统一出口</text><rect x="32" y="1232" width="576" height="198" rx="15" fill="#FCE5E3" stroke="#78A7AC"/><text x="52" y="1275" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">持有者仍须 await dispose()</text><text x="52" y="1319" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">重复调用共享同一个 Promise</text><text x="52" y="1361" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">清理异常存在警告分支</text><text x="52" y="1403" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">不保证任意不合作外部后端停稳</text><text x="32" y="1506" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">固定 f3803c9 · 边界与条件见正文</text></svg>