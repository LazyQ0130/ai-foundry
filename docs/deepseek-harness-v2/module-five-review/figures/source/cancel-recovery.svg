<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1619" viewBox="0 0 640 1619"><title>取消与未知副作用</title><rect width="640" height="1619" fill="#f5fafb"/><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#123849;font-size:28px}.title{font-weight:bold;font-size:32px}.head{font-weight:bold}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#087e92"/></marker></defs><text class="title" x="30" y="48">取消与未知副作用</text><text x="30" y="94">职责路径；分支/回环见配套流程图</text><rect x="30" y="135" width="580" height="166" rx="16" fill="#dceff6" stroke="#8db4be"/><text class="head" x="50" y="178">cancel发信号 / 默认清Inbox</text><text x="50" y="221">keepInbox仅保留待处理输入</text><text x="50" y="260">请求发出不等于完全停稳</text><path d="M320,307 L320,346" stroke="#087e92" stroke-width="4" marker-end="url(#a)"/><rect x="30" y="356" width="580" height="166" rx="16" fill="#dceff6" stroke="#8db4be"/><text class="head" x="50" y="399">观察并转发signal</text><text x="50" y="442">Adapter / Retry / Compaction</text><text x="50" y="481">工具停止补位，已启动先排空</text><path d="M320,528 L320,567" stroke="#087e92" stroke-width="4" marker-end="url(#a)"/><rect x="30" y="577" width="580" height="205" rx="16" fill="#e0f3eb" stroke="#8db4be"/><text class="head" x="50" y="620">按实际分支结算</text><text x="50" y="663">安全文本前缀或attempt</text><text x="50" y="702">已有结果保留；未派发合成失败</text><text x="50" y="741">Step / Turn闭合后whenIdle</text><path d="M320,788 L320,827" stroke="#087e92" stroke-width="4" marker-end="url(#a)"/><rect x="30" y="837" width="580" height="166" rx="16" fill="#dceff6" stroke="#8db4be"/><text class="head" x="50" y="880">Handle.dispose继续生命周期退出</text><text x="50" y="923">Scope → writer.close → 撤登记</text><text x="50" y="962">无通用强杀或外部回滚保证</text><path d="M320,1009 L320,1048" stroke="#087e92" stroke-width="4" marker-end="url(#a)"/><rect x="30" y="1058" width="580" height="205" rx="16" fill="#e0f3eb" stroke="#8db4be"/><text class="head" x="50" y="1101">中断前缀的保守恢复</text><text x="50" y="1144">无call：NOT_STARTED</text><text x="50" y="1183">有call缺结果：UNKNOWN</text><text x="50" y="1222">不覆盖已知结果，不重放旧工具</text><path d="M320,1269 L320,1308" stroke="#087e92" stroke-width="4" marker-end="url(#a)"/><rect x="30" y="1318" width="580" height="166" rx="16" fill="#fbe4df" stroke="#8db4be"/><text class="head" x="50" y="1361">核外部状态再决定下一步</text><text x="50" y="1404">只读 / 外部强制幂等键 / 核对</text><text x="50" y="1443">非幂等未知：请决定或停止</text><text x="30" y="1586">固定 f3803c9；保证均依赖正文条件</text></svg>