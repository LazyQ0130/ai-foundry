<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1580" viewBox="0 0 640 1580"><title>事实、读模型与执行边界</title><rect width="640" height="1580" fill="#f5fafb"/><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#123849;font-size:28px}.title{font-weight:bold;font-size:32px}.head{font-weight:bold}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#087e92"/></marker></defs><text class="title" x="30" y="48">事实、读模型与执行边界</text><text x="30" y="94">职责路径；分支/回环见配套流程图</text><rect x="30" y="135" width="580" height="166" rx="16" fill="#dceff6" stroke="#8db4be"/><text class="head" x="50" y="178">Agent / Scope / 当前控制信号</text><text x="50" y="221">Factory准备并发布运行对象</text><text x="50" y="260">Turn → Step → 请求Attempt</text><path d="M320,307 L320,346" stroke="#087e92" stroke-width="4" marker-end="url(#a)"/><rect x="30" y="356" width="580" height="166" rx="16" fill="#e0f3eb" stroke="#8db4be"/><text class="head" x="50" y="399">Session.append 接纳事实</text><text x="50" y="442">检查归属 → 无损快照 / 冻结</text><text x="50" y="481">验证Surface计划 → push → 通知</text><path d="M320,528 L320,567" stroke="#087e92" stroke-width="4" marker-end="url(#a)"/><rect x="30" y="577" width="580" height="205" rx="16" fill="#e4ecff" stroke="#8db4be"/><text class="head" x="50" y="620">三个并列读法</text><text x="50" y="663">Surface → deriveMessages</text><text x="50" y="702">Projection → 业务state / view</text><text x="50" y="741">header / toolHistory → 请求封装</text><path d="M320,788 L320,827" stroke="#087e92" stroke-width="4" marker-end="url(#a)"/><rect x="30" y="837" width="580" height="166" rx="16" fill="#dceff6" stroke="#8db4be"/><text class="head" x="50" y="880">当前模型请求 / 受控Adapter</text><text x="50" y="923">普通失败 → attempt → 恢复链</text><text x="50" y="962">成功 → assistant/message</text><path d="M320,1009 L320,1048" stroke="#087e92" stroke-width="4" marker-end="url(#a)"/><rect x="30" y="1058" width="580" height="166" rx="16" fill="#dceff6" stroke="#8db4be"/><text class="head" x="50" y="1101">成功提议才进入工具批次</text><text x="50" y="1144">登记call → prepare / dispatch</text><text x="50" y="1183">等待主体 → 模型序result</text><path d="M320,1230 L320,1269" stroke="#087e92" stroke-width="4" marker-end="url(#a)"/><rect x="30" y="1279" width="580" height="166" rx="16" fill="#e0f3eb" stroke="#8db4be"/><text class="head" x="50" y="1322">结果进入后续Step历史</text><text x="50" y="1365">下一请求从当时前缀派生</text><text x="50" y="1404">工具效果不由日志自动回滚</text><text x="30" y="1547">固定 f3803c9；保证均依赖正文条件</text></svg>