<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1580" viewBox="0 0 640 1580"><title>保存、持权重读与分支</title><rect width="640" height="1580" fill="#f5fafb"/><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#123849;font-size:28px}.title{font-weight:bold;font-size:32px}.head{font-weight:bold}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#087e92"/></marker></defs><text class="title" x="30" y="48">保存、持权重读与分支</text><text x="30" y="94">职责路径；分支/回环见配套流程图</text><rect x="30" y="135" width="580" height="166" rx="16" fill="#e0f3eb" stroke="#8db4be"/><text class="head" x="50" y="178">Session已提交事件</text><text x="50" y="221">内存已接受；不是物理同步</text><text x="50" y="260">只有活writer才路由到缓冲</text><path d="M320,307 L320,346" stroke="#087e92" stroke-width="4" marker-end="url(#a)"/><rect x="30" y="356" width="580" height="166" rx="16" fill="#dceff6" stroke="#8db4be"/><text class="head" x="50" y="399">Handle持写权 / 路由排空</text><text x="50" y="442">Session或服务flush：</text><text x="50" y="481">drainLive → handle.flush</text><path d="M320,528 L320,567" stroke="#087e92" stroke-width="4" marker-end="url(#a)"/><rect x="30" y="577" width="580" height="166" rx="16" fill="#fff1cf" stroke="#8db4be"/><text class="head" x="50" y="620">后端屏障成功的前缀</text><text x="50" y="663">通用append允许延后物理写</text><text x="50" y="702">JSONL批次write + sync更强</text><path d="M320,749 L320,788" stroke="#087e92" stroke-width="4" marker-end="url(#a)"/><rect x="30" y="798" width="580" height="166" rx="16" fill="#dceff6" stroke="#8db4be"/><text class="head" x="50" y="841">close / 新后端open(write)</text><text x="50" y="884">等待排空并释放所有权</text><text x="50" y="923">取得新写权 → read有效前缀</text><path d="M320,970 L320,1009" stroke="#087e92" stroke-width="4" marker-end="url(#a)"/><rect x="30" y="1019" width="580" height="166" rx="16" fill="#e0f3eb" stroke="#8db4be"/><text class="head" x="50" y="1062">开放语义修复 / 新生命周期</text><text x="50" y="1105">缺结果 → Step / Turn结束</text><text x="50" y="1144">构造marker → 发布新Agent</text><path d="M320,1191 L320,1230" stroke="#087e92" stroke-width="4" marker-end="url(#a)"/><rect x="30" y="1240" width="580" height="205" rx="16" fill="#e4ecff" stroke="#8db4be"/><text class="head" x="50" y="1283">独立选择：Resume 或 Fork</text><text x="50" y="1326">Resume重建已有身份继续</text><text x="50" y="1365">Fork含切点 → 子marker / closer</text><text x="50" y="1404">普通Fork不自动持久或委派</text><text x="30" y="1547">固定 f3803c9；保证均依赖正文条件</text></svg>