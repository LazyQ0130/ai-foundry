<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1580" viewBox="0 0 640 1580"><title>输入取舍与请求恢复</title><rect width="640" height="1580" fill="#f5fafb"/><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#123849;font-size:28px}.title{font-weight:bold;font-size:32px}.head{font-weight:bold}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#087e92"/></marker></defs><text class="title" x="30" y="48">输入取舍与请求恢复</text><text x="30" y="94">职责路径；分支/回环见配套流程图</text><rect x="30" y="135" width="580" height="166" rx="16" fill="#e4ecff" stroke="#8db4be"/><text class="head" x="50" y="178">Meter测当前Surface及封装</text><text x="50" y="221">W容量 / O预留 / B余量</text><text x="50" y="260">T=floor(min(W×ratio,W−O−B))</text><path d="M320,307 L320,346" stroke="#087e92" stroke-width="4" marker-end="url(#a)"/><rect x="30" y="356" width="580" height="166" rx="16" fill="#dceff6" stroke="#8db4be"/><text class="head" x="50" y="399">常规压力 / 路由切换 / Overflow</text><text x="50" y="442">各入口条件和失败处理不同</text><text x="50" y="481">选区保护system首节点与工具对</text><path d="M320,528 L320,567" stroke="#087e92" stroke-width="4" marker-end="url(#a)"/><rect x="30" y="577" width="580" height="205" rx="16" fill="#e0f3eb" stroke="#8db4be"/><text class="head" x="50" y="620">压缩事实与Surface双层</text><text x="50" y="663">start → 辅助摘要 → 重验</text><text x="50" y="702">summary → user replace → end</text><text x="50" y="741">原始事件保留；非整体回滚</text><path d="M320,788 L320,827" stroke="#087e92" stroke-width="4" marker-end="url(#a)"/><rect x="30" y="837" width="580" height="166" rx="16" fill="#dceff6" stroke="#8db4be"/><text class="head" x="50" y="880">失败Attempt → request-error</text><text x="50" y="923">normal：资格 / 预算 / 退避</text><text x="50" y="962">always：先等下游，无成功保证</text><path d="M320,1009 L320,1048" stroke="#087e92" stroke-width="4" marker-end="url(#a)"/><rect x="30" y="1058" width="580" height="166" rx="16" fill="#dceff6" stroke="#8db4be"/><text class="head" x="50" y="1101">谁接手取决于Waterfall</text><text x="50" y="1144">Basic预算独立且要求输入进展</text><text x="50" y="1183">注册顺序可改变恢复决定</text><path d="M320,1230 L320,1269" stroke="#087e92" stroke-width="4" marker-end="url(#a)"/><rect x="30" y="1279" width="580" height="166" rx="16" fill="#e4ecff" stroke="#8db4be"/><text class="head" x="50" y="1322">同Step重新prepare / derive</text><text x="50" y="1365">不重接用户，不重跑所有工具</text><text x="50" y="1404">retry仅计划；started仅等待完成</text><text x="30" y="1547">固定 f3803c9；保证均依赖正文条件</text></svg>