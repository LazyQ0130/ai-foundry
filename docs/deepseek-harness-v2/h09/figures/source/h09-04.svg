<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1790" viewBox="0 0 640 1790" role="img" aria-labelledby="title desc"><title id="title">销毁与失败补偿流程</title><desc id="desc">正常关闭和失败共用teardown；先等发布与工作，Scope、写句柄、Agent、Session依序清理，通知按已开始的创建边配对。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="1790" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">销毁与失败补偿流程</text><rect x="28" y="135" width="280" height="145" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="168.0" y="179" font-size="32" font-weight="700" text-anchor="middle">正常关闭</text><text x="168.0" y="223" font-size="28" font-weight="400" text-anchor="middle">Handle.dispose</text><rect x="332" y="135" width="280" height="145" rx="18" fill="#FCE5E3" stroke="#187A91" stroke-width="2"/><text x="472.0" y="179" font-size="32" font-weight="700" text-anchor="middle">初始化内失败</text><text x="472.0" y="223" font-size="28" font-weight="400" text-anchor="middle">setup / 通知 / 取消</text><path d="M168 285 V320 H472 V285 M320 320 V365" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="380" width="584" height="185" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320.0" y="424" font-size="32" font-weight="700" text-anchor="middle">共同的内部teardown</text><text x="320.0" y="468" font-size="28" font-weight="400" text-anchor="middle">若发布通知在途，先等其收束</text><text x="320.0" y="506" font-size="28" font-weight="400" text-anchor="middle">cancel(disposed) → whenIdle</text><path d="M320 570 V615" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="630" width="584" height="140" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="674" font-size="32" font-weight="700" text-anchor="middle">撤销Scope注册</text><text x="320.0" y="718" font-size="28" font-weight="400" text-anchor="middle">等待作用域退出</text><path d="M320 775 V820" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="835" width="584" height="140" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="879" font-size="32" font-weight="700" text-anchor="middle">关闭可选Session写句柄</text><text x="320.0" y="923" font-size="28" font-weight="400" text-anchor="middle">等待该写通道close</text><path d="M320 980 V1025" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="1040" width="584" height="140" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1084" font-size="32" font-weight="700" text-anchor="middle">移除Agent → agent/disposed</text><text x="320.0" y="1128" font-size="28" font-weight="400" text-anchor="middle">此时Session仍暂时在Store</text><path d="M320 1185 V1230" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="1245" width="584" height="140" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1289" font-size="32" font-weight="700" text-anchor="middle">移除Session → session/disposed</text><text x="320.0" y="1333" font-size="28" font-weight="400" text-anchor="middle">退出追踪；不等于删除持久历史</text><rect x="28" y="1440" width="584" height="185" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1484" font-size="32" font-weight="700" text-anchor="middle">失败只配对已开始的创建通知</text><text x="320.0" y="1528" font-size="28" font-weight="400" text-anchor="middle">setup失败：仅Session退出边</text><text x="320.0" y="1566" font-size="28" font-weight="400" text-anchor="middle">Agent通知失败：两种退出边</text><text x="320" y="1690" font-size="28" font-weight="400" text-anchor="middle">各等待段失败仍尝试后续清理</text><text x="320" y="1735" font-size="28" font-weight="400" text-anchor="middle">正常释放报告收集错误；初始化保留原错</text></svg>