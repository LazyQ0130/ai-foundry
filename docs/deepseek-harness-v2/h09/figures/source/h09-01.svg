<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1395" viewBox="0 0 640 1395" role="img" aria-labelledby="title desc"><title id="title">创建、查询与释放能力</title><desc id="desc">Registry委托Factory创建返回Handle；查询独立返回Agent；默认loop内部把三个释放入口汇合。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="1395" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">创建、查询与释放能力</text><text x="320" y="108" font-size="28" font-weight="400" text-anchor="middle">公开入口：调用方 ctx.agents</text><rect x="28" y="145" width="584" height="135" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="189" font-size="32" font-weight="700" text-anchor="middle">Registry：实时登记与委托</text><text x="320.0" y="233" font-size="28" font-weight="400" text-anchor="middle">create / resume 携带 ownerCtx</text><path d="M320 285 V335" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><text x="475" y="318.0" font-size="28" font-weight="400" text-anchor="middle">委托</text><rect x="28" y="350" width="584" height="175" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="394" font-size="32" font-weight="700" text-anchor="middle">Factory：准备具体实例</text><text x="320.0" y="438" font-size="28" font-weight="400" text-anchor="middle">默认 AgentLoop 提供实现</text><text x="320.0" y="476" font-size="28" font-weight="400" text-anchor="middle">Session + Agent + Scope</text><path d="M320 530 V580" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><text x="475" y="563.0" font-size="28" font-weight="400" text-anchor="middle">创建成功</text><rect x="28" y="595" width="584" height="175" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="639" font-size="32" font-weight="700" text-anchor="middle">AgentHandle</text><text x="320.0" y="683" font-size="28" font-weight="400" text-anchor="middle">agent：公开运行接口</text><text x="320.0" y="721" font-size="28" font-weight="400" text-anchor="middle">dispose：该实例的释放入口</text><rect x="28" y="825" width="584" height="175" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="869" font-size="32" font-weight="700" text-anchor="middle">另一条入口：只查询</text><text x="320.0" y="913" font-size="28" font-weight="400" text-anchor="middle">get / list / roots → 裸 Agent</text><text x="320.0" y="951" font-size="28" font-weight="400" text-anchor="middle">查询不会取得 Handle.dispose</text><rect x="28" y="1055" width="584" height="175" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1099" font-size="32" font-weight="700" text-anchor="middle">内部：共同生命周期收尾</text><text x="320.0" y="1143" font-size="28" font-weight="400" text-anchor="middle">Handle / 调用方卸载 / 工厂卸载</text><text x="320.0" y="1181" font-size="28" font-weight="400" text-anchor="middle">汇到同一 teardown 等待边界</text><text x="320" y="1295" font-size="28" font-weight="400" text-anchor="middle">API能力纪律，不是插件安全沙箱</text><text x="320" y="1340" font-size="28" font-weight="400" text-anchor="middle">箭头是创建链；查询卡是独立支路</text></svg>