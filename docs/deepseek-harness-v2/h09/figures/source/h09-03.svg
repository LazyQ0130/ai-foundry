<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1610" viewBox="0 0 640 1610" role="img" aria-labelledby="title desc"><title id="title">父级、持有与资源归属</title><desc id="desc">五个身份分别取证；显式parentAgent、历史谱系、调用方和归因不相互推导，工厂也有生命周期责任。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="1610" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">父级、持有与资源归属</text><text x="320" y="108" font-size="28" font-weight="400" text-anchor="middle">同一个新Agent，可以有五种不同关系</text><rect x="28" y="150" width="584" height="185" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="194" font-size="32" font-weight="700" text-anchor="middle">调用方 Context / Fiber：P</text><text x="320.0" y="238" font-size="28" font-weight="400" text-anchor="middle">create所绑定的运行归属</text><text x="320.0" y="276" font-size="28" font-weight="400" text-anchor="middle">P卸载会推动实例收尾</text><rect x="28" y="375" width="584" height="185" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="419" font-size="32" font-weight="700" text-anchor="middle">Handle持有者：面板M</text><text x="320.0" y="463" font-size="28" font-weight="400" text-anchor="middle">M保存释放能力，可以主动关闭</text><text x="320.0" y="501" font-size="28" font-weight="400" text-anchor="middle">转交引用不解除P的结构责任</text><rect x="28" y="600" width="584" height="185" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="644" font-size="32" font-weight="700" text-anchor="middle">运行时父级 parentAgent：A</text><text x="320.0" y="688" font-size="28" font-weight="400" text-anchor="middle">显式进入 entry.owner</text><text x="320.0" y="726" font-size="28" font-weight="400" text-anchor="middle">isOwnedBy比较确切Agent对象</text><rect x="28" y="825" width="584" height="185" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="869" font-size="32" font-weight="700" text-anchor="middle">历史父级 parentSession：X</text><text x="320.0" y="913" font-size="28" font-weight="400" text-anchor="middle">持久会话元数据</text><text x="320.0" y="951" font-size="28" font-weight="400" text-anchor="middle">不会自动变成当前运行时父级</text><rect x="28" y="1050" width="584" height="185" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1094" font-size="32" font-weight="700" text-anchor="middle">当前发起方：A或没有</text><text x="320.0" y="1138" font-size="28" font-weight="400" text-anchor="middle">进程本地因果归因</text><text x="320.0" y="1176" font-size="28" font-weight="400" text-anchor="middle">不是授权，也不是存活证明</text><rect x="28" y="1310" width="584" height="140" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1354" font-size="32" font-weight="700" text-anchor="middle">另外还有工厂的结构责任</text><text x="320.0" y="1398" font-size="28" font-weight="400" text-anchor="middle">提供方退出，也要停止并等待实例</text><text x="320" y="1510" font-size="28" font-weight="400" text-anchor="middle">卡片间没有默认级联销毁箭头</text><text x="320" y="1555" font-size="28" font-weight="400" text-anchor="middle">运行时父级也不自动绑定Scope父链</text></svg>