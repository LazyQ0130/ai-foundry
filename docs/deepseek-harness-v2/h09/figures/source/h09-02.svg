<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1745" viewBox="0 0 640 1745" role="img" aria-labelledby="title desc"><title id="title">Agent创建与发布时序</title><desc id="desc">Session先登记并同步通知，setup及commit后Agent登记，再等serial通知；最后退出维护并返回，不能把get当准备完成。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="1745" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">Agent创建与发布时序</text><text x="320" y="108" font-size="28" font-weight="400" text-anchor="middle">默认工厂内部：自上而下表示先后</text><rect x="28" y="150" width="584" height="140" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="194" font-size="32" font-weight="700" text-anchor="middle">① Session准备 + 可选写句柄</text><text x="320.0" y="238" font-size="28" font-weight="400" text-anchor="middle">create：新建；resume：读取重建</text><path d="M320 295 V335" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="355" width="584" height="140" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320.0" y="399" font-size="32" font-weight="700" text-anchor="middle">② 所有权台账 → Agent与Scope</text><text x="320.0" y="443" font-size="28" font-weight="400" text-anchor="middle">先有清理联系，再取得作用域</text><path d="M320 500 V540" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="560" width="584" height="140" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="604" font-size="32" font-weight="700" text-anchor="middle">③ Session入Store并通知</text><text x="320.0" y="648" font-size="28" font-weight="400" text-anchor="middle">session/created：同步完成后可写</text><path d="M320 705 V745" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="765" width="584" height="180" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320.0" y="809" font-size="32" font-weight="700" text-anchor="middle">④ setup等待 → 可选同步commit</text><text x="320.0" y="853" font-size="28" font-weight="400" text-anchor="middle">Agent尚未入Registry</text><text x="320.0" y="891" font-size="28" font-weight="400" text-anchor="middle">作用域贡献按注册API立即生效</text><path d="M320 950 V990" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="1010" width="584" height="140" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1054" font-size="32" font-weight="700" text-anchor="middle">⑤ Agent进入Registry</text><text x="320.0" y="1098" font-size="28" font-weight="400" text-anchor="middle">显式记录 parentAgent</text><path d="M320 1155 V1195" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="1215" width="584" height="140" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1259" font-size="32" font-weight="700" text-anchor="middle">⑥ agent/created 串行等待</text><text x="320.0" y="1303" font-size="28" font-weight="400" text-anchor="middle">此前setup已完成；待办仍等待</text><path d="M320 1360 V1400" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="1420" width="584" height="180" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1464" font-size="32" font-weight="700" text-anchor="middle">⑦ ready → 退出维护活动</text><text x="320.0" y="1508" font-size="28" font-weight="400" text-anchor="middle">放行已排队唤醒；创建成功返回</text><text x="320.0" y="1546" font-size="28" font-weight="400" text-anchor="middle">不保证调用方先于首轮工作执行</text><text x="320" y="1680" font-size="28" font-weight="400" text-anchor="middle">初始化内失败：按已取得资源转图四</text></svg>