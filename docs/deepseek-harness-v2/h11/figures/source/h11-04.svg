<svg xmlns="http://www.w3.org/2000/svg" width="640" height="2218" viewBox="0 0 640 2218" role="img" aria-labelledby="title desc"><title id="title">从组装，到这次真实公共请求</title><desc id="desc">实际Loop先assemble、pre-step、step/start、renderPrompt，再prepareCall、refreshContext、渲染动态快照、提交系统和用户消息、derive并冻结公共请求。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="2218" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">从组装，到这次真实公共请求</text><text x="320" y="108" font-size="28" font-weight="400" text-anchor="middle">按箭头向下读；系统与Context分开render</text><rect x="28" y="150" width="584" height="174" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="194" font-size="32" font-weight="700" text-anchor="middle">候选Step：工具集合与组装</text><text x="320" y="241" font-size="28" font-weight="400" text-anchor="middle">捕获模型选择 → tools.resolve</text><text x="320" y="283" font-size="28" font-weight="400" text-anchor="middle">带Agent/scope/toolSet → assemble</text><path d="M320 328 V370" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/><rect x="28" y="384" width="584" height="174" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320" y="428" font-size="32" font-weight="700" text-anchor="middle">agent/pre-step接纳判断</text><text x="320" y="475" font-size="28" font-weight="400" text-anchor="middle">默认路径渲染Context候选</text><text x="320" y="517" font-size="28" font-weight="400" text-anchor="middle">尚未step/start；可拒绝或失败</text><path d="M320 562 V604" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/><rect x="28" y="618" width="584" height="174" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="662" font-size="32" font-weight="700" text-anchor="middle">正式step/start → renderPrompt</text><text x="320" y="709" font-size="28" font-weight="400" text-anchor="middle">先取得本Step系统文本</text><text x="320" y="751" font-size="28" font-weight="400" text-anchor="middle">此处插值失败：1Step，零请求</text><path d="M320 796 V838" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/><rect x="28" y="852" width="584" height="174" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320" y="896" font-size="32" font-weight="700" text-anchor="middle">prepareRequest → prepareCall</text><text x="320" y="943" font-size="28" font-weight="400" text-anchor="middle">绑定本次路线与有效能力</text><text x="320" y="985" font-size="28" font-weight="400" text-anchor="middle">准备中取消：不接纳本次消息</text><path d="M320 1030 V1072" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/><rect x="28" y="1086" width="584" height="174" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320" y="1130" font-size="32" font-weight="700" text-anchor="middle">刷新并渲染动态事实</text><text x="320" y="1177" font-size="28" font-weight="400" text-anchor="middle">refreshContext → renderContextSections</text><text x="320" y="1219" font-size="28" font-weight="400" text-anchor="middle">不重做段/变量/工具/Waterfall</text><path d="M320 1264 V1306" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/><rect x="28" y="1320" width="584" height="174" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="1364" font-size="32" font-weight="700" text-anchor="middle">协调并提交system/message</text><text x="320" y="1411" font-size="28" font-weight="400" text-anchor="middle">不变可沿用；能力决定更新形态</text><text x="320" y="1453" font-size="28" font-weight="400" text-anchor="middle">完整文本为空要清除旧有效指令</text><path d="M320 1498 V1540" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/><rect x="28" y="1554" width="584" height="174" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320" y="1598" font-size="32" font-weight="700" text-anchor="middle">接纳用户输入与运行快照</text><text x="320" y="1645" font-size="28" font-weight="400" text-anchor="middle">普通任务与runtime-context分来源</text><text x="320" y="1687" font-size="28" font-weight="400" text-anchor="middle">首次接纳避免重试重复用户任务</text><path d="M320 1732 V1774" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/><rect x="28" y="1788" width="584" height="216" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="1832" font-size="32" font-weight="700" text-anchor="middle">派生并冻结 → 交给模型边界</text><text x="320" y="1879" font-size="28" font-weight="400" text-anchor="middle">Session.deriveMessages → messages</text><text x="320" y="1921" font-size="28" font-weight="400" text-anchor="middle">工具声明独立放在tools</text><text x="320" y="1963" font-size="28" font-weight="400" text-anchor="middle">请求没有单独system字段</text><text x="320" y="2064" font-size="28" font-weight="400" text-anchor="middle">图省略流式与工具执行；留后续课</text><text x="320" y="2106" font-size="28" font-weight="400" text-anchor="middle">只有retry决策才回请求准备</text><text x="320" y="2148" font-size="28" font-weight="400" text-anchor="middle">重试不重跑assemble与pre-step</text></svg>