<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1684" viewBox="0 0 640 1684" role="img" aria-labelledby="title desc"><title id="title">模型请求里，不只有一段Prompt</title><desc id="desc">五类材料按不同路径到达公共请求；系统文本由系统消息承载，运行事实由带来源用户快照承载，Schema为独立tools字段。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="1684" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">模型请求里，不只有一段Prompt</text><text x="320" y="108" font-size="28" font-weight="400" text-anchor="middle">卡片并列表示来源与去向，不是时序</text><rect x="28" y="150" width="584" height="216" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="194" font-size="32" font-weight="700" text-anchor="middle">Section + Variable</text><text x="320" y="241" font-size="28" font-weight="400" text-anchor="middle">插件登记段；组装求文本与变量值</text><text x="320" y="283" font-size="28" font-weight="400" text-anchor="middle">renderPrompt → 系统指令文本</text><text x="320" y="325" font-size="28" font-weight="400" text-anchor="middle">按需system/message → messages</text><rect x="28" y="426" width="584" height="216" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320" y="470" font-size="32" font-weight="700" text-anchor="middle">Runtime Context</text><text x="320" y="517" font-size="28" font-weight="400" text-anchor="middle">环境服务贡献当前事实</text><text x="320" y="559" font-size="28" font-weight="400" text-anchor="middle">刷新 → renderContextSections</text><text x="320" y="601" font-size="28" font-weight="400" text-anchor="middle">带来源user/message → messages</text><rect x="28" y="702" width="584" height="216" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320" y="746" font-size="32" font-weight="700" text-anchor="middle">Tool Schema</text><text x="320" y="793" font-size="28" font-weight="400" text-anchor="middle">Tools可见集合 → 执行器描述</text><text x="320" y="835" font-size="28" font-weight="400" text-anchor="middle">PromptAssembly.tools保持独立</text><text x="320" y="877" font-size="28" font-weight="400" text-anchor="middle">request/header按需记录 → tools</text><rect x="28" y="978" width="584" height="216" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="1022" font-size="32" font-weight="700" text-anchor="middle">用户任务 + 先前交互</text><text x="320" y="1069" font-size="28" font-weight="400" text-anchor="middle">已接纳输入、助手、工具结果</text><text x="320" y="1111" font-size="28" font-weight="400" text-anchor="middle">Session.deriveMessages()</text><text x="320" y="1153" font-size="28" font-weight="400" text-anchor="middle">与有效系统节点共同形成历史</text><rect x="28" y="1254" width="584" height="216" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320" y="1298" font-size="32" font-weight="700" text-anchor="middle">公共模型请求</text><text x="320" y="1345" font-size="28" font-weight="400" text-anchor="middle">messages：派生并冻结的消息</text><text x="320" y="1387" font-size="28" font-weight="400" text-anchor="middle">tools：本次工具声明</text><text x="320" y="1429" font-size="28" font-weight="400" text-anchor="middle">没有单独system字段包办指令</text><text x="320" y="1530" font-size="28" font-weight="400" text-anchor="middle">变量表不是一条独立消息</text><text x="320" y="1572" font-size="28" font-weight="400" text-anchor="middle">Session接纳不等于磁盘flush</text><text x="320" y="1614" font-size="28" font-weight="400" text-anchor="middle">供应商协议转换留H12</text></svg>