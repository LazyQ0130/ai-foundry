<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1642" viewBox="0 0 640 1642" role="img" aria-labelledby="title desc"><title id="title">同一服务，不同Agent视图</title><desc id="desc">全局与A/B作用域分别形成模型输入；段变量同名覆盖，A工具差异来自真实Tools限制；匿名Provider本身叠加。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="1642" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">同一服务，不同Agent视图</text><text x="320" y="108" font-size="28" font-weight="400" text-anchor="middle">以下是并列视图；不是三个执行阶段</text><rect x="28" y="150" width="584" height="216" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="194" font-size="32" font-weight="700" text-anchor="middle">全局默认</text><text x="320" y="241" font-size="28" font-weight="400" text-anchor="middle">Persona：全局助手 {{language}}</text><text x="320" y="283" font-size="28" font-weight="400" text-anchor="middle">language = 默认语言</text><text x="320" y="325" font-size="28" font-weight="400" text-anchor="middle">共同指令 + read、audit工具</text><rect x="28" y="426" width="584" height="216" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320" y="470" font-size="32" font-weight="700" text-anchor="middle">Agent A：同名覆盖 + 工具限制</text><text x="320" y="517" font-size="28" font-weight="400" text-anchor="middle">Persona：助手A {{language}}</text><text x="320" y="559" font-size="28" font-weight="400" text-anchor="middle">language = 中文；audit被限制</text><text x="320" y="601" font-size="28" font-weight="400" text-anchor="middle">结果：助手A 中文；只见read</text><rect x="28" y="702" width="584" height="216" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320" y="746" font-size="32" font-weight="700" text-anchor="middle">Agent B：自己的同名覆盖</text><text x="320" y="793" font-size="28" font-weight="400" text-anchor="middle">Persona：Assistant B {{language}}</text><text x="320" y="835" font-size="28" font-weight="400" text-anchor="middle">language = English</text><text x="320" y="877" font-size="28" font-weight="400" text-anchor="middle">结果：B English；见read、audit</text><rect x="28" y="978" width="584" height="216" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320" y="1022" font-size="32" font-weight="700" text-anchor="middle">撤销A的两项覆盖</text><text x="320" y="1069" font-size="28" font-weight="400" text-anchor="middle">A下一次组装回到全局默认</text><text x="320" y="1111" font-size="28" font-weight="400" text-anchor="middle">B与全局登记未被改写</text><text x="320" y="1153" font-size="28" font-weight="400" text-anchor="middle">不是直接修改所有Agent配置</text><rect x="28" y="1254" width="584" height="216" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="1298" font-size="32" font-weight="700" text-anchor="middle">区分两种工具层次</text><text x="320" y="1345" font-size="28" font-weight="400" text-anchor="middle">匿名Tool Provider：叠加贡献</text><text x="320" y="1387" font-size="28" font-weight="400" text-anchor="middle">Tools定义/限制：计算可见集合</text><text x="320" y="1429" font-size="28" font-weight="400" text-anchor="middle">展示Waterfall不取得工具所有权</text><text x="320" y="1530" font-size="28" font-weight="400" text-anchor="middle">read/audit是本课固定工具名的简写</text><text x="320" y="1572" font-size="28" font-weight="400" text-anchor="middle">Scope不是权限或操作系统沙箱</text></svg>