<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1600" viewBox="0 0 640 1600" role="img" aria-labelledby="title desc"><title id="title">变量求值、段排序、文本渲染</title><desc id="desc">实际A示例展示先变量求值后规范化段、组装保留占位符与render输出；complete卡是另一次组装的独立分支，不与前面的render相连。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="1600" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">变量求值、段排序、文本渲染</text><text x="320" y="108" font-size="28" font-weight="400" text-anchor="middle">本例无展示改序；省略内置空Persona段</text><rect x="28" y="150" width="584" height="174" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="194" font-size="32" font-weight="700" text-anchor="middle">登记：加载顺序不决定文本顺序</text><text x="320" y="241" font-size="28" font-weight="400" text-anchor="middle">zeta(20) → Alpha(20) → first(-10)</text><text x="320" y="283" font-size="28" font-weight="400" text-anchor="middle">另有empty(30)，文本为空</text><path d="M320 328 V370" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/><rect x="28" y="384" width="584" height="174" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320" y="428" font-size="32" font-weight="700" text-anchor="middle">assemble先求变量值</text><text x="320" y="475" font-size="28" font-weight="400" text-anchor="middle">variables.tone = 简洁</text><text x="320" y="517" font-size="28" font-weight="400" text-anchor="middle">外部随后改成详细，旧值仍保留</text><path d="M320 562 V604" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/><rect x="28" y="618" width="584" height="216" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320" y="662" font-size="32" font-weight="700" text-anchor="middle">规范化段顺序，再求段文本</text><text x="320" y="709" font-size="28" font-weight="400" text-anchor="middle">first → Alpha → zeta → empty</text><text x="320" y="751" font-size="28" font-weight="400" text-anchor="middle">先order；同order按名称代码单元</text><text x="320" y="793" font-size="28" font-weight="400" text-anchor="middle">Alpha：A：用{{tone}}语言回答</text><path d="M320 838 V880" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/><rect x="28" y="894" width="584" height="258" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320" y="938" font-size="32" font-weight="700" text-anchor="middle">renderPrompt：完成插值与连接</text><text x="320" y="985" font-size="28" font-weight="400" text-anchor="middle">你是代码助手</text><text x="320" y="1027" font-size="28" font-weight="400" text-anchor="middle">A：用简洁语言回答</text><text x="320" y="1069" font-size="28" font-weight="400" text-anchor="middle">Z：补充说明</text><text x="320" y="1111" font-size="28" font-weight="400" text-anchor="middle">删除空字符串段；段间用空行</text><rect x="28" y="1212" width="584" height="216" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320" y="1256" font-size="32" font-weight="700" text-anchor="middle">独立分支：另一轮有complete</text><text x="320" y="1303" font-size="28" font-weight="400" text-anchor="middle">组装返回前恢复唯一complete段</text><text x="320" y="1345" font-size="28" font-weight="400" text-anchor="middle">多个有效complete → 组装失败</text><text x="320" y="1387" font-size="28" font-weight="400" text-anchor="middle">仍有变量/工具求值与Waterfall</text><text x="320" y="1488" font-size="28" font-weight="400" text-anchor="middle">未知或无值引用：明确失败</text><text x="320" y="1530" font-size="28" font-weight="400" text-anchor="middle">interpolate=false：字面文本保留</text></svg>