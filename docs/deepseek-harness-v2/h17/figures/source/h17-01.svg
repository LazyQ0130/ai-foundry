<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1230" viewBox="0 0 640 1230" role="img"><title>保存结果，还是保存发生过的事？</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#187A91" stroke-width="2"/></marker></defs><rect width="640" height="1230" fill="#F3F9F8"/>
<text x="32" y="57" font-size="32" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">保存结果，还是保存发生过的事？</text>
<rect x="32" y="100" width="576" height="156" rx="15" fill="#DDEDF5" stroke="#78A7AC"/>
<text x="52" y="143" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">方案一：只保存当前状态</text>
<text x="52" y="187" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">任务 = 已完成</text>
<text x="52" y="229" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">能读当前值；旧变化需另外记录</text>
<rect x="32" y="286" width="576" height="156" rx="15" fill="#D9F4E9" stroke="#78A7AC"/>
<text x="52" y="329" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">方案二：保存有序事实</text>
<text x="52" y="373" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">任务创建 → 开始 → 进度 50%</text>
<text x="52" y="415" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">→ 任务完成</text>
<path d="M320 451 V507" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/>
<text x="350" y="486" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">折叠 fold</text>
<rect x="32" y="532" width="576" height="156" rx="15" fill="#DDEDF5" stroke="#78A7AC"/>
<text x="52" y="575" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">按格式、顺序和规则计算</text>
<text x="52" y="619" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">初始：未开始</text>
<text x="52" y="661" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">遇开始：运行中；遇完成：已完成</text>
<rect x="32" y="718" width="576" height="156" rx="15" fill="#FFF0D7" stroke="#78A7AC"/>
<text x="52" y="761" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">当前读模型：任务 = 已完成</text>
<text x="52" y="805" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">可从同一前缀重新计算</text>
<text x="52" y="847" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">读模型不是另一份独立真源</text>
<rect x="32" y="904" width="576" height="156" rx="15" fill="#FCE5E3" stroke="#78A7AC"/>
<text x="52" y="947" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">教学类比的限制</text>
<text x="52" y="991" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">这不是核心 SessionEventMap 词汇</text>
<text x="52" y="1033" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">重建状态不会重做外部副作用</text>
<text x="32" y="1202" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">固定 f3803c9 · 图中边界以正文为准</text>
</svg>