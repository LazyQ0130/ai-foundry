<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1456" viewBox="0 0 640 1456" role="img"><title>测试金字塔：证据逐层扩展</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#187A91" stroke-width="2"/></marker></defs><rect width="640" height="1456" fill="#F3F9F8"/><text x="32" y="57" font-size="32" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">测试金字塔：证据逐层扩展</text><rect x="32" y="110" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/><text x="52" y="153" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">小对象：函数、组件、合同</text><text x="52" y="197" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">真实 Cordis / 官方单组件</text><text x="52" y="239" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">C：Tool 管线、Loader 合同</text><text x="52" y="281" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">低成本；未连接的边界仍未知</text><path d="M320 332 V384" stroke="#187A91" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="350" y="365" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">连接起来</text><rect x="32" y="410" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/><text x="52" y="453" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">D：真实多组件的局部链</text><text x="52" y="497" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">作者 YAML → Loader / AppBoot</text><text x="52" y="539" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">SDK / Loop / Tools / JSONL</text><text x="52" y="581" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">模型受控；不是完整发行树</text><path d="M320 632 V684" stroke="#187A91" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="350" y="665" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">补发行边界</text><rect x="32" y="710" width="576" height="198" rx="15" fill="#E9EDF1" stroke="#78A7AC"/><text x="52" y="753" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">E：完整交付 Profile 入口</text><text x="52" y="797" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">正式 lib / exports / Node 入口</text><text x="52" y="839" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Keyless Mock Provider 可独标</text><text x="52" y="881" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">本轮 E 正向集成：未验证</text><rect x="32" y="932" width="576" height="198" rx="15" fill="#FFF0D7" stroke="#78A7AC"/><text x="52" y="975" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">不同产品入口，各自留证</text><text x="52" y="1019" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">CLI / SDK / ACP / 产品 Web</text><text x="52" y="1061" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">真实浏览器 ≠ jsdom / 教材预览</text><text x="52" y="1103" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">局部成功不自动互相覆盖</text><rect x="32" y="1154" width="576" height="198" rx="15" fill="#E9EDF1" stroke="#78A7AC"/><text x="52" y="1197" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">外部 Provider 再单独检验</text><text x="52" y="1241" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">真实模型、互联网、用量与账单</text><text x="52" y="1283" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">无密钥 E 不等真实 Provider E2E</text><text x="52" y="1325" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">测试数量与覆盖率都非正确率</text><text x="32" y="1428" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">固定 f3803c9 · 实测范围与限制见正文</text></svg>