<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1612" viewBox="0 0 640 1612" role="img"><title>真实加载与受控回放链</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#187A91" stroke-width="2"/></marker></defs><rect width="640" height="1612" fill="#F3F9F8"/><text x="32" y="57" font-size="32" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">真实加载与受控回放链</text><rect x="32" y="110" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/><text x="52" y="153" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">真实作者 Profile / Loader</text><text x="52" y="197" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">manifest + YAML / inject / ACTIVE</text><text x="52" y="239" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">不是手工 prepare 挂核心服务</text><text x="52" y="281" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">不是完整 base / sdk-minimal</text><path d="M320 332 V384" stroke="#187A91" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="350" y="365" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">加载后</text><rect x="32" y="410" width="576" height="198" rx="15" fill="#FFF0D7" stroke="#78A7AC"/><text x="52" y="453" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">受控模型边界，按场景选择</text><text x="52" y="497" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">MockAdapter 或官方 LLM Replay</text><text x="52" y="539" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">真实 Runtime + HTTP Mock Server</text><text x="52" y="581" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">脚本固定；不测模型判断质量</text><path d="M320 632 V684" stroke="#187A91" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="350" y="665" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">模型提议</text><rect x="32" y="710" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/><text x="52" y="753" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">真实 AgentLoop → Tools</text><text x="52" y="797" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Turn / Step / Request / Attempt</text><text x="52" y="839" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">固定 safe 参数与授权目录</text><text x="52" y="881" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">工具 body / guard 分开观察</text><path d="M320 932 V984" stroke="#187A91" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="350" y="965" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">实际执行</text><rect x="32" y="1010" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/><text x="52" y="1053" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">Session / JSONL 与外部文件</text><text x="52" y="1097" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">CallId → Tool Result → 下一请求</text><text x="52" y="1139" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">日志关闭后恢复并 deriveMessages</text><text x="52" y="1181" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">独立重读 config 与未修改文件</text><path d="M320 1232 V1284" stroke="#187A91" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="350" y="1265" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">对照证据</text><rect x="32" y="1310" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/><text x="52" y="1353" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">不可变预期，分别比较</text><text x="52" y="1397" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Session Snapshot / 身份规范化</text><text x="52" y="1439" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">prompt / schema sidecar 完整比较</text><text x="52" y="1481" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">workspace.expected；不自动刷新</text><text x="32" y="1584" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">固定 f3803c9 · 实测范围与限制见正文</text></svg>