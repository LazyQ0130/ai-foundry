<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1456" viewBox="0 0 640 1456" role="img"><title>事件时间线：先选同一次运行</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#187A91" stroke-width="2"/></marker></defs><rect width="640" height="1456" fill="#F3F9F8"/><text x="32" y="57" font-size="32" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">事件时间线：先选同一次运行</text><rect x="32" y="110" width="576" height="198" rx="15" fill="#FFF0D7" stroke="#78A7AC"/><text x="52" y="153" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">D1：受控恢复，SDK 已接纳</text><text x="52" y="197" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Request 1 → 429 / RATE_LIMIT</text><text x="52" y="239" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">llm/retry → llm/retry-started</text><text x="52" y="281" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Retry-After 线值 1 秒，明确接受</text><path d="M320 332 V384" stroke="#187A91" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="350" y="365" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">恢复</text><rect x="32" y="410" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/><text x="52" y="453" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">D1：下一 Attempt 与工具</text><text x="52" y="497" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Request 2 → write_fixture 提议</text><text x="52" y="539" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">tool/call → tool/result，CallId 对齐</text><text x="52" y="581" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Request 3 真实输入包含工具结果</text><path d="M320 632 V684" stroke="#187A91" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="350" y="665" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">检查终态</text><rect x="32" y="710" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/><text x="52" y="753" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">D1：闭合与独立读回</text><text x="52" y="797" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Turn completed；shutdown 响应</text><text x="52" y="839" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">等实际进程 exit0，再读完整 JSONL</text><text x="52" y="881" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">新 Session 消息前缀等于模型输入</text><rect x="32" y="932" width="576" height="198" rx="15" fill="#FCE5E3" stroke="#78A7AC"/><text x="52" y="975" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">D4：另一场景，工具失败对照</text><text x="52" y="1019" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">工具 isError，模型仍自称已修改</text><text x="52" y="1061" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">目标文件不存在，writes 为 0</text><text x="52" y="1103" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">测试 PASS；任务验收 NO-GO</text><rect x="32" y="1154" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/><text x="52" y="1197" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">诊断的不同观察面</text><text x="52" y="1241" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Session：已记录事实；Client：通知</text><text x="52" y="1283" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">实时 raw 与历史结果可见性不同</text><text x="52" y="1325" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Trajectory 是视图；本地日志非上传</text><text x="32" y="1428" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">固定 f3803c9 · 实测范围与限制见正文</text></svg>