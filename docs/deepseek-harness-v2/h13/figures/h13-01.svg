<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1160" viewBox="0 0 640 1160" role="img"><title>一份定义，四种不同职责</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#187A91" stroke-width="2"/></marker></defs><rect width="640" height="1160" fill="#F3F9F8"/>
<text x="32" y="57" font-size="32" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">一份定义，四种不同职责</text>
<rect x="32" y="100" width="576" height="156" rx="15" fill="#DDEDF5" stroke="#78A7AC"/>
<text x="52" y="143" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">ToolDefinition：模型声明字段</text>
<text x="52" y="187" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">name · description</text>
<text x="52" y="229" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">parameters · deferLoading?</text>
<path d="M320 265 V321" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/>
<text x="348" y="300" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">显式投影</text>
<rect x="32" y="346" width="576" height="114" rx="15" fill="#D9F4E9" stroke="#78A7AC"/>
<text x="52" y="389" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">ToolSchema：只有声明数据</text>
<text x="52" y="433" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">没有 execute、output 或展示回调</text>
<text x="32" y="520" font-size="28" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">以下字段留在进程内，不随此投影发送</text>
<rect x="32" y="545" width="576" height="156" rx="15" fill="#FFF0D7" stroke="#78A7AC"/>
<text x="52" y="588" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">执行信息</text>
<text x="52" y="632" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">execute · timeoutMs</text>
<text x="52" y="674" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">isConcurrencySafe</text>
<rect x="32" y="725" width="576" height="156" rx="15" fill="#DDEDF5" stroke="#78A7AC"/>
<text x="52" y="768" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">规范结果与内容</text>
<text x="52" y="812" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">output.schema / render</text>
<text x="52" y="854" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">projectContent / finalizeContent</text>
<rect x="32" y="905" width="576" height="156" rx="15" fill="#D9F4E9" stroke="#78A7AC"/>
<text x="52" y="948" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">Host 展示</text>
<text x="52" y="992" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">presentCall / presentResult</text>
<text x="52" y="1034" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">与模型内容分开消费</text>
<text x="32" y="1132" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">固定源码 f3803c9 · 教学简图</text>
</svg>