<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1420" viewBox="0 0 640 1420" role="img"><title>一个 Step 的准入，不是永久许可</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#187A91" stroke-width="2"/></marker></defs><rect width="640" height="1420" fill="#F3F9F8"/>
<text x="32" y="57" font-size="32" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">一个 Step 的准入，不是永久许可</text>
<rect x="32" y="100" width="576" height="114" rx="15" fill="#DDEDF5" stroke="#78A7AC"/>
<text x="52" y="143" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">准备本 Step：捕获模型选择</text>
<text x="52" y="187" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">agent + modelSelection + signal</text>
<path d="M320 223 V279" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/>
<text x="348" y="258" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">resolve</text>
<rect x="32" y="304" width="576" height="156" rx="15" fill="#FFF0D7" stroke="#78A7AC"/>
<text x="52" y="347" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">逐个检查当前可见注册的 when</text>
<text x="52" y="391" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">true：收入；false：不收入</text>
<text x="52" y="433" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">抛错或取消：不交出部分集合</text>
<path d="M320 469 V525" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/>
<text x="348" y="504" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">完整返回</text>
<rect x="32" y="550" width="576" height="156" rx="15" fill="#D9F4E9" stroke="#78A7AC"/>
<text x="52" y="593" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">ResolvedToolSet 属于这个 Step</text>
<text x="52" y="637" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">重试复用；不因普通条件翻转重算</text>
<text x="52" y="679" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">下一 Step 重新 resolve</text>
<path d="M320 715 V771" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/>
<text x="348" y="750" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">读取或调用</text>
<rect x="32" y="796" width="576" height="156" rx="15" fill="#DDEDF5" stroke="#78A7AC"/>
<text x="52" y="839" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">仍核对当前状态</text>
<text x="52" y="883" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">同一 agent、同一注册身份</text>
<text x="52" y="925" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">当前可见且集合尚未释放</text>
<rect x="32" y="976" width="576" height="156" rx="15" fill="#FCE5E3" stroke="#78A7AC"/>
<text x="52" y="1019" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">可能失效</text>
<text x="52" y="1063" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">注销、同名替换、限制或 dispose</text>
<text x="52" y="1105" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">旧声明不能让工具自动复活</text>
<text x="32" y="1340" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">signal 需配合；不会硬终止任意 Promise</text>
<text x="32" y="1392" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">固定源码 f3803c9 · 教学简图</text>
</svg>