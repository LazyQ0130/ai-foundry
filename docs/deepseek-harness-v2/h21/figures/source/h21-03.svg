<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1978" viewBox="0 0 640 1978" role="img"><title>Activation 与两种结果交付</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#187A91" stroke-width="2"/></marker></defs><rect width="640" height="1978" fill="#F3F9F8"/><text x="32" y="57" font-size="32" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">Activation 与两种结果交付</text><rect x="32" y="110" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/><text x="52" y="153" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">准入与接受初始任务</text><text x="52" y="197" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">选 Provider → 检查能力与深度</text><text x="52" y="239" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">预留容量 → 创建 → Inbox 接受</text><text x="52" y="281" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">start 事件可能早于消息接受</text><path d="M320 332 V384" stroke="#187A91" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="350" y="365" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">返回回执</text><rect x="32" y="410" width="576" height="198" rx="15" fill="#FFF0D7" stroke="#78A7AC"/><text x="52" y="453" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">startActivation 返回</text><text x="52" y="497" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">childId / 本地 messageId</text><text x="52" y="539" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">result Promise / dispose()</text><text x="52" y="581" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">委派工具此时只给 started subagent</text><path d="M320 632 V684" stroke="#187A91" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="350" y="665" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">后台执行</text><rect x="32" y="710" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/><text x="52" y="753" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">后台工作独立推进</text><text x="52" y="797" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">父级可继续当前 Turn 或回 idle</text><text x="52" y="839" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">子级运行，可能收到后续消息</text><text x="52" y="881" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">自然结算需查 Inbox 和所拥有后代</text><path d="M320 932 V984" stroke="#187A91" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="350" y="965" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">结算</text><rect x="32" y="1010" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/><text x="52" y="1053" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">捕获、清理、再交付</text><text x="52" y="1097" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">本地最终 flush 为尽力而为</text><text x="52" y="1139" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">捕获结果 → 释放 Handle → 归还槽</text><text x="52" y="1181" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">资源清理完成后才交付结果</text><rect x="32" y="1232" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/><text x="52" y="1275" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">delivery = parent</text><text x="52" y="1319" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Manager 投递 subagent-settled 通知</text><text x="52" y="1361" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">父运行时 steer；父空闲时 queue</text><text x="52" y="1403" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">通知不是原委派工具的最终结果</text><rect x="32" y="1454" width="576" height="198" rx="15" fill="#FFF0D7" stroke="#78A7AC"/><text x="52" y="1497" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">delivery = caller</text><text x="52" y="1541" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">调用者 await activation.result</text><text x="52" y="1583" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">不额外发送父级完成通知</text><text x="52" y="1625" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">两种方式都保留本地子目录事实</text><rect x="32" y="1676" width="576" height="198" rx="15" fill="#FCE5E3" stroke="#78A7AC"/><text x="52" y="1719" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">interrupt 与 dispose 分开</text><text x="52" y="1763" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">interrupt 请求停当前工作并保队列</text><text x="52" y="1805" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">dispose 关闭本次及所拥有后代</text><text x="52" y="1847" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">result 与清理错误分层报告</text><text x="32" y="1950" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">固定 f3803c9 · 边界与条件见正文</text></svg>