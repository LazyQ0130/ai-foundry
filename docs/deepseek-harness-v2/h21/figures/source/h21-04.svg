<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1522" viewBox="0 0 640 1522" role="img"><title>Session、Scope 与所有权</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#187A91" stroke-width="2"/></marker></defs><rect width="640" height="1522" fill="#F3F9F8"/><text x="32" y="57" font-size="32" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">Session、Scope 与所有权</text><rect x="32" y="110" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/><text x="52" y="153" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">当前运行对象</text><text x="52" y="197" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">父 Agent ← Registry owner → 子 Agent</text><text x="52" y="239" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Manager 持有精确子 AgentHandle</text><text x="52" y="281" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">运行树与历史谱系分别取证</text><rect x="32" y="332" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/><text x="52" y="375" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">共享 Host，不同 Agent Scope</text><text x="52" y="419" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">父局部工具 parent_only</text><text x="52" y="461" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">子局部工具 child_only</text><text x="52" y="503" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">共享服务不等于共享所有注册</text><rect x="32" y="554" width="576" height="198" rx="15" fill="#FFF0D7" stroke="#78A7AC"/><text x="52" y="597" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">两个持久 Session</text><text x="52" y="641" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">父：工具回执、relay、结算通知</text><text x="52" y="683" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">子：descriptor、自己的执行事实</text><text x="52" y="725" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Fork 的继承前缀不算子级新工作</text><rect x="32" y="776" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/><text x="52" y="819" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">发现目录由父级拥有</text><text x="52" y="863" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">父 Session 写 subagent/catalog</text><text x="52" y="905" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">读历史目录无需启动子 Agent</text><text x="52" y="947" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">普通 Session 分支不会自动入册</text><rect x="32" y="998" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/><text x="52" y="1041" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">同一 childId，不同执行期</text><text x="52" y="1085" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">第一次结束：Agent 退出 Registry</text><text x="52" y="1127" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">持久 Session 留存，可冷恢复</text><text x="52" y="1169" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">下一次 Activation 有新的 runId</text><rect x="32" y="1220" width="576" height="198" rx="15" fill="#FCE5E3" stroke="#78A7AC"/><text x="52" y="1263" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">需要逐层核对的边界</text><text x="52" y="1307" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Scope 是注册及可见性机制</text><text x="52" y="1349" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">同进程不是独立 OS 安全沙箱</text><text x="52" y="1391" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">权限依赖真实组合和执行策略</text><text x="32" y="1494" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">固定 f3803c9 · 边界与条件见正文</text></svg>