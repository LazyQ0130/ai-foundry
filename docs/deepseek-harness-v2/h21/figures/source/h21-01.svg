<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1612" viewBox="0 0 640 1612" role="img"><title>委派能力：谁负责哪一层</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#187A91" stroke-width="2"/></marker></defs><rect width="640" height="1612" fill="#F3F9F8"/><text x="32" y="57" font-size="32" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">委派能力：谁负责哪一层</text><rect x="32" y="110" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/><text x="52" y="153" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">父 Agent 与模型工具</text><text x="52" y="197" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Tool Registry 控制声明和可见性</text><text x="52" y="239" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">模型提议 → 官方委派工具调用</text><text x="52" y="281" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">工具只先返回 childId</text><path d="M320 332 V384" stroke="#187A91" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="350" y="365" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">调用</text><rect x="32" y="410" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/><text x="52" y="453" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">Subagent Runtime</text><text x="52" y="497" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">ctx.subagents：具名 Provider 注册</text><text x="52" y="539" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">验证能力、精确父身份与请求</text><text x="52" y="581" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">内部 Manager 承担统一管理</text><path d="M320 632 V684" stroke="#187A91" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="350" y="665" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">按名选择</text><rect x="32" y="710" width="576" height="198" rx="15" fill="#FFF0D7" stroke="#78A7AC"/><text x="52" y="753" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">Provider 提供不同后端</text><text x="52" y="797" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">本地：只准备空 seed 或历史 seed</text><text x="52" y="839" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">外部：start 返回一次执行句柄</text><text x="52" y="881" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">不是所有后端都能继续收消息</text><path d="M320 932 V984" stroke="#187A91" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="350" y="965" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">本地分支</text><rect x="32" y="1010" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/><text x="52" y="1053" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">Manager 与 Agent Factory 协作</text><text x="52" y="1097" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Manager 持有容量、身份与 Handle</text><text x="52" y="1139" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">通过 agents.create / resume 创建</text><text x="52" y="1181" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Factory 才负责真实 Agent 初始化</text><path d="M320 1232 V1284" stroke="#187A91" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="350" y="1265" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">管理执行</text><rect x="32" y="1310" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/><text x="52" y="1353" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">子级执行及回传</text><text x="52" y="1397" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">子级有自己的 Agent、Scope、Session</text><text x="52" y="1439" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Manager 捕获结果、等待资源清理</text><text x="52" y="1481" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">parent 通知 / caller 直接取结果</text><text x="32" y="1584" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">固定 f3803c9 · 边界与条件见正文</text></svg>