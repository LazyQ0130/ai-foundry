<svg xmlns="http://www.w3.org/2000/svg" width="640" height="3146" viewBox="0 0 640 3146" role="img" aria-labelledby="title desc">
<title id="title">直接回答与工具反馈：时序对比</title><desc id="desc">两种精选交互时序。工具请求先成为助手消息，再经工具系统记录调用、检查和执行，结果提交后才能进入下一次模型请求；会话追加与实时显示、落盘有不同边界。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style>
<rect width="640" height="3146" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">直接回答与工具反馈：时序对比</text><text x="320" y="105" font-size="28" font-weight="400" text-anchor="middle">箭头：调用、返回或向会话追加事实</text><rect x="24" y="145" width="592" height="100" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="188" font-size="32" font-weight="700" text-anchor="middle">A｜已提供正文：一个 Step</text><text x="80" y="280" font-size="28" font-weight="700" text-anchor="middle">运行器</text><text x="240" y="280" font-size="28" font-weight="700" text-anchor="middle">模型</text><text x="400" y="280" font-size="28" font-weight="700" text-anchor="middle">工具</text><text x="560" y="280" font-size="28" font-weight="700" text-anchor="middle">会话</text><line x1="80" y1="298" x2="80" y2="965" stroke="#A3C8CC" stroke-width="2" stroke-dasharray="5 6"/><line x1="240" y1="298" x2="240" y2="965" stroke="#A3C8CC" stroke-width="2" stroke-dasharray="5 6"/><line x1="400" y1="298" x2="400" y2="965" stroke="#A3C8CC" stroke-width="2" stroke-dasharray="5 6"/><line x1="560" y1="298" x2="560" y2="965" stroke="#A3C8CC" stroke-width="2" stroke-dasharray="5 6"/><rect x="28" y="307" width="584" height="44" rx="9" fill="#F3F9F8"/><text x="320" y="335" font-size="28" font-weight="400" text-anchor="middle">turn/start；接纳后 step/start</text><polyline points="80,387 560,387" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="439" width="584" height="44" rx="9" fill="#F3F9F8"/><text x="320" y="467" font-size="28" font-weight="400" text-anchor="middle">准备并请求模型（已有正文）</text><polyline points="80,519 240,519" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="571" width="584" height="44" rx="9" fill="#F3F9F8"/><text x="320" y="599" font-size="28" font-weight="400" text-anchor="middle">流式响应：摘要</text><polyline points="240,651 80,651" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="703" width="584" height="44" rx="9" fill="#F3F9F8"/><text x="320" y="731" font-size="28" font-weight="400" text-anchor="middle">追加 assistant/message</text><polyline points="80,783 560,783" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="835" width="584" height="44" rx="9" fill="#F3F9F8"/><text x="320" y="863" font-size="28" font-weight="400" text-anchor="middle">step/end；停止检查后 turn/end</text><polyline points="80,915 560,915" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="1030" width="592" height="100" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1073" font-size="32" font-weight="700" text-anchor="middle">B｜只给文件名：两个 Step</text><text x="80" y="1165" font-size="28" font-weight="700" text-anchor="middle">运行器</text><text x="240" y="1165" font-size="28" font-weight="700" text-anchor="middle">模型</text><text x="400" y="1165" font-size="28" font-weight="700" text-anchor="middle">工具</text><text x="560" y="1165" font-size="28" font-weight="700" text-anchor="middle">会话</text><line x1="80" y1="1183" x2="80" y2="2906" stroke="#A3C8CC" stroke-width="2" stroke-dasharray="5 6"/><line x1="240" y1="1183" x2="240" y2="2906" stroke="#A3C8CC" stroke-width="2" stroke-dasharray="5 6"/><line x1="400" y1="1183" x2="400" y2="2906" stroke="#A3C8CC" stroke-width="2" stroke-dasharray="5 6"/><line x1="560" y1="1183" x2="560" y2="2906" stroke="#A3C8CC" stroke-width="2" stroke-dasharray="5 6"/><rect x="28" y="1192" width="584" height="44" rx="9" fill="#F3F9F8"/><text x="320" y="1220" font-size="28" font-weight="400" text-anchor="middle">turn/start；接纳后 step/start</text><polyline points="80,1272 560,1272" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="1324" width="584" height="44" rx="9" fill="#F3F9F8"/><text x="320" y="1352" font-size="28" font-weight="400" text-anchor="middle">请求 ①：尚无读取结果</text><polyline points="80,1404 240,1404" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="1456" width="584" height="44" rx="9" fill="#F3F9F8"/><text x="320" y="1484" font-size="28" font-weight="400" text-anchor="middle">流式响应：工具调用提议</text><polyline points="240,1536 80,1536" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="1588" width="584" height="44" rx="9" fill="#F3F9F8"/><text x="320" y="1616" font-size="28" font-weight="400" text-anchor="middle">先追加 assistant/message</text><polyline points="80,1668 560,1668" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="1720" width="584" height="44" rx="9" fill="#F3F9F8"/><text x="320" y="1748" font-size="28" font-weight="400" text-anchor="middle">转交 tools.execute(...)</text><polyline points="80,1800 400,1800" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="1852" width="584" height="44" rx="9" fill="#F3F9F8"/><text x="320" y="1880" font-size="28" font-weight="400" text-anchor="middle">tool/call：尚未保证执行</text><polyline points="400,1932 560,1932" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="1984" width="584" height="44" rx="9" fill="#F3F9F8"/><text x="320" y="2012" font-size="28" font-weight="400" text-anchor="middle">检查 → 执行允许的读取</text><polyline points="400,2051 438,2051 438,2084 400,2084" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="2116" width="584" height="44" rx="9" fill="#F3F9F8"/><text x="320" y="2144" font-size="28" font-weight="400" text-anchor="middle">tool/result：成功或错误</text><polyline points="400,2196 560,2196" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="2248" width="584" height="44" rx="9" fill="#F3F9F8"/><text x="320" y="2276" font-size="28" font-weight="400" text-anchor="middle">step/end；接纳后 step/start</text><polyline points="80,2328 560,2328" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="2380" width="584" height="44" rx="9" fill="#F3F9F8"/><text x="320" y="2408" font-size="28" font-weight="400" text-anchor="middle">请求 ②：历史包含工具结果</text><polyline points="80,2460 240,2460" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="2512" width="584" height="44" rx="9" fill="#F3F9F8"/><text x="320" y="2540" font-size="28" font-weight="400" text-anchor="middle">流式响应：根据资料回答</text><polyline points="240,2592 80,2592" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="2644" width="584" height="44" rx="9" fill="#F3F9F8"/><text x="320" y="2672" font-size="28" font-weight="400" text-anchor="middle">assistant/message → step/end</text><polyline points="80,2724 560,2724" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="2776" width="584" height="44" rx="9" fill="#F3F9F8"/><text x="320" y="2804" font-size="28" font-weight="400" text-anchor="middle">停止检查后追加 turn/end</text><polyline points="80,2856 560,2856" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="2971" font-size="28" font-weight="400" text-anchor="middle">工具列 = 服务、原生执行器与流水线</text><text x="320" y="3015" font-size="28" font-weight="400" text-anchor="middle">省略按需快照与 UI 通知，详见图 2</text><text x="320" y="3059" font-size="28" font-weight="700" text-anchor="middle">响应提交后才发 committed end</text><text x="320" y="3103" font-size="28" font-weight="400" text-anchor="middle">会话追加不等于磁盘 flush</text></svg>