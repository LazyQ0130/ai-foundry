<svg xmlns="http://www.w3.org/2000/svg" width="640" height="3061" viewBox="0 0 640 3061" role="img" aria-labelledby="title desc">
<title id="title">一次请求：处理、记录与反馈</title><desc id="desc">输入入队后打开 Turn，接纳前准备，进入 Step 后准备模型并提交请求材料，模型流结算后执行工具，再在同一 Turn 内继续或结束；实时通知与磁盘持久化另有边界。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style>
<rect width="640" height="3061" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">一次请求：处理、记录与反馈</text><text x="320" y="105" font-size="28" font-weight="400" text-anchor="middle">主线：输入接纳，原生工具，配置稳定</text><rect x="36" y="145" width="510" height="160" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="291.0" y="188" font-size="32" font-weight="700" text-anchor="middle">输入接口与队列</text><text x="291.0" y="230" font-size="28" font-weight="400" text-anchor="middle">followup → Inbox 入队</text><text x="291.0" y="268" font-size="28" font-weight="400" text-anchor="middle">事实：agent/inbox/spliced</text><polyline points="291,305 291,347" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="351" width="510" height="160" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="291.0" y="394" font-size="32" font-weight="700" text-anchor="middle">① 打开轮次</text><text x="291.0" y="436" font-size="28" font-weight="400" text-anchor="middle">事实：turn/start</text><text x="291.0" y="474" font-size="28" font-weight="400" text-anchor="middle">先开 Turn，再领取与接纳</text><polyline points="291,511 291,553" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="557" width="510" height="160" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="291.0" y="600" font-size="32" font-weight="700" text-anchor="middle">② 准备候选 Step</text><text x="291.0" y="642" font-size="28" font-weight="400" text-anchor="middle">领取 Inbox → 选模型</text><text x="291.0" y="680" font-size="28" font-weight="400" text-anchor="middle">解析工具集合 → 组装提示材料</text><polyline points="291,717 291,759" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="763" width="510" height="198" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="291.0" y="806" font-size="32" font-weight="700" text-anchor="middle">决定是否接纳</text><text x="291.0" y="848" font-size="28" font-weight="400" text-anchor="middle">agent/pre-step：enter 向下</text><text x="291.0" y="886" font-size="28" font-weight="400" text-anchor="middle">reject → turn/end：blocked</text><text x="291.0" y="924" font-size="28" font-weight="400" text-anchor="middle">首次拒绝：零 Step、零请求</text><polyline points="291,961 291,1003" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="1007" width="510" height="122" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="291.0" y="1050" font-size="32" font-weight="700" text-anchor="middle">③ 打开 Step</text><text x="291.0" y="1092" font-size="28" font-weight="400" text-anchor="middle">事实：step/start</text><polyline points="291,1129 291,1171" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="1175" width="510" height="160" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="291.0" y="1218" font-size="32" font-weight="700" text-anchor="middle">④ 先准备模型调用</text><text x="291.0" y="1260" font-size="28" font-weight="400" text-anchor="middle">prepareRequest → llm.prepareCall</text><text x="291.0" y="1298" font-size="28" font-weight="400" text-anchor="middle">绑定适配器与有效配置</text><polyline points="291,1335 291,1377" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="1381" width="510" height="198" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="291.0" y="1424" font-size="32" font-weight="700" text-anchor="middle">⑤ 提交并构造请求</text><text x="291.0" y="1466" font-size="28" font-weight="400" text-anchor="middle">system / user 消息按需接纳</text><text x="291.0" y="1504" font-size="28" font-weight="400" text-anchor="middle">request/header、context 按需记录</text><text x="291.0" y="1542" font-size="28" font-weight="400" text-anchor="middle">deriveMessages → 冻结请求</text><polyline points="291,1579 291,1621" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="1625" width="510" height="160" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="291.0" y="1668" font-size="32" font-weight="700" text-anchor="middle">⑥ 请求与接收模型流</text><text x="291.0" y="1710" font-size="28" font-weight="400" text-anchor="middle">适配器 stream → 汇集响应块</text><text x="291.0" y="1748" font-size="28" font-weight="400" text-anchor="middle">实时 start / chunk：尚非最终记录</text><polyline points="291,1785 291,1827" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="1831" width="510" height="160" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="291.0" y="1874" font-size="32" font-weight="700" text-anchor="middle">⑦ 结算助手响应</text><text x="291.0" y="1916" font-size="28" font-weight="400" text-anchor="middle">先追加 assistant/message</text><text x="291.0" y="1954" font-size="28" font-weight="400" text-anchor="middle">再发 committed end（含 seq）</text><polyline points="291,1991 291,2033" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="2037" width="510" height="198" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="291.0" y="2080" font-size="32" font-weight="700" text-anchor="middle">⑧ 有工具提议时</text><text x="291.0" y="2122" font-size="28" font-weight="400" text-anchor="middle">tools.execute → tool/call</text><text x="291.0" y="2160" font-size="28" font-weight="400" text-anchor="middle">检查 → 执行允许的操作</text><text x="291.0" y="2198" font-size="28" font-weight="400" text-anchor="middle">tool/result → 后续请求的历史</text><polyline points="291,2235 291,2277" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="2281" width="510" height="160" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="291.0" y="2324" font-size="32" font-weight="700" text-anchor="middle">⑨ 关闭当前 Step</text><text x="291.0" y="2366" font-size="28" font-weight="400" text-anchor="middle">事实：step/end</text><text x="291.0" y="2404" font-size="28" font-weight="400" text-anchor="middle">没有工具时也经过这里</text><polyline points="291,2441 291,2483" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="2487" width="510" height="198" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="291.0" y="2530" font-size="32" font-weight="700" text-anchor="middle">⑩ 继续，还是结束？</text><text x="291.0" y="2572" font-size="28" font-weight="400" text-anchor="middle">工具反馈或新输入：回到②</text><text x="291.0" y="2610" font-size="28" font-weight="400" text-anchor="middle">自然结束：检查停止与队列</text><text x="291.0" y="2648" font-size="28" font-weight="400" text-anchor="middle">确认可停 → turn/end</text><polyline points="546,2562 608,2562 608,622 546,622" fill="none" stroke="#187A91" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="36" y="2735" width="568" height="198" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320.0" y="2778" font-size="32" font-weight="700" text-anchor="middle">旁路：实时观察 ≠ 会话事实</text><text x="320.0" y="2820" font-size="28" font-weight="400" text-anchor="middle">agent/status · assistant-stream</text><text x="320.0" y="2858" font-size="28" font-weight="400" text-anchor="middle">chunk 不逐条写成会话消息</text><text x="320.0" y="2896" font-size="28" font-weight="400" text-anchor="middle">Session 提交 ≠ 磁盘 flush</text><text x="320" y="2981" font-size="28" font-weight="700" text-anchor="middle">蓝：处理  绿：事实  琥珀：边界</text><text x="320" y="3025" font-size="28" font-weight="400" text-anchor="middle">虚线：继续本 Turn 的下一 Step</text></svg>