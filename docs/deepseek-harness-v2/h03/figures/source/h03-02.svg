<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1970" viewBox="0 0 640 1970" role="img" aria-labelledby="title desc">
<title id="title">Turn、Step 与工具的包含关系</title><desc id="desc">三个独立轮次分别说明零步骤拒绝、单步骤回答与两步骤工具反馈；步骤内可以有多个工具或重试尝试。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style>
<rect width="640" height="1970" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">Turn、Step 与工具的包含关系</text><text x="320" y="105" font-size="28" font-weight="400" text-anchor="middle">包含关系图；不是线程或部署图</text><rect x="28" y="145" width="584" height="365" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320.0" y="188" font-size="32" font-weight="700" text-anchor="middle">Turn A：输入被拒绝</text><text x="320" y="235" font-size="28" font-weight="400" text-anchor="middle">turn/start → 领取与接纳检查</text><rect x="60" y="265" width="520" height="120" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320.0" y="308" font-size="32" font-weight="700" text-anchor="middle">reject：不打开 Step</text><text x="320" y="430" font-size="28" font-weight="400" text-anchor="middle">turn/end：blocked</text><text x="320" y="478" font-size="28" font-weight="400" text-anchor="middle">零 Step · 零模型请求</text><rect x="28" y="550" width="584" height="420" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="593" font-size="32" font-weight="700" text-anchor="middle">Turn B：直接回答</text><text x="320" y="638" font-size="28" font-weight="400" text-anchor="middle">turn/start → 接纳</text><rect x="60" y="666" width="520" height="188" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="709" font-size="32" font-weight="700" text-anchor="middle">Step 1</text><text x="320.0" y="751" font-size="28" font-weight="400" text-anchor="middle">模型请求 → 回答结算</text><text x="320.0" y="789" font-size="28" font-weight="400" text-anchor="middle">无 Tool Call 也有 Step</text><text x="320" y="915" font-size="28" font-weight="400" text-anchor="middle">step/end → 停止检查 → turn/end</text><rect x="28" y="1010" width="584" height="775" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1053" font-size="32" font-weight="700" text-anchor="middle">Turn C：工具反馈后回答</text><text x="320" y="1098" font-size="28" font-weight="400" text-anchor="middle">turn/start → 接纳</text><rect x="60" y="1125" width="520" height="228" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1168" font-size="32" font-weight="700" text-anchor="middle">Step 1</text><text x="320.0" y="1210" font-size="28" font-weight="400" text-anchor="middle">模型请求 → 读取提议结算</text><text x="320.0" y="1248" font-size="28" font-weight="400" text-anchor="middle">工具：记录调用 → 检查与执行</text><text x="320.0" y="1286" font-size="28" font-weight="400" text-anchor="middle">记录工具结果 → step/end</text><polyline points="320,1353 320,1399" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="1412" width="520" height="188" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1455" font-size="32" font-weight="700" text-anchor="middle">Step 2</text><text x="320.0" y="1497" font-size="28" font-weight="400" text-anchor="middle">请求包含先前工具结果</text><text x="320.0" y="1535" font-size="28" font-weight="400" text-anchor="middle">摘要结算 → step/end</text><text x="320" y="1658" font-size="28" font-weight="400" text-anchor="middle">停止检查 → turn/end</text><text x="320" y="1706" font-size="28" font-weight="400" text-anchor="middle">一个 Step 可有多个工具调用</text><text x="320" y="1751" font-size="28" font-weight="400" text-anchor="middle">重试尝试也可能留在同一 Step</text><text x="320" y="1844" font-size="28" font-weight="400" text-anchor="middle">继续读取另一份资料，再回答：</text><text x="320" y="1886" font-size="28" font-weight="400" text-anchor="middle">可增加 Step 3，不必另开 Turn</text><text x="320" y="1932" font-size="28" font-weight="700" text-anchor="middle">Turn 结束 ≠ 已达成用户目标</text></svg>