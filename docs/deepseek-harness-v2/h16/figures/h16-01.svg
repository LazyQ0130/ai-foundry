<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1420" viewBox="0 0 640 1420" role="img"><title>同一个工具入口，不同能力边界</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#187A91" stroke-width="2"/></marker></defs><rect width="640" height="1420" fill="#F3F9F8"/>
<text x="32" y="57" font-size="32" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">同一个工具入口，不同能力边界</text>
<rect x="32" y="100" width="576" height="114" rx="15" fill="#DDEDF5" stroke="#78A7AC"/>
<text x="52" y="143" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">Agent 当前 Step</text>
<text x="52" y="187" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">可见 Schema → 提出 ToolCallBlock</text>
<path d="M320 223 V279" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/>
<text x="350" y="258" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">调用</text>
<rect x="32" y="304" width="576" height="156" rx="15" fill="#FFF0D7" stroke="#78A7AC"/>
<text x="52" y="347" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">Tools Registry / Native / Pipeline</text>
<text x="52" y="391" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">名称与身份；步骤准入；执行与结果</text>
<text x="52" y="433" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">统一协议不代表统一权限</text>
<path d="M320 469 V525" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/>
<text x="350" y="504" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">分派</text>
<rect x="32" y="550" width="576" height="156" rx="15" fill="#DDEDF5" stroke="#78A7AC"/>
<text x="52" y="593" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">File / Shell</text>
<text x="52" y="637" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">tool-fs → ctx.fs → 文件后端</text>
<text x="52" y="679" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">tool-pwsh / bash → ctx.shell</text>
<rect x="32" y="732" width="576" height="156" rx="15" fill="#D9F4E9" stroke="#78A7AC"/>
<text x="52" y="775" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">Web</text>
<text x="52" y="819" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">tool-web → ctx.web → Search / Fetch</text>
<text x="52" y="861" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">按调用选择提供方；步骤另查 ready</text>
<rect x="32" y="914" width="576" height="156" rx="15" fill="#DDEDF5" stroke="#78A7AC"/>
<text x="52" y="957" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">MCP</text>
<text x="52" y="1001" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">每服务器 client 把发现结果注册成工具</text>
<text x="52" y="1043" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">调用 → SDK → 配置的 Server</text>
<rect x="32" y="1096" width="576" height="198" rx="15" fill="#FCE5E3" stroke="#78A7AC"/>
<text x="52" y="1139" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">具体能力各自拥有约束与资源</text>
<text x="52" y="1183" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">File 版本条件；Shell 进程与 Jobs</text>
<text x="52" y="1225" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Web 网络目标；MCP 连接与作用域</text>
<text x="52" y="1267" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">注册、准入、执行不可合成一个状态</text>
<text x="32" y="1392" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">固定源码 f3803c9 · 条件组合教学图</text>
