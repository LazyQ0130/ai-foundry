<text x="52" y="389" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">1 File → 2 Shell</text>
<text x="52" y="433" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">File：真实工具 / 后端读取新夹具</text>
<text x="52" y="475" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Shell：真实工具 + Mock Executor</text>
<text x="52" y="517" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">不启动 Bash / PowerShell 命令</text>
<path d="M320 553 V609" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/>
<text x="350" y="588" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">顺序示例</text>
<rect x="32" y="634" width="576" height="156" rx="15" fill="#D9F4E9" stroke="#78A7AC"/>
<text x="52" y="677" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">3 Search → 4 Fetch → 5 MCP</text>
<text x="52" y="721" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Web：真实 Runtime + 离线提供方</text>
<text x="52" y="763" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">MCP：实际 SDK / stdio / 本地 Server</text>
<path d="M320 799 V855" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/>
<text x="350" y="834" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">结算</text>
<rect x="32" y="880" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/>
<text x="52" y="923" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">工具结果 → Session → 下一请求</text>
<text x="52" y="967" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">实际 tool/call 与 tool/result</text>
<text x="52" y="1009" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">第二 Session 重建请求前缀核对</text>
<text x="52" y="1051" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">脚本 Adapter 据工具历史生成说明</text>
