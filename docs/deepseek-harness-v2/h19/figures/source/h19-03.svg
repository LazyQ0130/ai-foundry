<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1598" viewBox="0 0 640 1598" role="img"><title>一次压缩尝试，事实逐条提交</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#187A91" stroke-width="2"/></marker></defs><rect width="640" height="1598" fill="#F3F9F8"/>
<text x="32" y="57" font-size="32" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">一次压缩尝试，事实逐条提交</text>
<rect x="32" y="100" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/>
<text x="52" y="143" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">同步验证，先登记开始</text>
<text x="52" y="187" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">范围有效、配对平衡、没有活动锁</text>
<text x="52" y="229" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">compaction/start：数字Turn或null</text>
<text x="52" y="271" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">此后才允许异步摘要让出控制权</text>
<path d="M320 307 V363" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/>
<text x="350" y="342" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">辅助调用</text>
<rect x="32" y="388" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/>
<text x="52" y="431" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">摘要请求 purpose=compaction</text>
<text x="52" y="475" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">回放system、选区、工具声明</text>
<text x="52" y="517" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">另加摘要指令；不是用户任务Step</text>
<text x="52" y="559" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">取消 / 失败：保留已提交事实</text>
<rect x="32" y="616" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/>
<text x="52" y="659" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">重验稳定性与缩减幅度</text>
<text x="52" y="703" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">自动：整个Surface仍相同</text>
<text x="52" y="745" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">手动：选中span仍相同</text>
<text x="52" y="787" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">带框摘要必须严格小于所选价格</text>
<rect x="32" y="844" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/>
<text x="52" y="887" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">成功的同步相邻提交</text>
<text x="52" y="931" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">summary（仅日志，含来源与原输出）</text>
<text x="52" y="973" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">user/message replace（改变Surface）</text>
<text x="52" y="1015" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">end（仅日志，结束尝试）</text>
<rect x="32" y="1072" width="576" height="198" rx="15" fill="#FFF0D7" stroke="#78A7AC"/>
<text x="52" y="1115" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">失败与结束的不同结果</text>
<text x="52" y="1159" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">summary失败 → 尝试写error end</text>
<text x="52" y="1201" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">replace失败 → summary可能已留下</text>
<text x="52" y="1243" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">end失败 → 不重试闭合，保留活动锁</text>
<rect x="32" y="1300" width="576" height="198" rx="15" fill="#FCE5E3" stroke="#78A7AC"/>
<text x="52" y="1343" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">检查点由调用路径决定</text>
<text x="52" y="1387" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">手动：闭合尝试后等待Session flush</text>
<text x="52" y="1429" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">自动区域：本函数不执行flush</text>
<text x="52" y="1471" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">没有真实后端就不能宣称已落盘</text>
<text x="32" y="1570" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">固定 f3803c9 · 图中边界以正文为准</text>
</svg>