<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1400" viewBox="0 0 640 1400" role="img" aria-labelledby="title desc"><title id="title">Context、Service 与 Plugin</title><desc id="desc">编译期声明与运行时分开。提供方登记实例，消费者声明依赖后经上下文调用。实线是注册或调用，虚线是依赖条件。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="1400" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">Context、Service 与 Plugin</text><text x="320" y="105" font-size="28" font-weight="400" text-anchor="middle">三个动作：声明、提供、调用</text><rect x="36" y="145" width="568" height="180" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320.0" y="188" font-size="32" font-weight="700" text-anchor="middle">编译期：声明合并</text><text x="320.0" y="230" font-size="28" font-weight="400" text-anchor="middle">Context 增加 greeter 的类型</text><text x="320.0" y="268" font-size="28" font-weight="400" text-anchor="middle">只供检查与补全，不创建服务</text><text x="320" y="375" font-size="28" font-weight="700" text-anchor="middle">以下才是本次运行的接线</text><rect x="36" y="420" width="568" height="170" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="463" font-size="32" font-weight="700" text-anchor="middle">提供方插件</text><text x="320.0" y="505" font-size="28" font-weight="400" text-anchor="middle">挂载 GreeterService 类</text><text x="320.0" y="543" font-size="28" font-weight="400" text-anchor="middle">构造器 super(ctx, &#x27;greeter&#x27;)</text><polyline points="320,590 320,661" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><text x="474" y="635" font-size="28" font-weight="400" text-anchor="middle">注册实例</text><rect x="36" y="680" width="568" height="180" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="723" font-size="32" font-weight="700" text-anchor="middle">Context 的服务入口</text><text x="320.0" y="765" font-size="28" font-weight="400" text-anchor="middle">greeter → 已提供的能力</text><text x="320.0" y="803" font-size="28" font-weight="400" text-anchor="middle">服务可用后，依赖者才可启动</text><rect x="36" y="1030" width="568" height="180" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1073" font-size="32" font-weight="700" text-anchor="middle">消费者插件</text><text x="320.0" y="1115" font-size="28" font-weight="400" text-anchor="middle">inject = [&#x27;greeter&#x27;]：声明需要</text><text x="320.0" y="1153" font-size="28" font-weight="400" text-anchor="middle">apply 内通过 ctx.greeter 调用</text><polyline points="320,1030 320,872" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><text x="466" y="957" font-size="28" font-weight="400" text-anchor="middle">调用 greet</text><polyline points="604,1115 624,1115 624,770 604,770" fill="none" stroke="#187A91" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="320" y="1270" font-size="28" font-weight="400" text-anchor="middle">实线 = 注册或调用；虚线 = 依赖条件</text><text x="320" y="1312" font-size="28" font-weight="400" text-anchor="middle">类型信息没有通往注册的箭头</text><text x="320" y="1354" font-size="28" font-weight="400" text-anchor="middle">教学简图；省略回收与作用域解析</text></svg>