<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1450" viewBox="0 0 640 1450" role="img" aria-labelledby="title desc"><title id="title">换能力，修改应该落在哪里？</title><desc id="desc">左右对比：紧耦合类内含五项能力；插件化消费者通过约定依赖不同提供方。仅表达职责与能力依赖，不是完整官方架构。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="1450" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">换能力，修改应该落在哪里？</text><text x="320" y="105" font-size="28" font-weight="400" text-anchor="middle">同一项目助手，两种组织方式</text><text x="164" y="160" font-size="32" font-weight="700" text-anchor="middle">紧耦合</text><text x="476" y="160" font-size="32" font-weight="700" text-anchor="middle">按服务连接</text><rect x="24" y="185" width="280" height="930" rx="22" fill="white" stroke="#187A91" stroke-width="3"/><text x="164" y="238" font-size="30" font-weight="700" text-anchor="middle">AgentRuntime</text><text x="164" y="281" font-size="28" font-weight="400" text-anchor="middle">业务选择实现</text><rect x="338" y="185" width="278" height="135" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="477.0" y="228" font-size="32" font-weight="700" text-anchor="middle">业务消费者</text><text x="477.0" y="270" font-size="28" font-weight="400" text-anchor="middle">按约定使用能力</text><text x="476" y="375" font-size="28" font-weight="700" text-anchor="middle">服务约定与提供方</text><rect x="40" y="405" width="248" height="115" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="164.0" y="448" font-size="30" font-weight="700" text-anchor="middle">模型调用</text><text x="164.0" y="490" font-size="28" font-weight="400" text-anchor="middle">实现写在类内</text><rect x="378" y="405" width="238" height="115" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="497.0" y="448" font-size="30" font-weight="700" text-anchor="middle">模型插件</text><text x="497.0" y="490" font-size="28" font-weight="400" text-anchor="middle">可选择实现</text><polyline points="352,320 352,461 378,461" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="543" width="248" height="115" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="164.0" y="586" font-size="30" font-weight="700" text-anchor="middle">文件操作</text><text x="164.0" y="628" font-size="28" font-weight="400" text-anchor="middle">实现写在类内</text><rect x="378" y="543" width="238" height="115" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="497.0" y="586" font-size="30" font-weight="700" text-anchor="middle">文件插件</text><text x="497.0" y="628" font-size="28" font-weight="400" text-anchor="middle">可选择实现</text><polyline points="352,320 352,599 378,599" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="681" width="248" height="115" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="164.0" y="724" font-size="30" font-weight="700" text-anchor="middle">工具登记</text><text x="164.0" y="766" font-size="28" font-weight="400" text-anchor="middle">实现写在类内</text><rect x="378" y="681" width="238" height="115" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="497.0" y="724" font-size="30" font-weight="700" text-anchor="middle">工具插件</text><text x="497.0" y="766" font-size="28" font-weight="400" text-anchor="middle">可选择实现</text><polyline points="352,320 352,737 378,737" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="819" width="248" height="115" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="164.0" y="862" font-size="30" font-weight="700" text-anchor="middle">会话记录</text><text x="164.0" y="904" font-size="28" font-weight="400" text-anchor="middle">实现写在类内</text><rect x="378" y="819" width="238" height="115" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="497.0" y="862" font-size="30" font-weight="700" text-anchor="middle">会话插件</text><text x="497.0" y="904" font-size="28" font-weight="400" text-anchor="middle">可选择实现</text><polyline points="352,320 352,875 378,875" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="957" width="248" height="115" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="164.0" y="1000" font-size="30" font-weight="700" text-anchor="middle">日志记录</text><text x="164.0" y="1042" font-size="28" font-weight="400" text-anchor="middle">实现写在类内</text><rect x="378" y="957" width="238" height="115" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="497.0" y="1000" font-size="30" font-weight="700" text-anchor="middle">日志插件</text><text x="497.0" y="1042" font-size="28" font-weight="400" text-anchor="middle">可选择实现</text><polyline points="352,320 352,1013 378,1013" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="1155" width="592" height="160" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1198" font-size="32" font-weight="700" text-anchor="middle">变化的影响范围</text><text x="320.0" y="1240" font-size="28" font-weight="400" text-anchor="middle">左：能力变更需进入同一类</text><text x="320.0" y="1278" font-size="28" font-weight="400" text-anchor="middle">右：接口兼容时，优先改装配与提供方</text><text x="320" y="1365" font-size="28" font-weight="400" text-anchor="middle">包含框 = 代码职责；线 = 能力依赖</text><text x="320" y="1407" font-size="28" font-weight="400" text-anchor="middle">插件化仍需兼容测试，也增加组合成本</text></svg>