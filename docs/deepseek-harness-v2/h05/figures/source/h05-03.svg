<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1700" viewBox="0 0 640 1700" role="img" aria-labelledby="title desc"><title id="title">最小插件：从定义到调用</title><desc id="desc">以消费者先挂载为例：模块定义、挂载、依赖缺失时PENDING，提供方完成且服务可用后，消费者才执行入口并调用。一直缺失就不继续。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="1700" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">最小插件：从定义到调用</text><text x="320" y="105" font-size="28" font-weight="400" text-anchor="middle">本例：先挂消费者，再挂提供方</text><rect x="36" y="145" width="568" height="180" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="188" font-size="32" font-weight="700" text-anchor="middle">① 定义模块</text><text x="320.0" y="230" font-size="28" font-weight="400" text-anchor="middle">类型声明与类定义先准备好</text><text x="320.0" y="268" font-size="28" font-weight="400" text-anchor="middle">导入模块不自动挂载服务</text><polyline points="320,325 320,370" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="380" width="568" height="180" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="423" font-size="32" font-weight="700" text-anchor="middle">② 挂载消费者</text><text x="320.0" y="465" font-size="28" font-weight="400" text-anchor="middle">ctx.plugin(consumer)</text><text x="320.0" y="503" font-size="28" font-weight="400" text-anchor="middle">宿主读取 inject 与 apply</text><polyline points="320,560 320,605" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="615" width="568" height="180" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320.0" y="658" font-size="32" font-weight="700" text-anchor="middle">③ 缺少 greeter：PENDING</text><text x="320.0" y="700" font-size="28" font-weight="400" text-anchor="middle">消费者入口不执行，调用为 0</text><text x="320.0" y="738" font-size="28" font-weight="400" text-anchor="middle">若一直没有提供方，就停在这里</text><polyline points="320,795 320,840" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="850" width="568" height="180" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="893" font-size="32" font-weight="700" text-anchor="middle">④ 挂载提供方</text><text x="320.0" y="935" font-size="28" font-weight="400" text-anchor="middle">apply 再挂载服务类</text><text x="320.0" y="973" font-size="28" font-weight="400" text-anchor="middle">构造器登记 greeter 实例</text><polyline points="320,1030 320,1075" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="1085" width="568" height="180" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1128" font-size="32" font-weight="700" text-anchor="middle">⑤ 提供方完成，服务可用</text><text x="320.0" y="1170" font-size="28" font-weight="400" text-anchor="middle">重新检查所需服务</text><text x="320.0" y="1208" font-size="28" font-weight="400" text-anchor="middle">本例依赖全部满足</text><polyline points="320,1265 320,1310" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="1320" width="568" height="180" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1363" font-size="32" font-weight="700" text-anchor="middle">⑥ 消费者执行 apply</text><text x="320.0" y="1405" font-size="28" font-weight="400" text-anchor="middle">ctx.greeter.greet(&#x27;world&#x27;)</text><text x="320.0" y="1443" font-size="28" font-weight="400" text-anchor="middle">输出 Hello, world!</text><text x="320" y="1570" font-size="28" font-weight="400" text-anchor="middle">纵线 = 本例选定顺序，并非必须先等待</text><text x="320" y="1612" font-size="28" font-weight="400" text-anchor="middle">先挂提供方也可；依赖决定启动条件</text><text x="320" y="1654" font-size="28" font-weight="400" text-anchor="middle">教学精选流程，未展开 Loader 与卸载</text></svg>