<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1538" viewBox="0 0 640 1538" role="img"><title>缺少工具结果，能不能再执行？</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#187A91" stroke-width="2"/></marker></defs><rect width="640" height="1538" fill="#F3F9F8"/>
<text x="32" y="57" font-size="32" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">缺少工具结果，能不能再执行？</text>
<rect x="32" y="100" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/>
<text x="52" y="143" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">综合X：真实工具提议 Seq11</text>
<text x="52" y="187" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">提出 write-fixture 与 read-fixture</text>
<text x="52" y="229" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Seq12 仅记录第一项 tool/call</text>
<text x="52" y="271" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">内存假副作用已发生：计数1</text>
<rect x="32" y="328" width="576" height="198" rx="15" fill="#FFF0D7" stroke="#78A7AC"/>
<text x="52" y="371" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">保存精确开放前缀到新副本</text>
<text x="52" y="415" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">原任务随后取消并正常排空</text>
<text x="52" y="457" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">副本不含任何后续 tool/result</text>
<text x="52" y="499" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">这是逻辑中断夹具，不是真杀进程</text>
<rect x="32" y="556" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/>
<text x="52" y="599" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">真实 Resume 的保守闭合</text>
<text x="52" y="643" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Seq13：TOOL_OUTCOME_UNKNOWN</text>
<text x="52" y="685" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Seq14：TOOL_NOT_STARTED</text>
<text x="52" y="727" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">Seq15 step/end；Seq16 interrupted</text>
<rect x="32" y="784" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/>
<text x="52" y="827" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">两种事实不能合并</text>
<text x="52" y="871" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">UNKNOWN：有开始，最终结果没记录</text>
<text x="52" y="913" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">NOT_STARTED：日志没证明已开始</text>
<text x="52" y="955" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">不是外部世界从未发生的保证</text>
<rect x="32" y="1012" width="576" height="198" rx="15" fill="#FCE5E3" stroke="#78A7AC"/>
<text x="52" y="1055" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">先检查外部状态与操作语义</text>
<text x="52" y="1099" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">只读：仍需要时可考虑重读</text>
<text x="52" y="1141" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">幂等：核业务键与已有结果</text>
<text x="52" y="1183" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">非幂等未知：核对、确认或停止</text>
<rect x="32" y="1240" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/>
<text x="52" y="1283" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">事实可重建，不等于动作重放</text>
<text x="52" y="1327" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">恢复旧模型0次、旧工具0次</text>
<text x="52" y="1369" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">假外部计数仍为1，不自动重写</text>
<text x="52" y="1411" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">后续请求读配对完整的当前历史</text>
<text x="32" y="1510" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">固定 f3803c9 · 图中边界以正文为准</text>
