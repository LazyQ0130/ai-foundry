<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1598" viewBox="0 0 640 1598" role="img"><title>取消信号发出后，还欠哪些工作？</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#187A91" stroke-width="2"/></marker></defs><rect width="640" height="1598" fill="#F3F9F8"/>
<text x="32" y="57" font-size="32" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">取消信号发出后，还欠哪些工作？</text>
<rect x="32" y="100" width="576" height="198" rx="15" fill="#FCE5E3" stroke="#78A7AC"/>
<text x="52" y="143" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">agent.cancel：协作式请求</text>
<text x="52" y="187" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">当前活动 AbortController 中止</text>
<text x="52" y="229" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">默认清 Inbox；keepInbox 可保留</text>
<text x="52" y="271" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">不会强杀任意 Promise 或进程</text>
<rect x="32" y="328" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/>
<text x="52" y="371" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">模型流：安全前缀与 Attempt</text>
<text x="52" y="415" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">中断可保留非空 text / reasoning</text>
<text x="52" y="457" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">工具调用块不作为可执行前缀</text>
<text x="52" y="499" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">没有安全块则只记 assistant/attempt</text>
<rect x="32" y="556" width="576" height="198" rx="15" fill="#FFF0D7" stroke="#78A7AC"/>
<text x="52" y="599" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">退避与恢复委派</text>
<text x="52" y="643" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">本插件计时器可取消并移除</text>
<text x="52" y="685" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">已进入下游仍须等待其结算</text>
<text x="52" y="727" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">不合作的下游可能阻止完全停稳</text>
<rect x="32" y="784" width="576" height="198" rx="15" fill="#D9F4E9" stroke="#78A7AC"/>
<text x="52" y="827" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">工具批次：停止补位，排空已启动</text>
<text x="52" y="871" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">未派发 → ABORTED_BEFORE_DISPATCH</text>
<text x="52" y="913" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">主体已开始 → 等待，再选结果</text>
<text x="52" y="955" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">已提交结果不删除；按模型序写入</text>
<path d="M320 991 V1047" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/>
<text x="350" y="1026" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">收尾</text>
<rect x="32" y="1072" width="576" height="198" rx="15" fill="#DDEDF5" stroke="#78A7AC"/>
<text x="52" y="1115" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">关闭当前控制边界</text>
<text x="52" y="1159" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">必要的保守工具结果 → step/end</text>
<text x="52" y="1201" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">turn/end aborted 记录取消原因</text>
<text x="52" y="1243" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">whenIdle 等待整个活动完全停稳</text>
<rect x="32" y="1300" width="576" height="198" rx="15" fill="#FFF0D7" stroke="#78A7AC"/>
<text x="52" y="1343" font-size="30" font-weight="700" fill="#15394B" font-family="Microsoft YaHei">Handle.dispose 还承担生命周期</text>
<text x="52" y="1387" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">disposed cause cancel → 等停稳</text>
<text x="52" y="1429" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">退出作用域、关闭 writer、撤登记</text>
<text x="52" y="1471" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">cancel 本身不销毁整个 Agent</text>
<text x="32" y="1570" font-size="28" font-weight="400" fill="#15394B" font-family="Microsoft YaHei">固定 f3803c9 · 图中边界以正文为准</text>
</svg>