<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1430" viewBox="0 0 640 1430" role="img" aria-labelledby="title desc"><title id="title">Patch 替换的是整个 config</title><desc id="desc">三个阶段展示retry、temperature因完整config替换消失；深合并结果标为错误预测。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="1430" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">Patch 替换的是整个 config</text><rect x="28" y="130" width="584" height="225" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="174" font-size="32" font-weight="700" text-anchor="middle">core 插入原始 config</text><text x="320" y="218" font-size="28" font-weight="400" text-anchor="middle">model: base</text><text x="320" y="256" font-size="28" font-weight="400" text-anchor="middle">temperature: 0.2</text><text x="320" y="294" font-size="28" font-weight="400" text-anchor="middle">retry: { attempts: 2 }</text><path d="M320 360 V405" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="450" font-size="28" font-weight="400" text-anchor="middle">surface：整 config 替换</text><rect x="28" y="485" width="584" height="225" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320" y="529" font-size="32" font-weight="700" text-anchor="middle">此刻 config</text><text x="320" y="573" font-size="28" font-weight="400" text-anchor="middle">model: surface</text><text x="320" y="611" font-size="28" font-weight="400" text-anchor="middle">temperature: 0.4</text><text x="320" y="649" font-size="28" font-weight="400" text-anchor="middle">retry 已消失</text><path d="M320 715 V760" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="805" font-size="28" font-weight="400" text-anchor="middle">CLI：再次整份替换</text><rect x="28" y="840" width="584" height="185" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320" y="884" font-size="32" font-weight="700" text-anchor="middle">最终 config</text><text x="320" y="928" font-size="28" font-weight="400" text-anchor="middle">model: cli</text><text x="320" y="966" font-size="28" font-weight="400" text-anchor="middle">temperature 也已消失</text><rect x="28" y="1085" width="584" height="185" rx="18" fill="#FCE5E3" stroke="#187A91" stroke-width="2"/><text x="320" y="1129" font-size="32" font-weight="700" text-anchor="middle">错误预测：深度合并</text><text x="320" y="1173" font-size="28" font-weight="400" text-anchor="middle">model: cli，仍保留 temperature</text><text x="320" y="1211" font-size="28" font-weight="400" text-anchor="middle">仍保留 retry —— 不符合本版本</text><text x="320" y="1330" font-size="28" font-weight="400" text-anchor="middle">条目外层 id、name 保留</text><text x="320" y="1375" font-size="28" font-weight="400" text-anchor="middle">Schema 默认值属于后续加载规则</text></svg>