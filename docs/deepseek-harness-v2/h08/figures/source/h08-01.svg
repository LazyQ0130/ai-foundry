<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1500" viewBox="0 0 640 1500" role="img" aria-labelledby="title desc"><title id="title">Profile 怎样复用不同组合</title><desc id="desc">四种Profile以base为共享第一层，sdk-minimal独立配置；Bundle贡献配置而非一个运行Fiber。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="1500" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">Profile 怎样复用不同组合</text><text x="320" y="108" font-size="28" font-weight="400" text-anchor="middle">模板选择顺序：左项先，右项后</text><rect x="28" y="150" width="584" height="125" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320" y="194" font-size="32" font-weight="700" text-anchor="middle">web</text><text x="320" y="238" font-size="28" font-weight="400" text-anchor="middle">base → web-app</text><rect x="28" y="305" width="584" height="125" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320" y="349" font-size="32" font-weight="700" text-anchor="middle">headless</text><text x="320" y="393" font-size="28" font-weight="400" text-anchor="middle">base → headless</text><rect x="28" y="460" width="584" height="125" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320" y="504" font-size="32" font-weight="700" text-anchor="middle">sdk</text><text x="320" y="548" font-size="28" font-weight="400" text-anchor="middle">base → sdk-app</text><rect x="28" y="615" width="584" height="125" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320" y="659" font-size="32" font-weight="700" text-anchor="middle">acp</text><text x="320" y="703" font-size="28" font-weight="400" text-anchor="middle">base → acp-app</text><rect x="28" y="800" width="584" height="175" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320" y="844" font-size="32" font-weight="700" text-anchor="middle">sdk-minimal：独立完整树</text><text x="320" y="888" font-size="28" font-weight="400" text-anchor="middle">只有 sdk-minimal Bundle</text><text x="320" y="926" font-size="28" font-weight="400" text-anchor="middle">不叠加 dsh-base</text><rect x="28" y="1030" width="584" height="175" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="1074" font-size="32" font-weight="700" text-anchor="middle">Bundle → Patch → 配置条目</text><text x="320" y="1118" font-size="28" font-weight="400" text-anchor="middle">一份 Bundle 可有多个 Patch 文件</text><text x="320" y="1156" font-size="28" font-weight="400" text-anchor="middle">每份清单可贡献多个 Plugin 条目</text><path d="M320 1210 V1250" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="1270" width="584" height="175" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320" y="1314" font-size="32" font-weight="700" text-anchor="middle">Loader → Plugin 的运行</text><text x="320" y="1358" font-size="28" font-weight="400" text-anchor="middle">配置贡献关系，不是进程边界</text><text x="320" y="1396" font-size="28" font-weight="400" text-anchor="middle">条目存在仍须检查实际激活</text></svg>