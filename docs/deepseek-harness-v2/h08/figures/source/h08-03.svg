<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1690" viewBox="0 0 640 1690" role="img" aria-labelledby="title desc"><title id="title">从输入文件到运行证据</title><desc id="desc">按四层形成配置，再追加遥测硬禁用特例；Include/Loader加载后才有运行状态证据。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="1690" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">从输入文件到运行证据</text><text x="320" y="108" font-size="28" font-weight="400" text-anchor="middle">空根条目列表开始</text><rect x="28" y="155" width="584" height="130" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="199" font-size="32" font-weight="700" text-anchor="middle">① 有序 Bundle Patch</text><text x="320" y="243" font-size="28" font-weight="400" text-anchor="middle">先 Bundle 顺序，再各自文件顺序</text><path d="M320 290 V322" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="330" width="584" height="130" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="374" font-size="32" font-weight="700" text-anchor="middle">② Profile 的 Patch</text><text x="320" y="418" font-size="28" font-weight="400" text-anchor="middle">当前 Profile 用户覆盖</text><path d="M320 465 V497" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="505" width="584" height="130" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="549" font-size="32" font-weight="700" text-anchor="middle">③ Home 的 Patch</text><text x="320" y="593" font-size="28" font-weight="400" text-anchor="middle">共享 Home 用户覆盖</text><path d="M320 640 V672" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="680" width="584" height="130" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="724" font-size="32" font-weight="700" text-anchor="middle">④ CLI 的 --patch</text><text x="320" y="768" font-size="28" font-weight="400" text-anchor="middle">使用启动时已解析的覆盖列表</text><path d="M320 815 V847" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="875" width="584" height="130" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320" y="919" font-size="32" font-weight="700" text-anchor="middle">特例：遥测硬禁用最后追加</text><text x="320" y="963" font-size="28" font-weight="400" text-anchor="middle">启动开关非空且树有对应条目</text><path d="M320 1010 V1050" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="1075" width="584" height="130" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320" y="1119" font-size="32" font-weight="700" text-anchor="middle">组合后的最终配置树</text><text x="320" y="1163" font-size="28" font-weight="400" text-anchor="middle">仍可能带未求值表达式</text><path d="M320 1210 V1250" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="1275" width="584" height="130" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="1319" font-size="32" font-weight="700" text-anchor="middle">Include / Loader 加载</text><text x="320" y="1363" font-size="28" font-weight="400" text-anchor="middle">导入模块、检查依赖、配置与初始化</text><rect x="28" y="1460" width="584" height="175" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320" y="1504" font-size="32" font-weight="700" text-anchor="middle">运行状态需要另外核对</text><text x="320" y="1548" font-size="28" font-weight="400" text-anchor="middle">ACTIVE / PENDING / FAILED</text><text x="320" y="1586" font-size="28" font-weight="400" text-anchor="middle">禁用条目可以保留而不激活</text></svg>