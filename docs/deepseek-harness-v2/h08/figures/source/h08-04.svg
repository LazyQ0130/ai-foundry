<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1520" viewBox="0 0 640 1520" role="img" aria-labelledby="title desc"><title id="title">变化、清理与重载的边界</title><desc id="desc">配置重组与模块替换是不同路径；解析前失败和应用后失败结果不同，重启再次走完整启动。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="1520" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">变化、清理与重载的边界</text><rect x="28" y="130" width="584" height="175" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="174" font-size="32" font-weight="700" text-anchor="middle">配置文件变化 → 重新组合</text><text x="320" y="218" font-size="28" font-weight="400" text-anchor="middle">Profile / Home / manifest</text><text x="320" y="256" font-size="28" font-weight="400" text-anchor="middle">有 HMR 才会自动协调</text><path d="M320 310 V350" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="375" width="584" height="225" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320" y="419" font-size="32" font-weight="700" text-anchor="middle">Entry 更新 → 生命周期处理</text><text x="320" y="463" font-size="28" font-weight="400" text-anchor="middle">普通 config：同一 Fiber 可重跑</text><text x="320" y="501" font-size="28" font-weight="400" text-anchor="middle">禁用后启用：新建 Fiber</text><text x="320" y="539" font-size="28" font-weight="400" text-anchor="middle">旧资源按所有权清理</text><rect x="28" y="660" width="584" height="175" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="704" font-size="32" font-weight="700" text-anchor="middle">源码模块变化 → 独立替换路径</text><text x="320" y="748" font-size="28" font-weight="400" text-anchor="middle">预导入 → 卸载 → 激活替代代码</text><text x="320" y="786" font-size="28" font-weight="400" text-anchor="middle">失败会尝试恢复，恢复也会失败</text><rect x="28" y="895" width="584" height="225" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320" y="939" font-size="32" font-weight="700" text-anchor="middle">失败必须按阶段看</text><text x="320" y="983" font-size="28" font-weight="400" text-anchor="middle">解析失败：可保留上次树</text><text x="320" y="1021" font-size="28" font-weight="400" text-anchor="middle">应用后失败：新 config 可能保留</text><text x="320" y="1059" font-size="28" font-weight="400" text-anchor="middle">FAILED 不保证旧服务恢复</text><rect x="28" y="1180" width="584" height="175" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="1224" font-size="32" font-weight="700" text-anchor="middle">完整进程重启</text><text x="320" y="1268" font-size="28" font-weight="400" text-anchor="middle">重新处理启动环境、参数与应用</text><text x="320" y="1306" font-size="28" font-weight="400" text-anchor="middle">无 HMR / 映射变化时可能需要</text><text x="320" y="1420" font-size="28" font-weight="400" text-anchor="middle">重新加载不自动迁移业务状态</text><text x="320" y="1465" font-size="28" font-weight="400" text-anchor="middle">清理资源不等于回滚外部副作用</text></svg>