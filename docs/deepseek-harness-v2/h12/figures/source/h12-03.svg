<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1642" viewBox="0 0 640 1642" role="img" aria-labelledby="title desc"><title id="title">实时帧，到匹配的Session事实</title><desc id="desc">真实AssistantStreamAttempt先快照后组装和实时发布，Loop提交匹配事件成功后才发committed end，失败发abandoned。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="1642" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">实时帧，到匹配的Session事实</text><text x="320" y="108" font-size="28" font-weight="400" text-anchor="middle">向下是本课已验证的接纳顺序</text><rect x="28" y="150" width="584" height="174" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="194" font-size="32" font-weight="700" text-anchor="middle">外层流句柄取得 → start</text><text x="320" y="241" font-size="28" font-weight="400" text-anchor="middle">取消检查通过才发布start</text><text x="320" y="283" font-size="28" font-weight="400" text-anchor="middle">尚无chunk也可以已有start</text><path d="M320 328 V370" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/><rect x="28" y="384" width="584" height="216" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320" y="428" font-size="32" font-weight="700" text-anchor="middle">每片：Accumulator先快照</text><text x="320" y="475" font-size="28" font-weight="400" text-anchor="middle">保存原分片边界与时间</text><text x="320" y="517" font-size="28" font-weight="400" text-anchor="middle">同份快照 → BlockAssembler</text><text x="320" y="559" font-size="28" font-weight="400" text-anchor="middle">再发本地chunk帧给实时消费者</text><path d="M320 604 V646" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/><rect x="28" y="660" width="584" height="216" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320" y="704" font-size="32" font-weight="700" text-anchor="middle">Loop决定结算类型</text><text x="320" y="751" font-size="28" font-weight="400" text-anchor="middle">正常结果 / 取消安全前缀 → message</text><text x="320" y="793" font-size="28" font-weight="400" text-anchor="middle">失败或无安全前缀 → attempt</text><text x="320" y="835" font-size="28" font-weight="400" text-anchor="middle">实时看见不证明这里已经完成</text><path d="M320 880 V922" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/><rect x="28" y="936" width="584" height="216" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="980" font-size="32" font-weight="700" text-anchor="middle">尝试Session append</text><text x="320" y="1027" font-size="28" font-weight="400" text-anchor="middle">成功：取得已接纳事件seq</text><text x="320" y="1069" font-size="28" font-weight="400" text-anchor="middle">失败：无匹配成功事实，重抛错误</text><text x="320" y="1111" font-size="28" font-weight="400" text-anchor="middle">此处不是磁盘flush证明</text><path d="M320 1156 V1198" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/><rect x="28" y="1212" width="584" height="216" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320" y="1256" font-size="32" font-weight="700" text-anchor="middle">发布end：两个互斥结果</text><text x="320" y="1303" font-size="28" font-weight="400" text-anchor="middle">成功 → committed + eventType + seq</text><text x="320" y="1345" font-size="28" font-weight="400" text-anchor="middle">拒绝 → abandoned</text><text x="320" y="1387" font-size="28" font-weight="400" text-anchor="middle">工具只在成功内容结算后衔接</text><text x="320" y="1488" font-size="28" font-weight="400" text-anchor="middle">Assembler给内容，Accumulator记流</text><text x="320" y="1530" font-size="28" font-weight="400" text-anchor="middle">紧凑流嵌入结算，不逐片写Session</text><text x="320" y="1572" font-size="28" font-weight="400" text-anchor="middle">完整持久化与恢复留H17–H18</text></svg>