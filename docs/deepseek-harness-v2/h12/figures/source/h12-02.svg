<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1408" viewBox="0 0 640 1408" role="img" aria-labelledby="title desc"><title id="title">交错分片，各回各的块</title><desc id="desc">A的真实输入按7、2、4首次出现组装，工具参数分两段，block-end给权威整块；不同index可交错，图中只显示改变的状态。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="1408" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">交错分片，各回各的块</text><text x="320" y="108" font-size="28" font-weight="400" text-anchor="middle">index关联块；顺序采用首次出现</text><rect x="28" y="150" width="584" height="216" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="194" font-size="32" font-weight="700" text-anchor="middle">① 文本7 → 推理2</text><text x="320" y="241" font-size="28" font-weight="400" text-anchor="middle">text(7)：先读</text><text x="320" y="283" font-size="28" font-weight="400" text-anchor="middle">reasoning(2)：检查资料</text><text x="320" y="325" font-size="28" font-weight="400" text-anchor="middle">已见顺序：7、2</text><path d="M320 370 V412" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/><rect x="28" y="426" width="584" height="216" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320" y="470" font-size="32" font-weight="700" text-anchor="middle">② 工具4开始，文本7继续</text><text x="320" y="517" font-size="28" font-weight="400" text-anchor="middle">call id=read-1；name=read_fixture</text><text x="320" y="559" font-size="28" font-weight="400" text-anchor="middle">args(4)：{&quot;path&quot;:</text><text x="320" y="601" font-size="28" font-weight="400" text-anchor="middle">text(7)：先读README</text><path d="M320 646 V688" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/><rect x="28" y="702" width="584" height="216" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320" y="746" font-size="32" font-weight="700" text-anchor="middle">③ 工具4参数继续 → block-end</text><text x="320" y="793" font-size="28" font-weight="400" text-anchor="middle">追加：&quot;README.md&quot;}</text><text x="320" y="835" font-size="28" font-weight="400" text-anchor="middle">完整块成为权威结果</text><text x="320" y="877" font-size="28" font-weight="400" text-anchor="middle">已关闭块忽略迟到delta/再关闭</text><path d="M320 922 V964" stroke="#187A91" stroke-width="3" marker-end="url(#a)"/><rect x="28" y="978" width="584" height="216" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="1022" font-size="32" font-weight="700" text-anchor="middle">④ usage → finish(tool-calls)</text><text x="320" y="1069" font-size="28" font-weight="400" text-anchor="middle">块顺序7、2、4，不按数值排序</text><text x="320" y="1111" font-size="28" font-weight="400" text-anchor="middle">text / reasoning / tool-call分开</text><text x="320" y="1153" font-size="28" font-weight="400" text-anchor="middle">组装完成仍不等于工具已执行</text><text x="320" y="1254" font-size="28" font-weight="400" text-anchor="middle">另一路max-tokens：去掉全部工具</text><text x="320" y="1296" font-size="28" font-weight="400" text-anchor="middle">已关闭合法工具也不例外</text><text x="320" y="1338" font-size="28" font-weight="400" text-anchor="middle">live帧index另指交付序号</text></svg>