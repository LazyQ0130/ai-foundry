<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1684" viewBox="0 0 640 1684" role="img" aria-labelledby="title desc"><title id="title">同样结束，记录可以不同</title><desc id="desc">对照正常、失败、本地取消、max-tokens与写入拒绝，区分持久结果类型和临时end；未描画完整恢复策略。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="1684" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">同样结束，记录可以不同</text><text x="320" y="108" font-size="28" font-weight="400" text-anchor="middle">各卡独立；默认没有恢复监听器</text><rect x="28" y="150" width="584" height="216" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320" y="194" font-size="32" font-weight="700" text-anchor="middle">正常stop / tool-calls</text><text x="320" y="241" font-size="28" font-weight="400" text-anchor="middle">assistant/message → committed</text><text x="320" y="283" font-size="28" font-weight="400" text-anchor="middle">读取结构化调用后才可能执行工具</text><text x="320" y="325" font-size="28" font-weight="400" text-anchor="middle">无工具时成为completed候选</text><rect x="28" y="426" width="584" height="216" rx="18" fill="#FCE5E3" stroke="#187A91" stroke-width="2"/><text x="320" y="470" font-size="32" font-weight="700" text-anchor="middle">error / 仅提供方aborted</text><text x="320" y="517" font-size="28" font-weight="400" text-anchor="middle">本地signal未取消的失败终态</text><text x="320" y="559" font-size="28" font-weight="400" text-anchor="middle">assistant/attempt → committed</text><text x="320" y="601" font-size="28" font-weight="400" text-anchor="middle">草稿不入正常Assistant历史</text><rect x="28" y="702" width="584" height="216" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320" y="746" font-size="32" font-weight="700" text-anchor="middle">本地signal取消</text><text x="320" y="793" font-size="28" font-weight="400" text-anchor="middle">有非空白text/reasoning：</text><text x="320" y="835" font-size="28" font-weight="400" text-anchor="middle">interrupted message → committed</text><text x="320" y="877" font-size="28" font-weight="400" text-anchor="middle">无安全前缀：attempt → committed</text><rect x="28" y="978" width="584" height="216" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="1022" font-size="32" font-weight="700" text-anchor="middle">max-tokens</text><text x="320" y="1069" font-size="28" font-weight="400" text-anchor="middle">Assembler去掉全部tool-call</text><text x="320" y="1111" font-size="28" font-weight="400" text-anchor="middle">其余内容message → committed</text><text x="320" y="1153" font-size="28" font-weight="400" text-anchor="middle">不执行工具；max-tokens停止候选</text><rect x="28" y="1254" width="584" height="216" rx="18" fill="#FCE5E3" stroke="#187A91" stroke-width="2"/><text x="320" y="1298" font-size="32" font-weight="700" text-anchor="middle">结算拒绝 / 最终组装失败</text><text x="320" y="1345" font-size="28" font-weight="400" text-anchor="middle">无成功的匹配Assistant事实</text><text x="320" y="1387" font-size="28" font-weight="400" text-anchor="middle">实时end → abandoned</text><text x="320" y="1429" font-size="28" font-weight="400" text-anchor="middle">已有chunk不证明提交成功</text><text x="320" y="1530" font-size="28" font-weight="400" text-anchor="middle">明确retry决策才开启下次Attempt</text><text x="320" y="1572" font-size="28" font-weight="400" text-anchor="middle">同Step重试不重复接纳用户</text><text x="320" y="1614" font-size="28" font-weight="400" text-anchor="middle">所有committed只指Session接纳</text></svg>