<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1642" viewBox="0 0 640 1642" role="img" aria-labelledby="title desc"><title id="title">统一入口，保留协议边界</title><desc id="desc">Runtime管理公共入口与注册，Adapter分别转换Messages或pi-ai事件；Provider路由与Model模型标识分开，目录不是统一白名单。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style><rect width="640" height="1642" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">统一入口，保留协议边界</text><text x="320" y="108" font-size="28" font-weight="400" text-anchor="middle">并列职责卡：关系不是执行时间轴</text><rect x="28" y="150" width="584" height="216" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="194" font-size="32" font-weight="700" text-anchor="middle">Loop → LlmRuntime</text><text x="320" y="241" font-size="28" font-weight="400" text-anchor="middle">H11形成messages与tools</text><text x="320" y="283" font-size="28" font-weight="400" text-anchor="middle">prepareCall绑定路由、能力与默认</text><text x="320" y="325" font-size="28" font-weight="400" text-anchor="middle">一次分发 → llm/stream Waterfall</text><rect x="28" y="426" width="584" height="216" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320" y="470" font-size="32" font-weight="700" text-anchor="middle">Provider 与 Model</text><text x="320" y="517" font-size="28" font-weight="400" text-anchor="middle">provider选择已登记的路由</text><text x="320" y="559" font-size="28" font-weight="400" text-anchor="middle">model是该路由下的模型标识</text><text x="320" y="601" font-size="28" font-weight="400" text-anchor="middle">目录展示不等于核心请求白名单</text><rect x="28" y="702" width="584" height="216" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320" y="746" font-size="32" font-weight="700" text-anchor="middle">DeepSeek Adapter</text><text x="320" y="793" font-size="28" font-weight="400" text-anchor="middle">请求 → Messages协议</text><text x="320" y="835" font-size="28" font-weight="400" text-anchor="middle">SSE帧 → 原生事件 → translate</text><text x="320" y="877" font-size="28" font-weight="400" text-anchor="middle">thinking/tool_use → 共同内容块</text><rect x="28" y="978" width="584" height="216" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320" y="1022" font-size="32" font-weight="700" text-anchor="middle">pi-ai Adapter</text><text x="320" y="1069" font-size="28" font-weight="400" text-anchor="middle">请求 → 库的模型上下文</text><text x="320" y="1111" font-size="28" font-weight="400" text-anchor="middle">text_delta/toolcall_end → 公共流</text><text x="320" y="1153" font-size="28" font-weight="400" text-anchor="middle">对象参数在完成块中再序列化</text><rect x="28" y="1254" width="584" height="216" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320" y="1298" font-size="32" font-weight="700" text-anchor="middle">共同出口：StreamChunk</text><text x="320" y="1345" font-size="28" font-weight="400" text-anchor="middle">按index关联文本、推理、工具</text><text x="320" y="1387" font-size="28" font-weight="400" text-anchor="middle">usage在finish前；终态后结束</text><text x="320" y="1429" font-size="28" font-weight="400" text-anchor="middle">Loop无需理解两家原生事件名</text><text x="320" y="1530" font-size="28" font-weight="400" text-anchor="middle">接口统一不保证模型能力相同</text><text x="320" y="1572" font-size="28" font-weight="400" text-anchor="middle">本课真实运行组件；未接外部API</text></svg>