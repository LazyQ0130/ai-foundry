<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1188" viewBox="0 0 640 1188" role="img" aria-labelledby="title desc">
<title id="title">DeepSeek Harness 核心怎样协作</title><desc id="desc">AgentRegistry 委托默认循环创建，循环与 SystemPrompt、LLM、Session、Tools 协作。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker><marker id="back" markerWidth="9" markerHeight="9" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M8,0 L0,4 L8,8" fill="#187A91"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style>
<rect width="640" height="1188" fill="#F3F9F8"/>
<text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">DeepSeek Harness 核心怎样协作</text>
<text x="320" y="98" font-size="28" font-weight="400" text-anchor="middle">默认实现的职责协作，不是完整时序</text><rect x="80" y="126" width="480" height="118" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="169" font-size="30" font-weight="700" text-anchor="middle">AgentRegistry</text><text x="320.0" y="211" font-size="28" font-weight="400" text-anchor="middle">通过登记的工厂委托创建</text><polyline points="320,244 320,304" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="304" width="480" height="132" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="347" font-size="30" font-weight="700" text-anchor="middle">默认 AgentLoop</text><text x="320.0" y="389" font-size="28" font-weight="400" text-anchor="middle">推进步骤，协调下面四项能力</text><polyline points="108,436 108,522" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#back)"/><polyline points="366,436 366,522" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#back)"/><text x="216" y="485" font-size="28" font-weight="400" text-anchor="middle">组装 / 返回</text><text x="492" y="485" font-size="28" font-weight="400" text-anchor="middle">请求 / 输出</text><polyline points="80,370 18,370 18,877 42,877" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#back)"/><polyline points="560,370 622,370 622,877 598,877" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#back)"/><rect x="42" y="522" width="260" height="178" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="172.0" y="565" font-size="30" font-weight="700" text-anchor="middle">SystemPrompt</text><text x="172.0" y="607" font-size="28" font-weight="400" text-anchor="middle">提示词片段</text><text x="172.0" y="645" font-size="28" font-weight="400" text-anchor="middle">与工具说明</text><rect x="338" y="522" width="260" height="178" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="468.0" y="565" font-size="30" font-weight="700" text-anchor="middle">LLM</text><text x="468.0" y="607" font-size="28" font-weight="400" text-anchor="middle">模型适配</text><text x="468.0" y="645" font-size="28" font-weight="400" text-anchor="middle">与响应流</text><rect x="42" y="790" width="260" height="178" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="172.0" y="833" font-size="30" font-weight="700" text-anchor="middle">Session</text><text x="172.0" y="875" font-size="28" font-weight="400" text-anchor="middle">追加运行事实</text><text x="172.0" y="913" font-size="28" font-weight="400" text-anchor="middle">派生模型历史</text><rect x="338" y="790" width="260" height="178" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="468.0" y="833" font-size="30" font-weight="700" text-anchor="middle">Tools</text><text x="468.0" y="875" font-size="28" font-weight="400" text-anchor="middle">登记与执行</text><text x="468.0" y="913" font-size="28" font-weight="400" text-anchor="middle">策略与守卫</text><text x="320" y="746" font-size="28" font-weight="400" text-anchor="middle">双向线：能力调用与数据返回</text><text x="320" y="1020" font-size="28" font-weight="700" text-anchor="middle">模型输出先回循环，再进入工具服务</text><text x="320" y="1064" font-size="28" font-weight="400" text-anchor="middle">Session 记录贯穿运行，不是最后一步</text><text x="320" y="1110" font-size="28" font-weight="400" text-anchor="middle">省略审批与存储提供方等扩展组件</text><text x="320" y="1155" font-size="28" font-weight="400" text-anchor="middle">依据：固定 Commit 的架构文档与源码</text>
</svg>