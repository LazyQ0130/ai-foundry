<svg xmlns="http://www.w3.org/2000/svg" width="640" height="994" viewBox="0 0 640 994" role="img" aria-labelledby="title desc">
<title id="title">建议如何变成一次受控行动</title><desc id="desc">LLM 提议经 Runtime 检查后才执行工具，反馈参与后续判断；Harness 提供组合与运行机制。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker><marker id="back" markerWidth="9" markerHeight="9" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M8,0 L0,4 L8,8" fill="#187A91"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style>
<rect width="640" height="994" fill="#F3F9F8"/>
<text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">建议如何变成一次受控行动</text>
<text x="320" y="99" font-size="28" font-weight="400" text-anchor="middle">同一个“读取说明 → 保存笔记”任务</text><rect x="24" y="130" width="592" height="836" rx="24" fill="white" stroke="#187A91" stroke-width="3"/><text x="320" y="179" font-size="32" font-weight="700" text-anchor="middle">Harness：组织运行环境</text><text x="320" y="221" font-size="28" font-weight="400" text-anchor="middle">模型接入 · 工具管理 · 运行记录</text><rect x="46" y="250" width="548" height="530" rx="20" fill="#F3F9F8" stroke="#187A91" stroke-dasharray="8 5"/><text x="320" y="297" font-size="30" font-weight="700" text-anchor="middle">Agent：围绕目标组织行动</text><rect x="78" y="326" width="484" height="130" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="369" font-size="30" font-weight="700" text-anchor="middle">LLM：提出下一步</text><text x="320.0" y="411" font-size="28" font-weight="400" text-anchor="middle">比较说明，或提出保存调用</text><polyline points="200,456 200,520" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><polyline points="440,520 440,456" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><text x="145" y="497" font-size="28" font-weight="400" text-anchor="middle">提议</text><text x="505" y="497" font-size="28" font-weight="400" text-anchor="middle">反馈</text><rect x="78" y="520" width="484" height="130" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="563" font-size="30" font-weight="700" text-anchor="middle">Runtime：控制怎样运行</text><text x="320.0" y="605" font-size="28" font-weight="400" text-anchor="middle">检查 · 分派 · 记录 · 停止</text><polyline points="320,650 320,700" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#back)"/><text x="320" y="744" font-size="28" font-weight="400" text-anchor="middle">工具：通过检查后，实际操作</text><text x="320" y="833" font-size="30" font-weight="700" text-anchor="middle">策略给出规则，程序落实边界</text><text x="320" y="880" font-size="28" font-weight="400" text-anchor="middle">模型输出“已批准”不等于授权</text><text x="320" y="926" font-size="28" font-weight="400" text-anchor="middle">本图按职责组织，不是进程部署图</text>
</svg>