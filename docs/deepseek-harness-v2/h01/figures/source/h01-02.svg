<text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">循环是主线，工程还要补上什么</text>
<rect x="36" y="104" width="568" height="136" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="147" font-size="30" font-weight="700" text-anchor="middle">循环主线</text><text x="320.0" y="189" font-size="28" font-weight="400" text-anchor="middle">模型提议 → 工具结果 → 再判断</text><text x="320" y="286" font-size="30" font-weight="700" text-anchor="middle">任务变长后，还要回答什么？</text><rect x="36" y="320" width="568" height="123" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="363" font-size="30" font-weight="700" text-anchor="middle">运行记录</text><text x="320.0" y="405" font-size="28" font-weight="400" text-anchor="middle">停在哪里？哪些动作确实发生过？</text><rect x="36" y="465" width="568" height="123" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320.0" y="508" font-size="30" font-weight="700" text-anchor="middle">执行前把关</text><text x="320.0" y="550" font-size="28" font-weight="400" text-anchor="middle">参数合格？有权执行？需要审批？</text><rect x="36" y="610" width="568" height="123" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="653" font-size="30" font-weight="700" text-anchor="middle">故障与停止</text><text x="320.0" y="695" font-size="28" font-weight="400" text-anchor="middle">继续还是停下？写入结果是否未知？</text><rect x="36" y="755" width="568" height="123" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="798" font-size="30" font-weight="700" text-anchor="middle">上下文与状态</text><text x="320.0" y="840" font-size="28" font-weight="400" text-anchor="middle">哪些历史进入下一次模型请求？</text><rect x="36" y="900" width="568" height="123" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="943" font-size="30" font-weight="700" text-anchor="middle">能力组合</text><text x="320.0" y="985" font-size="28" font-weight="400" text-anchor="middle">换模型、换工具，哪些规则继续复用？</text><text x="320" y="1090" font-size="28" font-weight="700" text-anchor="middle">实验 B 只演示前三项的内存缩影</text><text x="320" y="1134" font-size="28" 