<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1824" viewBox="0 0 640 1824" role="img" aria-labelledby="title desc">
<title id="title">从功能反向找到接口、实现与测试</title><desc id="desc">从真实原生工具能力出发，经应用入口、组合、服务、契约、提供方，找到跨包测试。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style>
<rect width="640" height="1824" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">从功能反向找到接口、实现与测试</text>
<text x="320" y="101" font-size="28" font-weight="400" text-anchor="middle">例：原生模式执行一个工具调用</text><text x="320" y="143" font-size="28" font-weight="400" text-anchor="middle">虚线 = 下一处查找，不是函数调用</text><rect x="36" y="184" width="568" height="190" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="227" font-size="32" font-weight="700" text-anchor="middle">用户功能与入口</text><text x="320.0" y="269" font-size="28" font-weight="400" text-anchor="middle">dsh 命令 → runCli</text><text x="320.0" y="307" font-size="28" font-weight="400" text-anchor="middle">apps/cli/src/bin.ts</text><polyline points="320,374 320,435" fill="none" stroke="#187A91" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="36" y="444" width="568" height="190" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320.0" y="487" font-size="32" font-weight="700" text-anchor="middle">组合：确认原生实现参与</text><text x="320.0" y="529" font-size="28" font-weight="400" text-anchor="middle">headless 模板 → base patch</text><text x="320.0" y="567" font-size="28" font-weight="400" text-anchor="middle">packages/bundle/base/</text><polyline points="320,634 320,695" fill="none" stroke="#187A91" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="36" y="704" width="568" height="190" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="747" font-size="32" font-weight="700" text-anchor="middle">服务：谁接收执行请求？</text><text x="320.0" y="789" font-size="28" font-weight="400" text-anchor="middle">ToolsService.execute</text><text x="320.0" y="827" font-size="28" font-weight="400" text-anchor="middle">packages/core/tools/src/index.ts</text><polyline points="320,894 320,955" fill="none" stroke="#187A91" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="36" y="964" width="568" height="190" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1007" font-size="32" font-weight="700" text-anchor="middle">接口：先读输入与输出</text><text x="320.0" y="1049" font-size="28" font-weight="400" text-anchor="middle">ToolExecutor</text><text x="320.0" y="1087" font-size="28" font-weight="400" text-anchor="middle">packages/core/tools/src/executor.ts</text><polyline points="320,1154 320,1215" fill="none" stroke="#187A91" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="36" y="1224" width="568" height="190" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1267" font-size="32" font-weight="700" text-anchor="middle">实现：原生执行器包</text><text x="320.0" y="1309" font-size="28" font-weight="400" text-anchor="middle">packages/core/tool-executor-native/</text><text x="320.0" y="1347" font-size="28" font-weight="400" text-anchor="middle">apply() / NativeToolExecutor.execute()</text><polyline points="320,1414 320,1475" fill="none" stroke="#187A91" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><rect x="36" y="1484" width="568" height="190" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1527" font-size="32" font-weight="700" text-anchor="middle">测试：全仓搜索具体符号</text><text x="320.0" y="1569" font-size="28" font-weight="400" text-anchor="middle">packages/core/agent-loop/tests/</text><text x="320.0" y="1607" font-size="28" font-weight="400" text-anchor="middle">tool-executors.spec.ts</text><text x="320" y="1745" font-size="28" font-weight="700" text-anchor="middle">先核身份，再核实现，最后核断言</text><text x="320" y="1789" font-size="28" font-weight="400" text-anchor="middle">已安装 ≠ 已挂载；读到测试 ≠ 已运行</text></svg>