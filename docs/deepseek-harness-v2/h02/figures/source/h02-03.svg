<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1230" viewBox="0 0 640 1230" role="img" aria-labelledby="title desc">
<title id="title">三种关系，不共用一个依赖箭头</title><desc id="desc">静态导入和构建引用指向工具包或项目，运行时工具服务调用当前选中的原生执行器。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#187A91"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#15394B}</style>
<rect width="640" height="1230" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">三种关系，不共用一个依赖箭头</text>
<text x="320" y="101" font-size="28" font-weight="400" text-anchor="middle">先说明节点和箭头分别表示什么</text><rect x="24" y="150" width="592" height="264" rx="20" fill="white" stroke="#187A91" stroke-width="2"/><text x="320" y="194" font-size="32" font-weight="700" text-anchor="middle">源码依赖</text><rect x="42" y="235" width="260" height="82" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="172.0" y="278" font-size="32" font-weight="700" text-anchor="middle">原生执行器包</text><rect x="338" y="235" width="260" height="82" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="468.0" y="278" font-size="32" font-weight="700" text-anchor="middle">工具服务包</text><polyline points="302,276 338,276" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="358" font-size="28" font-weight="700" text-anchor="middle">类型 / 值导入</text><text x="320" y="396" font-size="28" font-weight="400" text-anchor="middle">导入方 → 被导入模块</text><rect x="24" y="450" width="592" height="264" rx="20" fill="white" stroke="#187A91" stroke-width="2"/><text x="320" y="494" font-size="32" font-weight="700" text-anchor="middle">构建引用</text><rect x="42" y="535" width="260" height="82" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="172.0" y="578" font-size="32" font-weight="700" text-anchor="middle">执行器项目</text><rect x="338" y="535" width="260" height="82" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="468.0" y="578" font-size="32" font-weight="700" text-anchor="middle">tools 项目</text><polyline points="302,576 338,576" fill="none" stroke="#187A91" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="320" y="658" font-size="28" font-weight="700" text-anchor="middle">项目引用</text><text x="320" y="696" font-size="28" font-weight="400" text-anchor="middle">当前项目 → 被引用项目</text><rect x="24" y="750" width="592" height="264" rx="20" fill="white" stroke="#187A91" stroke-width="2"/><text x="320" y="794" font-size="32" font-weight="700" text-anchor="middle">运行时调用</text><rect x="42" y="835" width="260" height="82" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="172.0" y="878" font-size="32" font-weight="700" text-anchor="middle">工具服务对象</text><rect x="338" y="835" width="260" height="82" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="468.0" y="878" font-size="32" font-weight="700" text-anchor="middle">原生执行器对象</text><polyline points="302,876 338,876" fill="none" stroke="#187A91" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="958" font-size="28" font-weight="700" text-anchor="middle">调用 execute</text><text x="320" y="996" font-size="28" font-weight="400" text-anchor="middle">前提：已选中原生执行器</text><text x="320" y="1105" font-size="28" font-weight="400" text-anchor="middle">运行期还会登记对象、调用共享函数</text><text x="320" y="1150" font-size="28" font-weight="700" text-anchor="middle">反向调用 ≠ 包一定反向 import</text><text x="320" y="1194" font-size="28" font-weight="400" text-anchor="middle">一对包可以同时具有多种关系</text></svg>