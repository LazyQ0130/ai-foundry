<rect width="640" height="1950" fill="#F3F9F8"/><text x="320" y="55" font-size="32" font-weight="700" text-anchor="middle">仓库地图：从职责找到阅读区域</text>
<text x="320" y="101" font-size="28" font-weight="400" text-anchor="middle">按问题选区，不按文件夹顺序通读</text><rect x="36" y="135" width="568" height="170" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="178" font-size="32" font-weight="700" text-anchor="middle">根清单：先确认成员与工具链</text><text x="320.0" y="220" font-size="28" font-weight="400" text-anchor="middle">package.json</text><text x="320.0" y="258" font-size="28" font-weight="400" text-anchor="middle">pnpm-workspace.yaml</text><rect x="36" y="345" width="568" height="170" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="388" font-size="32" font-weight="700" text-anchor="middle">apps：入口与载体</text><text x="320.0" y="430" font-size="28" font-weight="400" text-anchor="middle">cli 命令 · web 浏览器入口</text><text x="320.0" y="468" font-size="28" font-weight="400" text-anchor="middle">desktop / desktop-host 桌面载体</text><rect x="24" y="555" width="592" height="805" rx="24" fill="white" stroke="#187A91" stroke-width="3"/><text x="320" y="601" font-size="32" font-weight="700" text-anchor="middle">packages：选读分组</text><rect x="48" y="625" width="544" height="150" rx="18" fill="#D9F4E9" stroke="#187A91" stroke-width="2"/><text x="320.0" y="668" font-size="32" font-weight="700" text-anchor="middle">core / 主干包</text><text x="320.0" y="710" font-size="28" font-weight="400" text-anchor="middle">agent、agent-loop、tools、session</text><rect x="48" y="805" width="544" height="150" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="848" font-size="32" font-weight="700" text-anchor="middle">能力组 / 契约、实现与工具</text><text x="320.0" y="890" font-size="28" font-weight="400" text-anchor="middle">fs、shell、llm、mcp、session …</text><rect x="48" y="985" width="544" height="150" rx="18" fill="#FFF0D7" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1028" font-size="32" font-weight="700" text-anchor="middle">组合与启动</text><text x="320.0" y="1070" font-size="28" font-weight="400" text-anchor="middle">bundle / 配置组合层</text><text x="320.0" y="1108" font-size="28" font-weight="400" text-anchor="middle">boot / 启动与装配辅助</text><rect x="48" y="1165" width="544" height="150" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1208" font-size="32" font-weight="700" text-anchor="middle">util / test-support</text><text x="320.0" y="1250" font-size="28" font-weight="400" text-anchor="middle">共享基础 / 测试支持</text><rect x="36" y="1400" width="568" height="170" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1443" font-size="32" font-weight="700" text-anchor="middle">仓库级基础与工程验证</text><text x="320.0" y="1485" font-size="28" font-weight="400" text-anchor="middle">vendor/：依赖源码</text><text x="320.0" y="1523" font-size="28" font-weight="400" text-anchor="middle">scripts/：构建与检查脚本</text><rect x="36" y="1610" width="568" height="170" rx="18" fill="#DDEDF5" stroke="#187A91" stroke-width="2"/><text x="320.0" y="1653" font-size="32" font-weight="700" text-anchor="middle">文档：先全局，再子系统与包</text><text x="320.0" y="1695" font-size="28" font-weight="400" text-anchor="middle">docs/architecture · docs/subsystems</text><text x="320.0" y="1733" font-size="28" font-weight="400" text-anchor="middle">各分组与各包的 README</text><text x="320" y="1830" font-size="28" font-weight="700" text-anchor="middle">core 是分组；core/tools 才是包</text><text x="320" y="1874" font-size="28" font-weight="400" text-anchor="middle">apps 中也有独立索引生成器</text><text x="320" y="1918" font-size="28" font-weight="400" text-anchor="middle">容器表示源码归属，不表示部署边界</text></svg>