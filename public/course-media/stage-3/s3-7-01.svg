<svg xmlns="http://www.w3.org/2000/svg" width="800" height="920" viewBox="0 0 800 920" role="img" aria-label="固定题集怎样帮助改进">
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#187A91" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="800" height="920" rx="28" fill="#F3F9F8"/>
<text x="400" y="60" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="34" font-weight="700" fill="#15394B">固定题集怎样帮助改进</text>
<text x="400" y="105" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="22" fill="#477083">自动指标与人工支持度复核一起看</text>
<rect x="74" y="150" width="652" height="94" rx="22" fill="#DDEDF5" stroke="#2C739A" stroke-width="3"/>
<circle cx="130" cy="197" r="29" fill="#2C739A"/>
<text x="130" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">1</text>
<text x="185" y="192" font-family="Arial,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#15394B">Eval Set</text>
<text x="185" y="224" font-family="Arial,Microsoft YaHei,sans-serif" font-size="22" fill="#376477">固定 8 道可答、4 道无答案</text>
<path d="M400 250 V273" fill="none" stroke="#187A91" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="74" y="282" width="652" height="94" rx="22" fill="#D9F4E9" stroke="#138B79" stroke-width="3"/>
<circle cx="130" cy="329" r="29" fill="#138B79"/>
<text x="130" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">2</text>
<text x="185" y="324" font-family="Arial,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#15394B">RAG</text>
<text x="185" y="356" font-family="Arial,Microsoft YaHei,sans-serif" font-size="22" fill="#376477">顺序运行，每题只调用一次</text>
<path d="M400 382 V405" fill="none" stroke="#187A91" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="74" y="414" width="652" height="94" rx="22" fill="#DDEDF5" stroke="#2C739A" stroke-width="3"/>
<circle cx="130" cy="461" r="29" fill="#2C739A"/>
<text x="130" y="470" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">3</text>
<text x="185" y="456" font-family="Arial,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#15394B">自动指标</text>
<text x="185" y="488" font-family="Arial,Microsoft YaHei,sans-serif" font-size="22" fill="#376477">检索、状态、引用、耗时与用量</text>
<path d="M400 514 V537" fill="none" stroke="#187A91" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="74" y="546" width="652" height="94" rx="22" fill="#FFF0D7" stroke="#B47919" stroke-width="3"/>
<circle cx="130" cy="593" r="29" fill="#B47919"/>
<text x="130" y="602" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">4</text>
<text x="185" y="588" font-family="Arial,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#15394B">人工 Support Review</text>
<text x="185" y="620" font-family="Arial,Microsoft YaHei,sans-serif" font-size="22" fill="#376477">逐条看回答是否由来源支持</text>
<path d="M400 646 V669" fill="none" stroke="#187A91" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="74" y="678" width="652" height="94" rx="22" fill="#D9F4E9" stroke="#138B79" stroke-width="3"/>
<circle cx="130" cy="725" r="29" fill="#138B79"/>
<text x="130" y="734" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">5</text>
<text x="185" y="720" font-family="Arial,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#15394B">Error Categories</text>
<text x="185" y="752" font-family="Arial,Microsoft YaHei,sans-serif" font-size="22" fill="#376477">按失败类型找到改进依据</text>
<rect x="74" y="796" width="652" height="76" rx="18" fill="#E7F1F4" stroke="#80B6C0" stroke-width="2"/>
<text x="400" y="844" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#1D6577">12/12 也只说明这份固定知识包的表现</text>
</svg>